  je_gaudi_railway_project_reason: "[GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] [concept_tesla_civil_engineer]가 [GetPlayer.GetName]의 [GetBuildingType('building_usu_railway_line').GetName] 노선을 현대화하는 프로젝트를 시작했습니다. 이 프로젝트는 매달 진척도를 얻습니다. 진척도가 [JournalEntry.GetTotalGoalValue|V0]에 도달할 때마다, 가용 인프라가 가장 적은 주에 $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier]가 부여됩니다.\n\n현재 월간 진척도: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_civil_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_civil_engineering_progress_var').GetValue|2+] #!#!" # 7113263813974748174
  je_gaudi_new_locomotives_project_reason: "[GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] [concept_tesla_mechanical_engineer]가 [GetPlayer.GetName]를 위해 새로운 유형의 기관차를 제작하기 위해 끊임없이 노력하고 있습니다. 이 프로젝트는 매달 진척도를 얻습니다. 매달 진척도가 [JournalEntry.GetTotalGoalValue|V0]에 도달하면, 새로운 기관차가 [GetBuildingType('building_usu_railway_line').GetName] 건물에 배치됩니다. 레벨이 가장 높은 건물이 보정치를 가장 먼저 받게 됩니다. 모든 건물이 해당 보정치를 보유하면 진척도 바가 초기화됩니다.\n획득 가능한 보정치는 총 5개입니다. 새로운 보정치를 얻으려면 진척도를 다시 채워야 합니다.\n\n현재 월간 진척도: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_mechanical_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_mechanical_engineering_progress_var').GetValue|2+] #!#!" # 6537943207159772971
  gaudi_railways_with_new_locomotives_tt: "모든 [GetPlayer.GetAdjective] [GetBuildingType('building_usu_railway_line').GetName]가 5개의 보정치를 모두 보유하고 있습니다.\n- 1단계 보정치 보유 건물: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_first_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n- 2단계 보정치 보유 건물: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_second_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n- 3단계 보정치 보유 건물: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_third_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n- 4단계 보정치 보유 건물: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_fourth_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n- 5단계 보정치 보유 건물: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_modifiers_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]" # 679364520357572507
  MR_CIVIL_ENGINEER_INFRASTRUCTURE_TRIGGER_TT: "#default_text 귀국 내의 어떤 주도 모든 인프라 [Concept('concept_modifier','$concept_modifiers$')]를 보유하고 있지 않습니다. 철도 보정치를 얻으려면 해당 주에 [GetBuildingType('building_usu_railway_line').GetName]가 필요합니다.#!" # 17790924142290573386
  MR_MECHANICAL_ENGINEER_LOCOMOTIVES_BUTTON_TT: "#T 새로운 기관차 개발#!\n[concept_tesla_engineer]가 [GetBuildingType('building_usu_railway_line').GetName] 건물에 보너스를 제공할 새로운 기관차 제작에 집중하게 하십시오. 이는 국가에 #n 비용#!을 추가합니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" # 12362434028241104428
  MR_MECHANICAL_ENGINEER_LOCOMOTIVES_TRIGGER_TT: "#default_text 레벨 1 이상의 [GetBuildingType('building_usu_railway_line').GetName] 중 적어도 하나가 5개의 기관차 [Concept('concept_modifier','$concept_modifiers$')]를 모두 보유하지 않았습니다.#!" # 6858140957542864101
  MR_CIVIL_ENGINEER_RAILWAY_BUTTON_TT: "#T 철도 프로젝트#!\n[concept_tesla_engineer]가 [GetPlayer.GetName]의 [GetBuildingType('building_usu_railway_line').GetName]를 개선하는 데 집중하게 하십시오. 주의 우선순위를 정할 수 있으며, 해당 주의 철도는 건물의 [concept_throughput]를 개선하는 $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier]를 얻게 됩니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]" # 7160542143792883585
  MR_CIVIL_ENGINEER_RAILWAY_TRIGGER_TT: "#default_text [GetPlayer.GetName]에 $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier]가 없는 [GetBuildingType('building_usu_railway_line').GetName]가 있습니다.#!" # 11340981031451239167
