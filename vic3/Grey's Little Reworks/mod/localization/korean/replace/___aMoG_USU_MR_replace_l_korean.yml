  building_mendelejew_hydrogenation_plants_throughput_add: "$building_mendelejew_hydrogenation_plants$ 건물 [concept_throughput]" # 3184945903931298346
  building_mendelejew_hydrogenation_plants_throughput_add_desc: "$building_mendelejew_hydrogenation_plants$의 투입물 및 산출물 모두에 대한 보너스 또는 패널티" # 5425896054374952733
  building_mendelejew_synthetic_rubber_factory_throughput_add: "$building_mendelejew_synthetic_rubber_factory$ 건물 [concept_throughput]" # 6710941170098460058
  building_mendelejew_synthetic_rubber_factory_throughput_add_desc: "$building_mendelejew_synthetic_rubber_factory$의 투입물과 산출물 모두에 적용되는 보너스 또는 패널티입니다." # 13201224793040407666
  je_gaudi_railway_project_reason: "Your [concept_tesla_civil_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] started a project to modernize the [GetBuildingType('building_usu_railway_line').GetName] lines in [GetPlayer.GetName]. The Project will get Progress every month. Every time the progress reaches [JournalEntry.GetTotalGoalValue|V0] the State with the least available Infrastructure will get the $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier].\n\nCurrent monthly progress: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_civil_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_civil_engineering_progress_var').GetValue|2+] #!#!"
  je_gaudi_new_locomotives_project_reason: "Your [concept_tesla_mechanical_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] is working tirelessly to construct new types of locomotives for [GetPlayer.GetName]. The Project will get Progress every month. Once the progress reaches [JournalEntry.GetTotalGoalValue|V0] each month the new locomotives will be deployed to a [GetBuildingType('building_usu_railway_line').GetName] building. The building with the highest level will get the Modifier first. The progress bar will reset once all buildings have that modifier.\nThere is a total number of 5 modifiers to gain. Each new modifier needs the progress to fill up again.\n\nCurrent monthly progress: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_mechanical_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_mechanical_engineering_progress_var').GetValue|2+] #!#!"
  gaudi_railways_with_new_locomotives_tt: "All [GetPlayer.GetAdjective] [GetBuildingType('building_usu_railway_line').GetName] have the 5 Modifiers.\n- Buildings with 1st modifier: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_first_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n- Buildings with 2nd modifier: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_second_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n- Buildings with 3rd modifier: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_third_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n- Buildings with 4th modifier: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_fourth_modifier_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]\n- Buildings with 5th modifier: [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_with_modifiers_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('gaudi_num_railway_buildings_var').GetValue|V0]"
  MR_CIVIL_ENGINEER_INFRASTRUCTURE_TRIGGER_TT: "#default_text Any State in your country does not have the all the infrastructure [Concept('concept_modifier','$concept_modifiers$')]. A state needs a [GetBuildingType('building_usu_railway_line').GetName] to get the railway modifier.#!"
  MR_MECHANICAL_ENGINEER_LOCOMOTIVES_BUTTON_TT: "#T Develop new Locomotives#!\nLet your [concept_tesla_engineer] focus on constructing new locomotives that will give a bonus to your [GetBuildingType('building_usu_railway_line').GetName] buildings. This will add #n expenses#! to your country.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
  MR_MECHANICAL_ENGINEER_LOCOMOTIVES_TRIGGER_TT: "#default_text At least one [GetBuildingType('building_usu_railway_line').GetName] of level 1 or higher does not have all five locomotive [Concept('concept_modifier','$concept_modifiers$')].#!"
  MR_CIVIL_ENGINEER_RAILWAY_BUTTON_TT: "#T Railroad Project#!\nLet your [concept_tesla_engineer] focus on improving the [GetBuildingType('building_usu_railway_line').GetName] in [GetPlayer.GetName]. You will be able to prioritize states and the railways in those states will get the $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] which improves the [concept_throughput] of the building.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
  MR_CIVIL_ENGINEER_RAILWAY_TRIGGER_TT: "#default_text [GetPlayer.GetName] has a [GetBuildingType('building_usu_railway_line').GetName] without the $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier].#!"
