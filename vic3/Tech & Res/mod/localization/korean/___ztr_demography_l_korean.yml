  ztr_demography_vital_rates: "$ztr_demography_vital_births_label$#v [Multiply_CFixedPoint(Max_CFixedPoint(Max_CFixedPoint(Add_CFixedPoint(GetPlayer.MakeScope.ScriptValue('ztr_demography_birth_base'), Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('ztr_demography_birth_share'), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000'))), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000')), '(CFixedPoint)0'), GetPlayer.MakeScope.ScriptValue('ztr_demography_population_thousands'))|*]#!$ztr_demography_vital_deaths_label$#v [Multiply_CFixedPoint(Subtract_CFixedPoint(Max_CFixedPoint(Max_CFixedPoint(Add_CFixedPoint(GetPlayer.MakeScope.ScriptValue('ztr_demography_birth_base'), Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('ztr_demography_birth_share'), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000'))), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000')), '(CFixedPoint)0'), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000')), GetPlayer.MakeScope.ScriptValue('ztr_demography_population_thousands'))|*]#!$ztr_demography_vital_children_label$#v [Multiply_CFixedPoint(Max_CFixedPoint(Max_CFixedPoint(Add_CFixedPoint(GetPlayer.MakeScope.ScriptValue('ztr_demography_birth_base'), Multiply_CFixedPoint(GetPlayer.MakeScope.ScriptValue('ztr_demography_birth_share'), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000'))), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000')), '(CFixedPoint)0'), GetPlayer.MakeScope.ScriptValue('ztr_demography_fertility_factor'))|2]#!"
  je_demography_status: "Moving #tooltippable;tooltip:[ROOT.GetCountry.GetTooltipTag],ztr_demography_progress_tt [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_recorded_yearly_change')|+=1]#! points a year."
  ztr_demography_progress_tt: "#header @population! Yearly Progress#!\nChange: #tooltippable;tooltip:[Country.GetTooltipTag],ztr_demography_limit_tt [Country.MakeScope.ScriptValue('ztr_demography_recorded_yearly_change')|+=1]#! points a year\n$TOOLTIP_DELIMITER$[AddLocalizationIf(Or(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_gain'), '(CFixedPoint)0'), EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_economy'), '(CFixedPoint)0')), 'ztr_demography_gain_block')][AddLocalizationIf(And(Or(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_gain'), '(CFixedPoint)0'), EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_economy'), '(CFixedPoint)0')), LessThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_loss'), '(CFixedPoint)0')), 'ztr_demography_block_gap')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_loss'), '(CFixedPoint)0'), 'ztr_demography_loss_block')]"
  ztr_demography_block_gap: "\n"
  ztr_demography_gain_block: "\nTotal gain of [Country.MakeScope.ScriptValue('ztr_demography_shown_gain')|+=1] points is due to:[AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_drift'), '(CFixedPoint)0'), 'ztr_demography_line_drift')][AddLocalizationIf(GreaterThanOrEqualTo_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_economy'), '(CFixedPoint)0'), 'ztr_demography_line_momentum')][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_extra_gain'), '(CFixedPoint)0'), 'ztr_demography_line_factors_gain')][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_limit'), '(CFixedPoint)0'), 'ztr_demography_line_limit')]"
  ztr_demography_loss_block: "\nTotal loss of [Country.MakeScope.ScriptValue('ztr_demography_shown_loss')|+=1] points is due to:[AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_drift'), '(CFixedPoint)0'), 'ztr_demography_line_drift')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_economy'), '(CFixedPoint)0'), 'ztr_demography_line_momentum')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_extra_loss'), '(CFixedPoint)0'), 'ztr_demography_line_factors_loss')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_limit'), '(CFixedPoint)0'), 'ztr_demography_line_limit')]"
  ztr_demography_line_drift: "\n$TAB$[Country.MakeScope.ScriptValue('ztr_demography_shown_drift')|+=1] from [concept_demographic_drift]"
  ztr_demography_line_momentum: "\n$TAB$#tooltippable;tooltip:[Country.GetTooltipTag],ztr_demography_momentum_tt [Country.MakeScope.ScriptValue('ztr_demography_shown_economy')|+=1]#! from [concept_social_momentum]"
  ztr_demography_line_limit: "\n$TAB$#tooltippable;tooltip:[Country.GetTooltipTag],ztr_demography_limit_tt [Country.MakeScope.ScriptValue('ztr_demography_shown_limit')|+=1]#! from the Yearly Limit"
  ztr_demography_line_factors_gain: "\n$TAB$#tooltippable;tooltip:[Country.GetTooltipTag],ztr_demography_factors_tt [Country.MakeScope.ScriptValue('ztr_demography_shown_extra_gain')|+=1]#! from [concept_demographic_factors][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_healthcare'), '(CFixedPoint)0'), 'ztr_demography_sub_healthcare')][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_slavery'), '(CFixedPoint)0'), 'ztr_demography_sub_slavery')][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_immigration'), '(CFixedPoint)0'), 'ztr_demography_sub_immigration')][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_pronatalism'), '(CFixedPoint)0'), 'ztr_demography_sub_pronatalism')][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_traditional'), '(CFixedPoint)0'), 'ztr_demography_sub_traditional')][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_region'), '(CFixedPoint)0'), 'ztr_demography_sub_region')]"
  ztr_demography_line_factors_loss: "\n$TAB$#tooltippable;tooltip:[Country.GetTooltipTag],ztr_demography_factors_tt [Country.MakeScope.ScriptValue('ztr_demography_shown_extra_loss')|+=1]#! from [concept_demographic_factors][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_healthcare'), '(CFixedPoint)0'), 'ztr_demography_sub_healthcare')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_slavery'), '(CFixedPoint)0'), 'ztr_demography_sub_slavery')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_immigration'), '(CFixedPoint)0'), 'ztr_demography_sub_immigration')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_pronatalism'), '(CFixedPoint)0'), 'ztr_demography_sub_pronatalism')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_traditional'), '(CFixedPoint)0'), 'ztr_demography_sub_traditional')][AddLocalizationIf(LessThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_region'), '(CFixedPoint)0'), 'ztr_demography_sub_region')]"
  ztr_demography_item_healthcare: "[Country.MakeScope.ScriptValue('ztr_demography_shown_healthcare')|+=1] from [GetLawGroup('lawgroup_health_system').GetName]"
