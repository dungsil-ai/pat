  notification_ztr_demography_stage_advanced_name: "인구 통계 단계 진전" # 4436814365824175855
  notification_ztr_demography_stage_advanced_tooltip: "#header $notification_ztr_demography_stage_advanced_name$#!\n$notification_ztr_demography_stage_advanced_desc$" # 15513242624947343578
