  ztr_demography_sub_slavery: "\n$TAB$$TAB$$ztr_demography_item_slavery$"
  ztr_demography_own_slavery: "\n$ztr_demography_item_slavery$"
  ztr_demography_item_immigration: "[Country.MakeScope.ScriptValue('ztr_demography_shown_immigration')|+=1] from [GetLawGroup('lawgroup_citizenship').GetName] / [GetLawGroup('lawgroup_migration').GetName]"
  ztr_demography_sub_immigration: "\n$TAB$$TAB$$ztr_demography_item_immigration$"
  ztr_demography_own_immigration: "\n$ztr_demography_item_immigration$"
  ztr_demography_item_pronatalism: "[Country.MakeScope.ScriptValue('ztr_demography_shown_pronatalism')|+=1] from [GetLawType('law_coercive_pronatalism').GetName]"
