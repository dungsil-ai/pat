  notification_ztr_demography_stage_regressed_tooltip: "#header $notification_ztr_demography_stage_regressed_name$#!\n$notification_ztr_demography_stage_regressed_desc$" # 22752574913911349
  ztr_demography_stage_flavour_unknown: "출생률과 사망률을 여전히 조사 중인 단계입니다" # 12772606969588389011
  je_demography_reason: "[ROOT.GetCountry.GetName]은(는) [Concept('concept_demographic_stages','$concept_demographic_stages$')]의 8단계 중 #v [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_applied_stage')|0]#! 단계에 있습니다: [SCOPE.GetRootScope.GetCountry.GetCustom('ztr_demography_stage_flavour')].\n\n진척도는 0에서 900까지이며, 100점마다 단계가 바뀌고 8단계는 900까지 이어집니다. 이는 양방향으로 이동하므로, 임계값을 넘으면 단계가 상승하거나 다시 하락할 수 있습니다.\n\n[Concept('concept_literacy','$concept_literacy$')]가 전체 변천의 규모를 결정하며, [Concept('concept_sol','$concept_sol$')]과 1인당 GDP의 5년간 변화가 방향을 결정합니다. 성장은 초기 단계를 가속화하고 후기 감소를 억제하며, 정체는 초기 단계를 늦추고 후기 단계를 심화시킵니다.\n\n의료 서비스는 변천 속도를 높입니다. 전통적 가치, 법적 노예제, 개방적 이민은 변천 속도를 늦춥니다." # 4261707503639093503
  je_demography_collecting_history: "연간 #variable [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_recorded_yearly_change')|+=1]#! 포인트씩 이동 중입니다.\n경제적 반응은 5년간의 기록이 쌓인 후에 시작됩니다." # 8263320488203229833
  je_demography_status: "연간 #variable [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_recorded_yearly_change')|+=1]#! 포인트씩 이동 중입니다.\n사회로부터 #variable [ROOT.GetCountry.MakeScope.Var('ztr_demography_formula_change_var').GetValue|+=1]#! 포인트, 문화/법률로부터 #variable [ROOT.GetCountry.MakeScope.Var('ztr_demography_extra_change_var').GetValue|+=1]#! 포인트를 얻습니다." # 14037038937749178580
  ztr_demography_progress_bar_desc: "단계 #v [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_applied_stage')|0]#!: [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/900" # 14384172696858077534
  notification_ztr_demography_stage_advanced_desc: "우리의 인구 변천이 #v [GetPlayer.MakeScope.ScriptValue('ztr_demography_applied_stage')|0]#! 단계에 도달했습니다. 이에 따라 출생률과 사망률이 변동합니다." # 13737702487771251277
  notification_ztr_demography_stage_regressed_desc: "우리의 인구 변천이 #v [GetPlayer.MakeScope.ScriptValue('ztr_demography_applied_stage')|0]#! 단계로 후퇴했습니다. 정체된 생활 수준과 소득으로 인해 그동안의 진전 중 일부가 되돌아갔습니다." # 16462689767267478482
  je_demography: "Demography"
  ztr_demography_vital_rates: "[AddLocalizationIf(Country.IsValid,'ztr_demography_vital_births_label')]#v [Multiply_CFixedPoint(Max_CFixedPoint(Max_CFixedPoint(Add_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_birth_base'), Multiply_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_birth_share'), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000'))), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000')), '(CFixedPoint)0'), Country.MakeScope.ScriptValue('ztr_demography_population_thousands'))|*]#![AddLocalizationIf(Country.IsValid,'ztr_demography_vital_deaths_label')]#v [Multiply_CFixedPoint(Subtract_CFixedPoint(Max_CFixedPoint(Max_CFixedPoint(Add_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_birth_base'), Multiply_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_birth_share'), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000'))), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000')), '(CFixedPoint)0'), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000')), Country.MakeScope.ScriptValue('ztr_demography_population_thousands'))|*]#![AddLocalizationIf(Country.IsValid,'ztr_demography_vital_children_label')]#v [Multiply_CFixedPoint(Max_CFixedPoint(Max_CFixedPoint(Add_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_birth_base'), Multiply_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_birth_share'), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000'))), Multiply_CFixedPoint('(CFixedPoint)$NETGROWTHRATE|5$', '(CFixedPoint)1000')), '(CFixedPoint)0'), Country.MakeScope.ScriptValue('ztr_demography_fertility_factor'))|2]#!"
