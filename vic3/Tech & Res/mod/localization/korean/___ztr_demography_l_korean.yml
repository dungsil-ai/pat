  ztr_demography_stage_flavour_1: "#v 산업화 초기#! 단계로, #positive_value 출생률#!은 #v 매우 높고#! #negative_value 사망률#!은 #v 보통이라#! [Concept('concept_pop_growth','$concept_pop_growth$')]이 #v 높습니다#!" # 9373453901525506664
  ztr_demography_stage_flavour_2: "#v 산업화 중기#! 단계로, #positive_value 출생률#!은 #v 높고#! #negative_value 사망률#!은 #v 낮아#! [Concept('concept_pop_growth','$concept_pop_growth$')]이 #v 높습니다#!" # 3423133242288601836
