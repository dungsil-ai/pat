  ztr_demography_own_pronatalism: "\n$ztr_demography_item_pronatalism$"
  ztr_demography_item_traditional: "[Country.MakeScope.ScriptValue('ztr_demography_shown_traditional')|+=1] from Culture"
  ztr_demography_sub_traditional: "\n$TAB$$TAB$$ztr_demography_item_traditional$"
  ztr_demography_own_traditional: "\n$ztr_demography_item_traditional$"
  ztr_demography_item_region: "[Country.MakeScope.ScriptValue('ztr_demography_shown_region')|+=1] from [Country.GetCustom('ztr_demography_region_name')]"
  ztr_demography_sub_region: "\n$TAB$$TAB$$ztr_demography_item_region$"
  ztr_demography_own_region: "\n$ztr_demography_item_region$"
  ztr_demography_factors_tt: "#header [concept_demographic_factors]#!\n[Country.MakeScope.ScriptValue('ztr_demography_shown_extra')|+=1] points a year\n$TOOLTIP_DELIMITER$[AddLocalizationIf(NotEqualTo_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_healthcare'), '(CFixedPoint)0'), 'ztr_demography_own_healthcare')][AddLocalizationIf(NotEqualTo_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_slavery'), '(CFixedPoint)0'), 'ztr_demography_own_slavery')][AddLocalizationIf(NotEqualTo_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_immigration'), '(CFixedPoint)0'), 'ztr_demography_own_immigration')][AddLocalizationIf(NotEqualTo_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_pronatalism'), '(CFixedPoint)0'), 'ztr_demography_own_pronatalism')][AddLocalizationIf(NotEqualTo_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_traditional'), '(CFixedPoint)0'), 'ztr_demography_own_traditional')][AddLocalizationIf(NotEqualTo_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_region'), '(CFixedPoint)0'), 'ztr_demography_own_region')]\n\nLaws and culture speed up or hold back the [Concept('concept_demographic_stages','$concept_demographic_stages|q$')] regardless of [concept_literacy] and [concept_sol]."
  ztr_demography_momentum_growth: "\n[Country.MakeScope.ScriptValue('ztr_demography_shown_growth')|+=%1] growth of [concept_sol] and GDP per capita over five years"
  ztr_demography_momentum_collecting: "\nNot active yet: it needs five years of recorded history."
  ztr_demography_limit_tt: "#header Yearly Limit#!\n[Country.MakeScope.ScriptValue('ztr_demography_recorded_yearly_change')|+=1] points a year\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.ScriptValue('ztr_demography_shown_uncapped')|+=1] from all factors[AddLocalizationIf(NotEqualTo_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_limit'), '(CFixedPoint)0'), 'ztr_demography_own_limit')]\n\nYearly progress is limited to [Country.MakeScope.ScriptValue('ztr_demography_max_gain')|+=0] and [Country.MakeScope.ScriptValue('ztr_demography_max_loss')|+=0] points."
  ztr_demography_own_limit: "\n[Country.MakeScope.ScriptValue('ztr_demography_shown_limit')|+=1] from the Yearly Limit"
  ztr_demography_region_north_america_name: "North America"
  ztr_demography_region_oceania_name: "Oceania"
  ztr_demography_region_latin_america_name: "Latin America"
  ztr_demography_region_none_name: "Region"
  je_demography_reason: "[ROOT.GetCountry.GetName] is in stage #v [ROOT.GetCountry.MakeScope.ScriptValue('ztr_demography_applied_stage')|0]#! of 9 of the [Concept('concept_demographic_stages','$concept_demographic_stages|q$')]: [SCOPE.GetRootScope.GetCountry.GetCustom('ztr_demography_stage_flavour')].\n\n[ROOT.GetCountry.GetPopGrowthDesc]\n\nStage 1 covers #b 0 to 200#!, then every #b #white 100#! Points#! the country moves to the next stage.\n#white Yearly Progress#! is limited to #positive_value +15#! and #negative_value -5#! points."
  ztr_demography_momentum_tt: "#header [concept_social_momentum]#!\n[Country.MakeScope.ScriptValue('ztr_demography_shown_economy')|+=1] points a year\n$TOOLTIP_DELIMITER$[AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_growth_ready'), '(CFixedPoint)0'), 'ztr_demography_momentum_growth')][AddLocalizationIf(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_growth_capped'), '(CFixedPoint)0'), 'ztr_demography_momentum_capped')][AddLocalizationIf(EqualTo_CFixedPoint(Country.MakeScope.ScriptValue('ztr_demography_shown_growth_ready'), '(CFixedPoint)0'), 'ztr_demography_momentum_collecting')]\n\nGrowth above #v [Country.MakeScope.ScriptValue('ztr_demography_growth_threshold')|%0]#! counts as improvement, up to #v [Country.MakeScope.ScriptValue('ztr_demography_growth_cap')|%0]#!: it speeds up stages 1 to 6 and slows down the later ones. No effect while the average [concept_sol] is below #v [Country.MakeScope.ScriptValue('ztr_demography_economy_sol_floor')|0]#!."
  ztr_demography_momentum_capped: "\n$TAB$Counted only up to #v [Country.MakeScope.ScriptValue('ztr_demography_growth_cap')|%0]#!"
