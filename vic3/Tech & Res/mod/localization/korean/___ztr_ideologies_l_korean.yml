l_korean:
  ideology_neg_ambientalist: "태만한 환경주의자" # 11697916728518488379
  ideology_neg_ambientalist_desc: "#lore 이 집단은 환경에는 전혀 개의치 않으며, 특히 자신들의 경제적 이익과 상충할 경우에는 더욱 그러하다.#!" # 4306592019406009604
  ideology_moderate_ambientalist: "온건 환경주의자" # 563719320636335776
  ideology_moderate_ambientalist_desc: "#lore 이 집단은 환경 보호가 중요하다고 믿지만, 사람들의 생활 방식과 균형을 이루어야 한다고 생각합니다. #!" # 1790613732955378273
  ideology_extreme_ambientalist: "극단적 환경주의자" # 16762403836138840675
  ideology_extreme_ambientalist_desc: "#lore 이 집단은 환경 보호가 가장 중요한 문제이며, 다른 모든 우려보다 우선해야 한다고 믿습니다. 그들은 환경 보호를 위해 사회에 대한 급진적인 변화를 옹호합니다. #!" # 11829698919329549898
  ideology_neoliberal_ambientalist: "신자유주의 환경주의자" # 15636516149860596230
  ideology_neoliberal_ambientalist_desc: "#lore 이 집단은 사업과 경제에 해를 끼칠 수 있는 정부 개입보다는 시장 기반 해결책과 온건함을 통해 환경 보호를 달성할 수 있다고 믿습니다.#!" # 5895304363054400882
  ideology_extreme_traditionalist: "극단적 전통주의자" # 9712948032125331350
  ideology_extreme_traditionalist_desc: "#lore 이 집단은 변화와 근대화에 저항하더라도, 전통적인 가치와 관습이 어떠한 대가를 치르더라도 보존되어야 한다고 믿습니다. 이들은 종종 진보적인 움직임에 반대하며, 과거의 사회적 규범으로 회귀할 것을 옹호합니다.#!" # 5126414659859843687
  ideology_moderate_traditionalist: "온건 전통주의자" # 2394136607698549583
  ideology_moderate_traditionalist_desc: "#lore 이 집단은 전통적인 가치와 관습을 보존해야 한다고 믿지만, 어느 정도의 변화와 근대화에는 개방적입니다. 그들은 전통과 진보의 균형을 추구하며, 유산을 존중하면서도 현대적 요구에 적응하는 사회를 옹호합니다. #!" # 8085296025480598461
  ideology_moderate_progressist: "온건한 진보주의자" # 3824251480592404554
  ideology_moderate_progressist_desc: "#lore 이 집단은 점진적 발전과 개혁을 신봉하며, 기존 구조를 존중하는 한편 사회를 개선할 사회·경제적 변화를 옹호합니다. 그들은 혁신과 안정의 균형을 추구하며, 그 본질을 잃지 않고 진화하는 사회를 지향합니다.#!" # 2183492445752501649
  ideology_extreme_progressist: "과격 진보주의자" # 15599448824814220196
  ideology_extreme_progressist_desc: "#lore 이 집단은 기존의 권력 구조를 해체하고 직접 행동과 체제 개혁을 통해 보다 평등한 사회를 건설하려는 급진적인 미래 비전을 가지고 있습니다. 그들은 종종 혁명적인 사상을 수용하고 현상 유지에 도전합니다.#!" # 115178433788441920
  ideology_neoliberal_progressist: "신자유주의 진보주의자" # 18412380533215211984
  ideology_neoliberal_progressist_desc: "#lore 이 집단은 진보가 각 개인에게 중요하다고 믿지만, 그로 인해 산업과 경제가 훼손되어서는 안 된다고 주장합니다. 그들은 혁신과 경제 성장을 촉진하는 동시에, 진보의 혜택이 모든 시민에게 돌아가도록 보장하는 사회를 지지합니다.#!" # 14837123642058311862
  ideology_neoliberism: "신자유주의" # 2124705206738305270
  ideology_neoliberism_desc: "#lore 이 집단은 자유 시장 자본주의, 최소한의 정부 개입, 개인의 자유를 신봉합니다. 이들은 경제 성장과 개인의 책임을 증진하는 정책을 옹호하며, 과도한 규제와 사회 복지 프로그램에는 반대합니다.#!" # 17990751549211078990
  ideology_modern_individualism: "근대적 개인주의" # 14273592051578436260
  ideology_modern_individualism_desc: "#lore 포스트 케인스주의와 사회자유주의적 관점에서 재탄생한 고전적 자립의 신조입니다. 이 집단은 여전히 사적 기업, 자유 무역, 개방 시장을 옹호하지만, 복지 국가와도 타협했습니다. 연금, 임금 보조금, 고등 문해력은 더 이상 산업에 대한 위협이 아니라, 노동자가 곧 소비자가 되는 소비 사회의 토대로 간주됩니다. 근대적 개인주의자들은 개인의 존엄성이 자선이나 길드가 아닌, 대중의 번영과 이동성, 그리고 선택을 통해 가장 잘 지켜진다고 믿습니다.#!" # 5391596446288726496
  ideology_bioethics_traditionalist: "Bioethical Conservatism"
  ideology_bioethics_traditionalist_desc: "#lore This group holds that life is sacred from conception to natural death, and that family and adoption must follow the moral order handed down by tradition.#!"
  ideology_bioethics_progressist: "Bioethical Reformism"
  ideology_bioethics_progressist_desc: "#lore This group believes that medicine and law should serve individual choice, and that the state has no place deciding over birth, family and the end of life.#!"
  ideology_education_traditionalist: "Educational Conservatism"
  ideology_education_traditionalist_desc: "#lore This group sees higher learning as the preserve of a few, and believes young people belong in the fields, the workshop or the family business rather than in state classrooms.#!"
  ideology_education_progressist: "Educational Reformism"
  ideology_education_progressist_desc: "#lore This group believes that secondary schooling and public universities are the engine of national progress, and that education must be open to every citizen.#!"
  ideology_democratic_socialist: "Democratic Socialist"
  ideology_democratic_socialist_desc: "#lore This leader believes that democracy is unfinished until it reaches the workplace and the welfare office: public healthcare, pensions and free universities paid for by steeply progressive taxes, and key industries held in common, all won at the ballot box rather than on the barricades.#!"
  ideology_neoliberal: "Neoliberal"
  ideology_neoliberal_desc: "#lore This leader believes that markets allocate better than ministries: flat taxes, open borders for capital and goods, private insurance in place of public monopolies, and unions kept from holding the economy hostage. The state should set the rules and then step aside.#!"
  ideology_stalinist: "Stalinist"
  ideology_stalinist_desc: "#lore This leader believes that socialism must be built in one country and defended by any means: a single party, a planned economy, collectivised fields and a vigilant security apparatus that roots out saboteurs, priests and deviationists alike.#!"
  ideology_neofascist: "Neofascist"
  ideology_neofascist_desc: "#lore This leader inherits the old creed in a new suit: closed borders, a nation defined by blood and belonging, police with a free hand, and a crusade against the moral decline of permissive society. They speak the language of order and identity, and treat democracy as a means rather than an end.#!"
  ZTRPOL_NATURAL_IG: "Natural [concept_interest_group] for this ideology"
  ideology_third_way: "Third Way"
  ideology_third_way_desc: "#lore This leader believes that the old quarrel between market and state is over: open trade and a dynamic private sector, paired with a welfare state that rewards work, invests in education and regulates rather than owns. Equality of opportunity, not of outcome, is the goal.#!"
  ideology_green: "Green"
  ideology_green_desc: "#lore This leader believes that no economy can outgrow the planet that sustains it: polluting mines closed, damaged land restored, nuclear power abandoned, and a grassroots democracy that extends its rights to every minority and its care to future generations.#!"
  ideology_market_reformer: "Market Reformer"
  ideology_market_reformer_desc: "#lore This leader believes that it does not matter whether a cat is black or white, so long as it catches mice: the state keeps its grip on power, but fields return to the families who till them, factories answer to markets, and the borders open to foreign capital and know-how.#!"
  ideology_military_junta: "Military Junta"
  ideology_military_junta_desc: "#lore This leader believes that when politicians fail, the officers must step in: elections suspended until order returns, strikes broken, newspapers silenced, and the nation run like a well-drilled regiment. They promise to hand power back one day, and rarely do.#!"
  ideology_developmentalist: "Developmentalist"
  ideology_developmentalist_desc: "#lore This leader believes that a backward nation can only catch up under a strong hand: tariffs to shelter infant industries, the state steering credit and natural resources, schools and universities churning out engineers, and unions folded into the national effort.#!"
  ideology_new_left: "New Left"
  ideology_new_left_desc: "#lore This leader believes that liberation did not end with the vote and the pay packet: the generation of the barricades and the sit-ins demands sexual freedom, an end to conscription and police surveillance, open doors for every culture, and the right of every person to decide over their own body.#!"
  ideology_libertarian: "Libertarian"
  ideology_libertarian_desc: "#lore This leader believes that the individual owes nothing to the state but to leave others in peace: low taxes, no welfare and no censors, open borders, private medicine, and the freedom to live, love and die as one chooses.#!"
  ideology_neoconservative: "Neoconservative"
  ideology_neoconservative_desc: "#lore This leader believes that free markets and traditional values stand or fall together, and that both must be defended abroad by a professional army and an unmatched arsenal. Faith and family at home, strength and resolve beyond the borders.#!"
  ideology_tech_libertarian: "Tech Libertarian"
  ideology_tech_libertarian_desc: "#lore This leader believes that code moves faster than law and should be left alone: data flowing freely, platforms unregulated, unions and taxes kept out of the way of disruption, and nuclear power to fuel the server farms of the future.#!"
  ideology_technocrat: "Technocrat"
  ideology_technocrat_desc: "#lore This leader believes that government is a problem of engineering, not of ideology: appointed experts in place of party loyalists, policy written from statistics, and schools and universities that train the administrators of tomorrow. On matters of conscience they have little to say.#!"
  ideology_maoist: "Maoist"
  ideology_maoist_desc: "#lore This leader believes that the revolution is made in the countryside: peasants organised in communes, intellectuals sent down to learn from the masses, temples and private schools swept away, and a single party that never stops rectifying itself through struggle.#!"
  ideology_reform_communist: "Reform Communist"
  ideology_reform_communist_desc: "#lore This leader believes in socialism with a human face: factories run by the councils of those who work in them, the secret police dismantled, the right to gather and speak restored, and a party that wins consent rather than commanding it.#!"
  ideology_democratizer: "Democratizer"
  ideology_democratizer_desc: "#lore This leader believes that the age of the strongman is ending: free elections, a free press, an end to the political police, and round tables where the regime and its opponents negotiate the transition. Economics can wait, liberty cannot.#!"
  ideology_national_populist: "National Populist"
  ideology_national_populist_desc: "#lore This leader believes that the people have been betrayed by distant elites: tariffs to bring the factories home, borders closed to newcomers, pensions for those who belong, more police on the streets and a press that should know its place. They win elections, and then bend the rules that let them win.#!"
  ZTRPOL_POLE_CORE: "Core of its Ideological Pole"
  ZTRPOL_OUTSIDE_POLE: "Opposition outside its Ideological Pole"
  ideology_religious_democrat: "Religious Democrat"
  ideology_religious_democrat_desc: "#lore This leader believes that a religious conscience belongs in public life: a social market economy where unions and employers sit at the same table, generous support for families, schools free to teach the faith, and firm limits on what medicine may do at the beginning and end of life.#!"
  ideology_ztrpol_social_democratic_labor: "Social Democratic"
  ideology_ztrpol_social_democratic_labor_desc: "#lore This group seeks to tame capitalism rather than abolish it: strong unions, a generous welfare state and an economy steered by the government.#!"
  ideology_ztrpol_democratic_socialist: "Democratic Socialist"
  ideology_ztrpol_democratic_socialist_desc: "#lore This group wants to move beyond capitalism through the ballot box, placing the economy in the hands of the workers themselves.#!"
  ideology_ztrpol_progressive_secular: "Progressive Secular"
  ideology_ztrpol_progressive_secular_desc: "#lore This group sees a secular state and public education as the foundations of a free and modern society.#!"
  ideology_ztrpol_cooperativist: "Cooperativist"
  ideology_ztrpol_cooperativist_desc: "#lore This group believes the countryside prospers through cooperatives and independent farmers, backed by a supportive state.#!"
  ideology_ztrpol_right_wing_populist_rural: "Rural Populist"
  ideology_ztrpol_right_wing_populist_rural_desc: "#lore This group feels abandoned by distant elites and global markets, and demands protection for farms, borders and traditional communities.#!"
  ideology_ztrpol_right_wing_populist: "Right-Wing Populist"
  ideology_ztrpol_right_wing_populist_desc: "#lore This group claims to speak for ordinary hardworking people against elites and newcomers, demanding tight borders and a welfare state reserved for the nation.#!"
  ideology_ztrpol_social_religious: "Social Religious"
  ideology_ztrpol_social_religious_desc: "#lore This group draws on faith to demand care for the weak: accessible healthcare and schools open to all.#!"
  ideology_ztrpol_religious_democratic: "Religious Democratic"
  ideology_ztrpol_religious_democratic_desc: "#lore This group has made peace with democracy and religious freedom, and brings faith-based values into public life through the ballot box.#!"
  ideology_ztrpol_clerical_nationalist: "Clerical Nationalist"
  ideology_ztrpol_clerical_nationalist_desc: "#lore This group sees the nation and the faith as one, and wants the state to defend religion against secular decay.#!"
  ideology_ztrpol_business_liberal: "Business Liberal"
  ideology_ztrpol_business_liberal_desc: "#lore This group accepts mass democracy as the price of stability, as long as taxes stay low and property stays secure.#!"
  ideology_ztrpol_taxpayer: "Taxpayer"
  ideology_ztrpol_taxpayer_desc: "#lore This group sees itself as the backbone of the nation, demanding a say in government and resisting taxes that punish hard work.#!"
  ideology_ztrpol_vanguard_labor: "Vanguard Labor"
  ideology_ztrpol_vanguard_labor_desc: "#lore This group follows the party line: the workers' state speaks through a single party, and the unions are its transmission belt.#!"
  ideology_ztrpol_party_army: "Party Army"
  ideology_ztrpol_party_army_desc: "#lore This group serves the party before the nation, standing ready to defend the revolution against its enemies within.#!"
  ideology_ztrpol_collective_farm: "Collective Farm"
  ideology_ztrpol_collective_farm_desc: "#lore This group has been organized into collective farms and now depends on the planned economy for land, tools and markets.#!"
  ideology_ztrpol_nomenklatura: "Nomenklatura"
  ideology_ztrpol_nomenklatura_desc: "#lore This group has become the administrative class of the single-party state, trading loyalty for careers and privileges.#!"
  ideology_ztrpol_praetorian: "Praetorian"
  ideology_ztrpol_praetorian_desc: "#lore This group sees itself as the guardian of order, ready to rule directly whenever civilians fail the nation.#!"
  ideology_ztrpol_national_capitalist: "National Capitalist"
  ideology_ztrpol_national_capitalist_desc: "#lore This group thrives under an authoritarian state that guards national industry, disciplines labor and keeps elections at bay.#!"
  ideology_ztrpol_mass_nationalist: "Mass Nationalist"
  ideology_ztrpol_mass_nationalist_desc: "#lore This group has found in the nationalist movement a sense of order and belonging, and supports a single party that promises both.#!"
  ideology_ztrpol_socialist_vigilance: "Socialist Vigilance"
  ideology_ztrpol_socialist_vigilance_desc: "#lore This group sees the watchful state as the shield of the revolution: every file, informant and camera guards the gains of the working people against their enemies.#!"
  ideology_ztrpol_national_vigilance: "National Vigilance"
  ideology_ztrpol_national_vigilance_desc: "#lore This group believes the nation is safe only under constant watch: a state that knows its citizens can protect faith, family and order.#!"
