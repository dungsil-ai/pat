# PAT verified upstream: abff49a
  ztr_extreme_heatwave: "극심한 폭염" # 17611660901669962774
  ztr_extreme_heatwave_desc: "지역 기상 관측 이래 유례를 찾을 수 없는 수주일간의 지속되는 폭염. 들판은 시들고, 가축은 방목지에서 쓰러지며, 도시가 가장 큰 타격을 입습니다. 벽돌과 아스팔트는 밤새 열을 품고 노인과 빈민층 사이에서 사망자가 급증합니다." # 4686536985311327289
  ztr_megadrought: "대가뭄" # 12083588432082449195
  ztr_megadrought_desc: "건기가 아니라 건조한 십년기입니다. 저수지는 취수선 아래로 떨어지고, 우물은 몇 번이고 더 깊이 파이며, 더 습한 기후를 위해 건설된 관개 시설은 이제 더 이상 존재하지 않는 물을 나릅니다. 방목할 풀이 없어 가축은 서둘러 처분됩니다." # 17038038348399865173
  ztr_hurricane: "허리케인" # 5917870714338718717
  ztr_hurricane_desc: "더 따뜻해진 바다에 의해 해안으로 밀려든 열대 저기압. 며칠 만에 들이닥쳐 몇 주 동안 머물며 항만 시설, 철도 제방, 해안 도시들을 휩쓸어 갑니다. 바다가 따뜻해질수록 상륙 횟수가 잦아지고 그 위력도 더 맹렬해집니다." # 1131314776682046569
  ztr_extreme_wildfire: "대형 산불" # 14590980130562819015
  ztr_extreme_wildfire_desc: "진화할 수 없고 오로지 피해야만 하는 불길. 가뭄으로 바짝 마른 목재와 열풍이 방화선을 파내는 것보다 더 빠르게 전선을 확산시키고, 연기는 화재 지역에서 수백 마일 떨어진 곳까지 도로와 숨통을 막아섭니다." # 11493191607440470974
  ztr_coastal_flooding: "해안 침수" # 10949789384846637879
  ztr_coastal_flooding_desc: "바다가 저지대를 집어삼켰고 물러설 기미를 보이지 않습니다. 폭풍해일은 매년 내륙 더 깊숙이 도달하고, 염분이 대수层과 제방 뒤의 농경지로 스며들며, 한 세대 전에 세워진 방조제는 이제 너무 낮아졌습니다." # 385318646562896877
  state_harvest_condition_ztr_extreme_heatwave_impact_mult: "[GetHarvestConditionType('ztr_extreme_heatwave').GetName] [concept_harvest_condition] 영향" # 13592735972821704044
