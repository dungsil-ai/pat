l_korean:
  concept_ztr_patents: "Patents"
  concept_ztr_patents_desc: "[Concept('concept_ztr_patents','$concept_ztr_patents|q$')] are the inventions our industry files in a year together with the Research Center, counted in 14 sectors. Every [concept_country] files them, 10% fewer without a National Research Center; only the Research Center turns them into research and shows them.\n\nThe patents of a sector come from:\n• the occupied levels of the sector's [Concept('concept_building','$concept_buildings|q$')] in our [Concept('concept_incorporated_state','$concept_incorporated_states|q$')];\n• how close that industry is to the world leader of the sector;\n• our [Concept('concept_company','$concept_companies|q$')] of the sector, twice as much when they are prosperous;\n• our [concept_literacy], which scales the result;\n• our higher education [concept_law]: Compulsory Secondary School +10%, Public Universities +25%;\n• the production method of our Research Center: $pm_research_center_medium$ #P +10%#!, $pm_research_center_advanced$ #P +20%#!;\n• our [Concept('concept_ztr_research_focus','$concept_ztr_research_focus|q$')], which favours some sectors over the others.\n\nThey are counted once a year, at mid-year, and the result holds for the following twelve months.\n\nOur [GetBuildingType('building_university').GetName] buildings file patents too, as many as our weekly [concept_innovation] within its cap, without the patent bonus: they are shown beside the industrial ones and take no part in sectors, bonus or programmes."
  ztr_patent_name_electronics_advanced: "Advanced Computing"
  concept_ztr_patent_electronics_advanced: "Advanced Computing Patents"
  concept_ztr_patent_electronics_advanced_desc: "[Concept('concept_ztr_patent_electronics_advanced','$concept_ztr_patent_electronics_advanced|q$')] are the [Concept('concept_ztr_patents','$concept_ztr_patents|q$')] our [concept_country] files each year in chips and artificial intelligence.\n\nThey come from: [GetBuildingType('building_processors_foundry').GetName]. [GetBuildingType('building_datacenter_industry').GetName] producing [GetGoods('ai_systems').GetName] count for half.\n\nThe sector's [Concept('concept_good','$concept_goods|q$')]: [GetGoods('processors').GetName], [GetGoods('ai_systems').GetName]."
  ztr_patent_line_electronics_advanced: "\n$TAB$$TAB$• @ztr_patent_electronics_advanced! [Concept('concept_ztr_patent_electronics_advanced','$ztr_patent_name_electronics_advanced|q$')]: #v [ROOT.GetCountry.MakeScope.Var('ztr_patent_electronics_advanced').GetValue|0]#! · leader [GetGlobalVariable('ztr_patent_leader_electronics_advanced').GetCountry.GetFlagTextIcon] #v [GetGlobalVariable('ztr_patent_top_electronics_advanced').GetValue|0]#!"
