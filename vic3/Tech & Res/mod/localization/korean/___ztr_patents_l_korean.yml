  ztr_patent_research_modifier: "Patents"
  ztr_patent_research_modifier_desc: "[Concept('concept_ztr_patents','$concept_ztr_patents|q$')] of the sectors of the technology in research add to our weekly [concept_innovation] and its cap."
  concept_ztr_research_focus: "Research Focus"
  concept_ztr_research_focus_desc: "The $concept_ztr_research_focus$ of our National Research Center steers our [Concept('concept_ztr_patents','$concept_ztr_patents|q$')] toward one or two sectors. A focus on one sector gives #P +50%#! [Concept('concept_ztr_patents','$concept_ztr_patents|q$')] to it and #N -30%#! to every other; a focus on two sectors #P +25%#! to each and #N -25%#! to the others: specialising has a price. Each focus wins the approval of the [Concept('concept_interest_group','$concept_interest_groups|q$')] that profit from it.\n\nOnce chosen, it holds for 10 years. Without a focus, @ztr_patent_focus_balanced! Balanced Research favours no sector.\n\nThe focuses and the technology that offers them:\n• @ztr_patent_focus_military_industrial_complex! Military-Industrial Complex: @ztr_patent_military! [Concept('concept_ztr_patent_military','$ztr_patent_name_military|q$')] and @ztr_patent_aerospace! [Concept('concept_ztr_patent_aerospace','$ztr_patent_name_aerospace|q$')], with [GetTechnology('military_aviation').GetName]\n• @ztr_patent_focus_space_race! Space Race: @ztr_patent_aerospace! [Concept('concept_ztr_patent_aerospace','$ztr_patent_name_aerospace|q$')] and @ztr_patent_electronics_advanced! [Concept('concept_ztr_patent_electronics_advanced','$ztr_patent_name_electronics_advanced|q$')], with [GetTechnology('rocketery').GetName]\n• @ztr_patent_focus_heavy_industry! Heavy Industry: @ztr_patent_metallurgy! [Concept('concept_ztr_patent_metallurgy','$ztr_patent_name_metallurgy|q$')] and @ztr_patent_extraction! [Concept('concept_ztr_patent_extraction','$ztr_patent_name_extraction|q$')]\n• @ztr_patent_focus_green_revolution! Green Revolution: @ztr_patent_agro_bio! [Concept('concept_ztr_patent_agro_bio','$ztr_patent_name_agro_bio|q$')] and @ztr_patent_chemical! [Concept('concept_ztr_patent_chemical','$ztr_patent_name_chemical|q$')], with [GetTechnology('green_revolution').GetName]\n• @ztr_patent_focus_consumer_society! Consumer Society: @ztr_patent_electronics_consumer! [Concept('concept_ztr_patent_electronics_consumer','$ztr_patent_name_electronics_consumer|q$')] and @ztr_patent_manufacturing! [Concept('concept_ztr_patent_manufacturing','$ztr_patent_name_manufacturing|q$')], with [GetTechnology('rudimental_home_appliances').GetName]\n• @ztr_patent_focus_information_society! Information Society: @ztr_patent_digital! [Concept('concept_ztr_patent_digital','$ztr_patent_name_digital|q$')] and @ztr_patent_communications! [Concept('concept_ztr_patent_communications','$ztr_patent_name_communications|q$')], with [GetTechnology('networking_protocols').GetName]\n• @ztr_patent_focus_electrification! Electrification: @ztr_patent_electrical! [Concept('concept_ztr_patent_electrical','$ztr_patent_name_electrical|q$')]\n• @ztr_patent_focus_fordism! Fordism: @ztr_patent_mechanical! [Concept('concept_ztr_patent_mechanical','$ztr_patent_name_mechanical|q$')], with [GetTechnology('combustion_engine').GetName]\n• @ztr_patent_focus_public_health! Public Health: @ztr_patent_medical! [Concept('concept_ztr_patent_medical','$ztr_patent_name_medical|q$')], with [GetTechnology('antibiotics').GetName]\n• @ztr_patent_focus_semiconductor_industry! Semiconductor Industry: @ztr_patent_electronics_advanced! [Concept('concept_ztr_patent_electronics_advanced','$ztr_patent_name_electronics_advanced|q$')], with [GetTechnology('integrated_circuits').GetName]\n• @ztr_patent_focus_autarky! Autarky: @ztr_patent_chemical! [Concept('concept_ztr_patent_chemical','$ztr_patent_name_chemical|q$')]"
  ztr_patent_focus_button: "Change Research Focus"
  ztr_patent_focus_button_desc: "Choose the [Concept('concept_ztr_research_focus','$concept_ztr_research_focus|q$')]: which sectors our [Concept('concept_ztr_patents','$concept_ztr_patents|q$')] favour. It can change once every 10 years."
  ztr_patent_focus_lock_tt: "We changed our [Concept('concept_ztr_research_focus','$concept_ztr_research_focus|q$')] less than 10 years ago"
  ztr_patent.2.t: "Research Focus"
  ztr_patent.2.d: "Our [Concept('concept_ztr_research_focus','$concept_ztr_research_focus|q$')] is [ROOT.GetCountry.GetCustom('ztr_patent_focus_current')].\n\nA focus raises the [Concept('concept_ztr_patents','$concept_ztr_patents|q$')] of its sectors and lowers all the others: specialising has a price. Once chosen, it holds for 10 years."
  ztr_patent.2.a: "@ztr_patent_focus_balanced! Balanced Research"
  ztr_patent.2.b: "A focus on one sector"
  ztr_patent.2.c: "A focus on two sectors"
  ztr_patent.2.e: "Keep the current focus"
  ztr_patent.2.f: "Back"
  ztr_patent.3.d: "A single sector gets #P +50%#! [Concept('concept_ztr_patents','$concept_ztr_patents|q$')]; every other sector #N -30%#!."
  ztr_patent.4.d: "Two sectors get #P +25%#! [Concept('concept_ztr_patents','$concept_ztr_patents|q$')] each; every other sector #N -25%#!."
  ztr_patent_focus_balanced_name: "@ztr_patent_focus_balanced! Balanced Research"
  ztr_patent_focus_balanced_tt: "Our research follows our industry wherever it leads, without favouring any sector.\nNo sector gains or loses [Concept('concept_ztr_patents','$concept_ztr_patents|q$')]."
  ztr_patent_focus_military_industrial_complex_name: "@ztr_patent_focus_military_industrial_complex! Military-Industrial Complex"
  ztr_patent_focus_military_industrial_complex_option: "@ztr_patent_focus_military_industrial_complex! Military-Industrial Complex"
  ztr_patent_focus_military_industrial_complex_tt: "Arms makers, the armed forces and the state laboratories work as one, as Eisenhower warned in 1961.\n#P +25%#! @ztr_patent_military! [Concept('concept_ztr_patent_military','$ztr_patent_name_military|q$')] and @ztr_patent_aerospace! [Concept('concept_ztr_patent_aerospace','$ztr_patent_name_aerospace|q$')] [Concept('concept_ztr_patents','$concept_ztr_patents|q$')], #N -25%#! in every other sector, for 10 years."
  ztr_patent_focus_military_industrial_complex: "Military-Industrial Complex"
  ztr_patent_focus_military_industrial_complex_desc: "[Concept('concept_ztr_research_focus','$concept_ztr_research_focus|q$')]. Arms makers, the armed forces and the state laboratories work as one, as Eisenhower warned in 1961."
  ztr_patent_focus_space_race_name: "@ztr_patent_focus_space_race! Space Race"
  ztr_patent_focus_space_race_option: "@ztr_patent_focus_space_race! Space Race"
  ztr_patent_focus_space_race_tt: "Rockets, guidance computers and satellites become a matter of national prestige, as in the race to the Moon.\n#P +25%#! @ztr_patent_aerospace! [Concept('concept_ztr_patent_aerospace','$ztr_patent_name_aerospace|q$')] and @ztr_patent_electronics_advanced! [Concept('concept_ztr_patent_electronics_advanced','$ztr_patent_name_electronics_advanced|q$')] [Concept('concept_ztr_patents','$concept_ztr_patents|q$')], #N -25%#! in every other sector, for 10 years."
  ztr_patent_focus_space_race: "Space Race"
  ztr_patent_focus_space_race_desc: "[Concept('concept_ztr_research_focus','$concept_ztr_research_focus|q$')]. Rockets, guidance computers and satellites become a matter of national prestige, as in the race to the Moon."
  ztr_patent_focus_heavy_industry_name: "@ztr_patent_focus_heavy_industry! Heavy Industry"
  ztr_patent_focus_heavy_industry_option: "@ztr_patent_focus_heavy_industry! Heavy Industry"
  ztr_patent_focus_heavy_industry_tt: "Steel, coal and ore come first, as in the Soviet five-year plans and the industrialisation of the 1950s.\n#P +25%#! @ztr_patent_metallurgy! [Concept('concept_ztr_patent_metallurgy','$ztr_patent_name_metallurgy|q$')] and @ztr_patent_extraction! [Concept('concept_ztr_patent_extraction','$ztr_patent_name_extraction|q$')] [Concept('concept_ztr_patents','$concept_ztr_patents|q$')], #N -25%#! in every other sector, for 10 years."
  ztr_patent_focus_heavy_industry: "Heavy Industry"
  ztr_patent_focus_heavy_industry_desc: "[Concept('concept_ztr_research_focus','$concept_ztr_research_focus|q$')]. Steel, coal and ore come first, as in the Soviet five-year plans and the industrialisation of the 1950s."
  ztr_patent_focus_green_revolution_name: "@ztr_patent_focus_green_revolution! Green Revolution"
  ztr_patent_focus_green_revolution_option: "@ztr_patent_focus_green_revolution! Green Revolution"
  ztr_patent_focus_green_revolution_tt: "New seeds, fertilisers and pesticides to feed a growing nation, as in Mexico and India in the 1960s.\n#P +25%#! @ztr_patent_agro_bio! [Concept('concept_ztr_patent_agro_bio','$ztr_patent_name_agro_bio|q$')] and @ztr_patent_chemical! [Concept('concept_ztr_patent_chemical','$ztr_patent_name_chemical|q$')] [Concept('concept_ztr_patents','$concept_ztr_patents|q$')], #N -25%#! in every other sector, for 10 years."
  ztr_patent_focus_green_revolution: "Green Revolution"
  ztr_patent_focus_green_revolution_desc: "[Concept('concept_ztr_research_focus','$concept_ztr_research_focus|q$')]. New seeds, fertilisers and pesticides to feed a growing nation, as in Mexico and India in the 1960s."
  ztr_patent_focus_consumer_society_name: "@ztr_patent_focus_consumer_society! Consumer Society"
  ztr_patent_focus_consumer_society_option: "@ztr_patent_focus_consumer_society! Consumer Society"
  ztr_patent_focus_consumer_society_tt: "Radios, televisions, appliances and clothes for every household, as in post-war America and Japan.\n#P +25%#! @ztr_patent_electronics_consumer! [Concept('concept_ztr_patent_electronics_consumer','$ztr_patent_name_electronics_consumer|q$')] and @ztr_patent_manufacturing! [Concept('concept_ztr_patent_manufacturing','$ztr_patent_name_manufacturing|q$')] [Concept('concept_ztr_patents','$concept_ztr_patents|q$')], #N -25%#! in every other sector, for 10 years."
  ztr_patent_focus_consumer_society: "Consumer Society"
  ztr_patent_focus_consumer_society_desc: "[Concept('concept_ztr_research_focus','$concept_ztr_research_focus|q$')]. Radios, televisions, appliances and clothes for every household, as in post-war America and Japan."
  ztr_patent_focus_information_society_name: "@ztr_patent_focus_information_society! Information Society"
  ztr_patent_focus_information_society_option: "@ztr_patent_focus_information_society! Information Society"
  ztr_patent_focus_information_society_tt: "Software, networks and media become the core of the economy, as in the United States and Korea since the 1990s.\n#P +25%#! @ztr_patent_digital! [Concept('concept_ztr_patent_digital','$ztr_patent_name_digital|q$')] and @ztr_patent_communications! [Concept('concept_ztr_patent_communications','$ztr_patent_name_communications|q$')] [Concept('concept_ztr_patents','$concept_ztr_patents|q$')], #N -25%#! in every other sector, for 10 years."
  ztr_patent_focus_information_society: "Information Society"
  ztr_patent_focus_information_society_desc: "[Concept('concept_ztr_research_focus','$concept_ztr_research_focus|q$')]. Software, networks and media become the core of the economy, as in the United States and Korea since the 1990s."
  ztr_patent_focus_electrification_name: "@ztr_patent_focus_electrification! Electrification"
  ztr_patent_focus_electrification_option: "@ztr_patent_focus_electrification! Electrification"
  ztr_patent_focus_electrification_tt: "Power plants, grids and electrical equipment, as in the Soviet GOELRO plan and the Tennessee Valley Authority.\n#P +50%#! @ztr_patent_electrical! [Concept('concept_ztr_patent_electrical','$ztr_patent_name_electrical|q$')] [Concept('concept_ztr_patents','$concept_ztr_patents|q$')], #N -30%#! in every other sector, for 10 years."
  ztr_patent_focus_electrification: "Electrification"
  ztr_patent_focus_electrification_desc: "[Concept('concept_ztr_research_focus','$concept_ztr_research_focus|q$')]. Power plants, grids and electrical equipment, as in the Soviet GOELRO plan and the Tennessee Valley Authority."
  ztr_patent_focus_fordism_name: "@ztr_patent_focus_fordism! Fordism"
  ztr_patent_focus_fordism_option: "@ztr_patent_focus_fordism! Fordism"
  ztr_patent_focus_fordism_tt: "Engines, cars and machine tools on the assembly line, the model of Ford's Highland Park plant.\n#P +50%#! @ztr_patent_mechanical! [Concept('concept_ztr_patent_mechanical','$ztr_patent_name_mechanical|q$')] [Concept('concept_ztr_patents','$concept_ztr_patents|q$')], #N -30%#! in every other sector, for 10 years."
  ztr_patent_focus_fordism: "Fordism"
  ztr_patent_focus_fordism_desc: "[Concept('concept_ztr_research_focus','$concept_ztr_research_focus|q$')]. Engines, cars and machine tools on the assembly line, the model of Ford's Highland Park plant."
  ztr_patent_focus_public_health_name: "@ztr_patent_focus_public_health! Public Health"
  ztr_patent_focus_public_health_option: "@ztr_patent_focus_public_health! Public Health"
  ztr_patent_focus_public_health_tt: "Medicines, vaccines and hospitals for the whole population, as with the British National Health Service of 1948.\n#P +50%#! @ztr_patent_medical! [Concept('concept_ztr_patent_medical','$ztr_patent_name_medical|q$')] [Concept('concept_ztr_patents','$concept_ztr_patents|q$')], #N -30%#! in every other sector, for 10 years."
  ztr_patent_focus_public_health: "Public Health"
  ztr_patent_focus_public_health_desc: "[Concept('concept_ztr_research_focus','$concept_ztr_research_focus|q$')]. Medicines, vaccines and hospitals for the whole population, as with the British National Health Service of 1948."
  ztr_patent_focus_semiconductor_industry_name: "@ztr_patent_focus_semiconductor_industry! Semiconductor Industry"
  ztr_patent_focus_semiconductor_industry_option: "@ztr_patent_focus_semiconductor_industry! Semiconductor Industry"
  ztr_patent_focus_semiconductor_industry_tt: "Chips above all, as in Japan's VLSI project of 1976 and later in Korea and Taiwan.\n#P +50%#! @ztr_patent_electronics_advanced! [Concept('concept_ztr_patent_electronics_advanced','$ztr_patent_name_electronics_advanced|q$')] [Concept('concept_ztr_patents','$concept_ztr_patents|q$')], #N -30%#! in every other sector, for 10 years."
  ztr_patent_focus_semiconductor_industry: "Semiconductor Industry"
  ztr_patent_focus_semiconductor_industry_desc: "[Concept('concept_ztr_research_focus','$concept_ztr_research_focus|q$')]. Chips above all, as in Japan's VLSI project of 1976 and later in Korea and Taiwan."
  ztr_patent_focus_autarky_name: "@ztr_patent_focus_autarky! Autarky"
  ztr_patent_focus_autarky_option: "@ztr_patent_focus_autarky! Autarky"
  ztr_patent_focus_autarky_tt: "Synthetic fuel, rubber and nitrates to do without imports, as in the German Four Year Plan of 1936.\n#P +50%#! @ztr_patent_chemical! [Concept('concept_ztr_patent_chemical','$ztr_patent_name_chemical|q$')] [Concept('concept_ztr_patents','$concept_ztr_patents|q$')], #N -30%#! in every other sector, for 10 years."
  ztr_patent_focus_autarky: "Autarky"
  ztr_patent_focus_autarky_desc: "[Concept('concept_ztr_research_focus','$concept_ztr_research_focus|q$')]. Synthetic fuel, rubber and nitrates to do without imports, as in the German Four Year Plan of 1936."
  ztr_patent_map_tt: "[Concept('concept_ztr_patents','$concept_ztr_patents|q$')] filed this year: #v [THIS.GetState.GetOwner.MakeScope.ScriptValue('ztr_patent_filed_total')|0]#!\n$TAB$From [GetBuildingType('building_university').GetName]: #v [THIS.GetState.GetOwner.MakeScope.Var('ztr_patent_academic').GetValue|0]#!\n$TAB$From Industry Sectors with [GetBuildingType('building_research_center').GetName]: #v [THIS.GetState.GetOwner.MakeScope.Var('ztr_patent_total').GetValue|0]#![THIS.GetState.GetOwner.GetCustom('ztr_patent_map_electronics_advanced')][THIS.GetState.GetOwner.GetCustom('ztr_patent_map_aerospace')][THIS.GetState.GetOwner.GetCustom('ztr_patent_map_agro_bio')][THIS.GetState.GetOwner.GetCustom('ztr_patent_map_chemical')][THIS.GetState.GetOwner.GetCustom('ztr_patent_map_communications')][THIS.GetState.GetOwner.GetCustom('ztr_patent_map_electronics_consumer')][THIS.GetState.GetOwner.GetCustom('ztr_patent_map_digital')][THIS.GetState.GetOwner.GetCustom('ztr_patent_map_electrical')][THIS.GetState.GetOwner.GetCustom('ztr_patent_map_extraction')][THIS.GetState.GetOwner.GetCustom('ztr_patent_map_medical')][THIS.GetState.GetOwner.GetCustom('ztr_patent_map_manufacturing')][THIS.GetState.GetOwner.GetCustom('ztr_patent_map_mechanical')][THIS.GetState.GetOwner.GetCustom('ztr_patent_map_metallurgy')][THIS.GetState.GetOwner.GetCustom('ztr_patent_map_military')]"
  ztr_patent_map_no_center_tt: "[Concept('concept_ztr_patents','$concept_ztr_patents|q$')] filed this year: #v [THIS.GetState.GetOwner.MakeScope.Var('ztr_patent_academic').GetValue|0]#!\n$TAB$From [GetBuildingType('building_university').GetName]: #v [THIS.GetState.GetOwner.MakeScope.Var('ztr_patent_academic').GetValue|0]#!\nThey have no data on industry patents without a [GetBuildingType('building_research_center').GetName]."
  ztr_programme_pace_text_atomic: "Monthly progress: #v [ROOT.GetCountry.MakeScope.ScriptValue('ztr_programme_progress_atomic')|1]#!, from our [Concept('concept_ztr_patents','$concept_ztr_patents|q$')] against the world leader of each sector:\n$TAB$[ROOT.GetCountry.MakeScope.ScriptValue('ztr_programme_part_atomic_military')|+=1] from @ztr_patent_military! [Concept('concept_ztr_patent_military','$ztr_patent_name_military|q$')] (at most #v 7.5#!)\n$TAB$[ROOT.GetCountry.MakeScope.ScriptValue('ztr_programme_part_atomic_chemical')|+=1] from @ztr_patent_chemical! [Concept('concept_ztr_patent_chemical','$ztr_patent_name_chemical|q$')] (at most #v 6#!)\n$TAB$[ROOT.GetCountry.MakeScope.ScriptValue('ztr_programme_part_atomic_electrical')|+=1] from @ztr_patent_electrical! [Concept('concept_ztr_patent_electrical','$ztr_patent_name_electrical|q$')] (at most #v 6#!)\n$TAB$[ROOT.GetCountry.MakeScope.ScriptValue('ztr_programme_part_atomic_extraction')|+=1] from @ztr_patent_extraction! [Concept('concept_ztr_patent_extraction','$ztr_patent_name_extraction|q$')] (at most #v 4.5#!)\n$TAB$[ROOT.GetCountry.MakeScope.ScriptValue('ztr_programme_part_atomic_metallurgy')|+=1] from @ztr_patent_metallurgy! [Concept('concept_ztr_patent_metallurgy','$ztr_patent_name_metallurgy|q$')] (at most #v 3#!)\n$TAB$[ROOT.GetCountry.MakeScope.ScriptValue('ztr_programme_part_atomic_mechanical')|+=1] from @ztr_patent_mechanical! [Concept('concept_ztr_patent_mechanical','$ztr_patent_name_mechanical|q$')] (at most #v 3#!)[ROOT.GetCountry.GetCustom('ztr_programme_atomic_floor')][ROOT.GetCountry.GetCustom('ztr_programme_atomic_paused')][ROOT.GetCountry.GetCustom('ztr_programme_atomic_rush')][ROOT.GetCountry.GetCustom('ztr_programme_atomic_tech')]\n\nLeading every sector gives #v 30#!; the least is #v 1#!."
  ztr_programme_atomic_floor_line: "\n$TAB$[ROOT.GetCountry.MakeScope.ScriptValue('ztr_programme_floor_atomic')|+=1] from the minimum progress"
  ztr_programme_atomic_paused_line: "\n$TAB$#N -100%#! from programme suspended"
