  ztr_patent_line_none: ""
  ztr_patent_list: "[Concept('concept_ztr_research_focus','$concept_ztr_research_focus|q$')]: #v [ROOT.GetCountry.GetCustom('ztr_patent_focus_current')]#!\nBonus to the current research, #v [ROOT.GetCountry.GetCurrentlyResearchedTechnology.GetName]#!:\n$TAB$Sectors: [ROOT.GetCountry.GetCustom('ztr_patent_active_name_1')][ROOT.GetCountry.GetCustom('ztr_patent_active_name_2')]\n$TAB$#tooltippable;positive_value;tooltip:[ROOT.GetCountry.GetTooltipTag],ztr_patent_bonus_breakdown_tt +[ROOT.GetCountry.MakeScope.ScriptValue('ztr_patent_research_bonus')|0]#! weekly [concept_innovation] and cap[ROOT.GetCountry.GetCustom('ztr_ra_shared_line')]\n\n[Concept('concept_ztr_patents','$concept_ztr_patents|q$')] filed this year: #v [ROOT.GetCountry.MakeScope.ScriptValue('ztr_patent_filed_total')|0]#!\n$TAB$From [GetBuildingType('building_university').GetName]: #v [ROOT.GetCountry.MakeScope.Var('ztr_patent_academic').GetValue|0]#!\n$TAB$From Industry Sectors with [GetBuildingType('building_research_center').GetName]: #v [ROOT.GetCountry.MakeScope.Var('ztr_patent_total').GetValue|0]#![ROOT.GetCountry.GetCustom('ztr_patent_je_electronics_advanced')][ROOT.GetCountry.GetCustom('ztr_patent_je_aerospace')][ROOT.GetCountry.GetCustom('ztr_patent_je_agro_bio')][ROOT.GetCountry.GetCustom('ztr_patent_je_chemical')][ROOT.GetCountry.GetCustom('ztr_patent_je_communications')][ROOT.GetCountry.GetCustom('ztr_patent_je_electronics_consumer')][ROOT.GetCountry.GetCustom('ztr_patent_je_digital')][ROOT.GetCountry.GetCustom('ztr_patent_je_electrical')][ROOT.GetCountry.GetCustom('ztr_patent_je_extraction')][ROOT.GetCountry.GetCustom('ztr_patent_je_medical')][ROOT.GetCountry.GetCustom('ztr_patent_je_manufacturing')][ROOT.GetCountry.GetCustom('ztr_patent_je_mechanical')][ROOT.GetCountry.GetCustom('ztr_patent_je_metallurgy')][ROOT.GetCountry.GetCustom('ztr_patent_je_military')]"
  ztr_patent_bonus_breakdown_tt: "#header @innovation! Patent Bonus#!\nYour total bonus of [Country.MakeScope.ScriptValue('ztr_patent_research_bonus')|+=0] is due to:\n$TAB$#tooltippable;tooltip:[Country.GetTooltipTag],ztr_patent_position_tt [Country.MakeScope.ScriptValue('ztr_patent_bonus_from_position')|+=0]#! from our position among the sector leaders\n$TAB$#tooltippable;tooltip:[Country.GetTooltipTag],ztr_patent_patents_tt [Country.MakeScope.ScriptValue('ztr_patent_bonus_from_patents')|+=0]#! from our [Concept('concept_ztr_patents','$concept_ztr_patents|q$')]\n$TAB$[Country.MakeScope.ScriptValue('ztr_patent_bonus_from_modifiers')|+=0] from [Country.MakeScope.ScriptValue('ztr_patent_mods_pct')|+=%0] [Concept('concept_ztr_patents','$concept_ztr_patents|q$')]\n$TAB$$TAB$#tooltippable;tooltip:[Country.GetTooltipTag],ztr_patent_focus_tt [Country.MakeScope.ScriptValue('ztr_patent_focus_pct')|+=%0]#! from the research focus [Country.GetCustom('ztr_patent_focus_current')]\n$TAB$$TAB$#tooltippable;tooltip:[Country.GetTooltipTag],ztr_patent_laws_tt [Country.MakeScope.ScriptValue('ztr_patent_law_pct')|+=%0]#! from [Country.GetCustom('ztr_patent_law_current')][Country.GetCustom('ztr_patent_pm_line')][Country.GetCustom('ztr_patent_war_line')]\n\nA technology of two sectors takes their mean; the research focus multiplies the sum of the laws and the Research Center."
  ztr_patent_war_line_text: "\n$TAB$#tooltippable;tooltip:[Country.GetTooltipTag],ztr_patent_war_tt [Country.MakeScope.ScriptValue('ztr_patent_bonus_from_war')|+=0]#! from the war against a [concept_country] of equal or higher rank"
  ztr_patent_war_tt: "#header [concept_war]#!\n[Country.MakeScope.ScriptValue('ztr_patent_bonus_from_war')|+=0] @innovation! Patent Bonus\n$TOOLTIP_DELIMITER$\nWhile at [concept_war] with a [concept_country] of equal or higher rank (a superpower only against another superpower), our @ztr_patent_military! $ztr_patent_name_military$ [Concept('concept_ztr_patents','$concept_ztr_patents|q$')] are multiplied by #P 2#! and gain #P +3%#! of the world leader's in the sector before the war, counted once a year."
  ztr_patent_pm_line_text: "\n$TAB$$TAB$[Country.MakeScope.ScriptValue('ztr_patent_pm_pct')|+=%0] from [Country.GetCustom('ztr_patent_pm_current')]"
  ztr_patent_pm_pm_research_center_advanced: "$pm_research_center_advanced$"
  ztr_patent_pm_pm_research_center_medium: "$pm_research_center_medium$"
  ztr_patent_position_tt: "#header Position among the Sector Leaders#!\n[Country.MakeScope.ScriptValue('ztr_patent_bonus_from_position')|+=0] @innovation! Patent Bonus\n$TOOLTIP_DELIMITER$[Country.GetCustom('ztr_patent_active_line_1')][Country.GetCustom('ztr_patent_active_line_2')]\n\nThe world leader of a sector gets #v +50#!; the others less, by their share of the leader's [Concept('concept_ztr_patents','$concept_ztr_patents|q$')]."
  ztr_patent_patents_tt: "#header [Concept('concept_ztr_patents','$concept_ztr_patents|q$')]#!\n[Country.MakeScope.ScriptValue('ztr_patent_bonus_from_patents')|+=0] @innovation! Patent Bonus\n$TOOLTIP_DELIMITER$[Country.GetCustom('ztr_patent_active_line_1')][Country.GetCustom('ztr_patent_active_line_2')]\n\nEach of our [Concept('concept_ztr_patents','$concept_ztr_patents|q$')] in the sector adds one point, counted here before the research focus, the laws and the war, which have their own lines. [Concept('concept_ztr_patents','$concept_ztr_patents|q$')] add at most #v [Country.MakeScope.ScriptValue('ztr_patent_bonus_patent_max')|0]#! in all, 3 times our position bonus of #v [Country.MakeScope.ScriptValue('ztr_patent_bonus_from_position')|+=0]#!."
  ztr_patent_focus_tt: "#header Research Focus#!\n[Country.MakeScope.ScriptValue('ztr_patent_focus_pct')|+=%0] [Concept('concept_ztr_patents','$concept_ztr_patents|q$')]\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.ScriptValue('ztr_patent_focus_pct')|+=%0] from [Country.GetCustom('ztr_patent_focus_current')]\n\nA [Concept('concept_ztr_research_focus','$concept_ztr_research_focus|q$')] on one sector gives #P +50%#! to it and #N -30%#! to the others; on two sectors #P +25%#! and #N -25%#!. It can change once every 10 years."
  ztr_patent_laws_tt: "#header [concept_law]#!\n[Country.MakeScope.ScriptValue('ztr_patent_law_pct')|+=%0] [Concept('concept_ztr_patents','$concept_ztr_patents|q$')]\n$TOOLTIP_DELIMITER$\n[Country.MakeScope.ScriptValue('ztr_patent_law_pct')|+=%0] from [Country.GetCustom('ztr_patent_law_current')]\n\nLaws that raise [Concept('concept_ztr_patents','$concept_ztr_patents|q$')]: $law_compulsory_secondary_school$ #P +10%#!, $law_public_universities$ #P +25%#!."
