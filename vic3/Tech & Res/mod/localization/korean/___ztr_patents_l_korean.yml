  ztr_patent_line_mechanical: "\n$TAB$$TAB$• @ztr_patent_mechanical! [Concept('concept_ztr_patent_mechanical','$ztr_patent_name_mechanical|q$')]: #v [ROOT.GetCountry.MakeScope.Var('ztr_patent_mechanical').GetValue|0]#! · leader [GetGlobalVariable('ztr_patent_leader_mechanical').GetCountry.GetFlagTextIcon] #v [GetGlobalVariable('ztr_patent_top_mechanical').GetValue|0]#!"
  ztr_patent_line_leader_mechanical: "\n$TAB$$TAB$• @ztr_patent_mechanical! [Concept('concept_ztr_patent_mechanical','$ztr_patent_name_mechanical|q$')]: #v [ROOT.GetCountry.MakeScope.Var('ztr_patent_mechanical').GetValue|0]#! · #P world leader#!"
  ztr_patent_map_line_mechanical: "\n$TAB$$TAB$• @ztr_patent_mechanical! $ztr_patent_name_mechanical$: #v [ROOT.GetCountry.MakeScope.Var('ztr_patent_mechanical').GetValue|0]#!"
  ztr_patent_name_metallurgy: "Metallurgy"
  concept_ztr_patent_metallurgy: "Metallurgy Patents"
  concept_ztr_patent_metallurgy_desc: "[Concept('concept_ztr_patent_metallurgy','$concept_ztr_patent_metallurgy|q$')] are the [Concept('concept_ztr_patents','$concept_ztr_patents|q$')] our [concept_country] files each year in steel, alloys and aluminium.\n\nThey come from: [GetBuildingType('building_steel_mill').GetName], [GetBuildingType('building_alloys_plant').GetName].\n\nThe sector's [Concept('concept_good','$concept_goods|q$')]: [GetGoods('steel').GetName], [GetGoods('alloys').GetName], [GetGoods('aluminium').GetName]."
  ztr_patent_line_metallurgy: "\n$TAB$$TAB$• @ztr_patent_metallurgy! [Concept('concept_ztr_patent_metallurgy','$ztr_patent_name_metallurgy|q$')]: #v [ROOT.GetCountry.MakeScope.Var('ztr_patent_metallurgy').GetValue|0]#! · leader [GetGlobalVariable('ztr_patent_leader_metallurgy').GetCountry.GetFlagTextIcon] #v [GetGlobalVariable('ztr_patent_top_metallurgy').GetValue|0]#!"
  ztr_patent_line_leader_metallurgy: "\n$TAB$$TAB$• @ztr_patent_metallurgy! [Concept('concept_ztr_patent_metallurgy','$ztr_patent_name_metallurgy|q$')]: #v [ROOT.GetCountry.MakeScope.Var('ztr_patent_metallurgy').GetValue|0]#! · #P world leader#!"
  ztr_patent_map_line_metallurgy: "\n$TAB$$TAB$• @ztr_patent_metallurgy! $ztr_patent_name_metallurgy$: #v [ROOT.GetCountry.MakeScope.Var('ztr_patent_metallurgy').GetValue|0]#!"
  ztr_patent_name_military: "Military"
  concept_ztr_patent_military: "Military Patents"
  concept_ztr_patent_military_desc: "[Concept('concept_ztr_patent_military','$concept_ztr_patent_military|q$')] are the [Concept('concept_ztr_patents','$concept_ztr_patents|q$')] our [concept_country] files each year in small arms, artillery, munitions, tanks and shipbuilding.\n\nThey come from: [GetBuildingType('building_arms_industry').GetName], [GetBuildingType('building_artillery_foundry').GetName], [GetBuildingType('building_munition_plant').GetName], [GetBuildingType('building_shipyard').GetName]. [GetBuildingType('building_automotive_industry').GetName] producing [GetGoods('tanks').GetName] count for half.\n\nWhile at [concept_war] with a [concept_country] of equal or higher rank (a superpower only against another superpower), they are multiplied by #P 2#! and gain #P +3%#! of the world leader's in the sector before the war, counted once a year.\n\nThe sector's [Concept('concept_good','$concept_goods|q$')]: [GetGoods('small_arms').GetName], [GetGoods('artillery').GetName], [GetGoods('ammunition').GetName], [GetGoods('tanks').GetName], [GetGoods('clippers').GetName], [GetGoods('steamers').GetName], [GetGoods('manowars').GetName], [GetGoods('ironclads').GetName]."
  ztr_patent_line_military: "\n$TAB$$TAB$• @ztr_patent_military! [Concept('concept_ztr_patent_military','$ztr_patent_name_military|q$')]: #v [ROOT.GetCountry.MakeScope.Var('ztr_patent_military').GetValue|0]#! · leader [GetGlobalVariable('ztr_patent_leader_military').GetCountry.GetFlagTextIcon] #v [GetGlobalVariable('ztr_patent_top_military').GetValue|0]#!"
