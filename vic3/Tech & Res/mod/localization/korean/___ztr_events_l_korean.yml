l_korean:
  ztr_un_start_governance_vote_tt: "@un_voting_model! A [Concept('concept_un_voting','$concept_un_voting$')] session opens in #v 30 days#!: every member eligible under the current [Concept('concept_un_voting_model','$concept_un_voting_model$')] (#v [ROOT.GetCountry.GetCustom('ztr_un_law_voting_model_name')]#!) will receive the vote event."
  ztr_un_event.11.t_adopted: "UN Proposal Adopted"
  ztr_un_event.11.t_rejected: "UN Proposal Rejected"
  ztr_un_event.11.t_vetoed: "UN Proposal Vetoed"
  ztr_un_event_11_tally: "#b Subject#!: #v [SCOPE.GetRootScope.GetCountry.GetCustom('ztr_un_last_vote_subject_name')]#!\n#b Proposal#!: #v [SCOPE.GetRootScope.GetCountry.GetCustom('ztr_un_last_vote_proposal_name')]#!\n\n#b Final tally#!\nSupport: #v [GetGlobalVariable('ztr_un_last_vote_support').GetValue|0]#!\nNeutral: #v [GetGlobalVariable('ztr_un_last_vote_neutral').GetValue|0]#!\nAgainst: #v [GetGlobalVariable('ztr_un_last_vote_against').GetValue|0]#!"
  ztr_un_event.11.d_adopted: "The vote session of the [Concept('concept_united_nations','$concept_united_nations$')] has closed and the General Assembly has #P adopted#! the proposal. The new rule now binds every UN member, including those that voted against it.\n\n$ztr_un_event_11_tally$"
  ztr_un_event.11.d_rejected: "The vote session of the [Concept('concept_united_nations','$concept_united_nations$')] has closed without a majority in favor: the proposal has been #N rejected#! and the current rule remains in force.\n\n$ztr_un_event_11_tally$"
  ztr_un_event.11.d_vetoed_one: "Most delegates of the [Concept('concept_united_nations','$concept_united_nations$')] backed the proposal, but [GetGlobalVariable('ztr_un_last_vote_vetoer').GetCountry.GetName] used its #N veto#! as a Permanent Member of the Security Council. The proposal is blocked and the current rule remains in force.\n\n$ztr_un_event_11_tally$"
  ztr_un_event.11.d_vetoed_many: "Most delegates of the [Concept('concept_united_nations','$concept_united_nations$')] backed the proposal, but [GetGlobalVariable('ztr_un_last_vote_vetoer').GetCountry.GetName] and other Permanent Members of the Security Council used their #N veto#!. The proposal is blocked and the current rule remains in force.\n\n$ztr_un_event_11_tally$"
  ztr_un_event.11.a: "The assembly has spoken."
