l_korean:
  rule_ztr_decolonization_content: "탈식민화 콘텐츠 (기술 및 연구)" # 15527103058950690597
  setting_allow_ztr_decolonization_content: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_allow_ztr_decolonization_content_desc #high 활성화됨#!#!#!" # 5107633600088820908
  setting_allow_ztr_decolonization_content_desc: "Allow general [Concept('concept_decolonization','$concept_decolonization|q$')] content during this campaign, for an #b historical#! experience after 1945."
  setting_no_ztr_decolonization_content: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_no_ztr_decolonization_content_desc #high 비활성화됨#!#!#!" # 9274366094724770440
  setting_no_ztr_decolonization_content_desc: "Disable general [Concept('concept_decolonization','$concept_decolonization|q$')] content during this campaign, for a #b vanilla#! and #b world-conquer#! gameplay-focused experience."
  rule_ztr_historical_content: "역사 콘텐츠 (기술 및 연구)" # 11474515142416685237
  setting_allow_ztr_historical_content: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_allow_ztr_historical_content_desc #high 활성화됨#!#!#!" # 5732491184352026988
  setting_allow_ztr_historical_content_desc: "현재는 #b 인도#!, #b 오스트리아#!, #b 러시아/소련#! 및 #b 오스만 제국#!과 관련된 역사적 콘텐츠를 허용합니다." # 8047340203686961150
  setting_no_ztr_historical_content: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_no_ztr_historical_content_desc #high 비활성화됨#!#!#!" # 2693353949908193139
  setting_no_ztr_historical_content_desc: "이 캠페인 동안 역사적 콘텐츠를 비활성화합니다. #b 바닐라#! 게임플레이 중심의 경험 또는 #b 역사 모드 호환성#!을 위함입니다." # 11635612977461624465
  rule_ztr_pop_lag_fix: "인구 지연 수정 (기술 및 연구)" # 6245015393751404810
  setting_allow_ztr_pop_lag_fix: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_allow_ztr_pop_lag_fix_desc #high 활성화됨#!#!#!" # 13035993384052170600
  setting_allow_ztr_pop_lag_fix_desc: "이 규칙은 수용되지 않은 문화의 낮은 공격적 동화를 수행하여 주 내의 팝 수를 줄입니다. 1936년 이후에는 동화가 공격적으로 변하여 일부 문화/종교 불균형이 발생하지만 게임 메커니즘을 손상시키지는 않습니다. 21세기 이후까지 이어지는 장기 게임 플레이에 권장됩니다." # 1425628611083772135
  setting_mid_ztr_pop_lag_fix: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mid_ztr_pop_lag_fix_desc #high 1936년 이후의 공격적인 성향#!#!#!" # 15411196954890801286
  setting_mid_ztr_pop_lag_fix_desc: "이 규칙은 1936년 이후에만 공격적인 동화(assimilation)를 활성화하며, 1936년 이전에는 바닐라 동화 메커니즘을 유지합니다." # 16990885203199775387
  setting_low_ztr_pop_lag_fix: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_low_ztr_pop_lag_fix_desc #high 1936년 이후 낮은 공격성#!#!#!" # 18278901009455914359
  setting_low_ztr_pop_lag_fix_desc: "이 규칙은 1936년 이후에만 저공격적 동화를 활성화하며, 1936년 이전에는 바닐라 동화 메커니즘을 유지합니다." # 6403034239116137814
  setting_no_ztr_pop_lag_fix: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_no_ztr_pop_lag_fix_desc #high 비활성화됨#!#!#!" # 4191751859998653169
  setting_no_ztr_pop_lag_fix_desc: "이 규칙은 게임 내내 바닐라 동화 메커니즘을 선호하는 분들을 위한 것입니다. (고사양 CPU)" # 17336977295938963235
  rule_ztr_atom_bomb_content: "#i 원자 폭탄#! 콘텐츠 (기술 및 연구)" # 8458084970349602656
  setting_allow_ztr_atom_bomb_content: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_allow_ztr_atom_bomb_content_desc #high 활성화됨#!#!#!" # 4744806861310752178
  setting_allow_ztr_atom_bomb_content_desc: "이번 캠페인 동안 #i 원자 폭탄#! 콘텐츠를 허용합니다. AI는 이전에 사용된 적이 없는 경우에만 핵을 사용합니다. 그 이후에는 플레이어만 사용할 수 있으며, AI는 플레이어의 공격으로부터 자신을 방어할 때만 사용할 수 있습니다." # 6278455353496255236
  setting_no_ztr_atom_bomb_content: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_no_ztr_atom_bomb_content_desc #high 비활성화됨#!#!#!" # 4652586534630264045
  setting_no_ztr_atom_bomb_content_desc: "더 바닐라 게임에 가까운 경험을 위해 이번 캠페인 동안 #i 원자 폭탄#! 콘텐츠를 비활성화합니다." # 7604286959078389313
  rule_ztr_climate_disasters: "기후 재난 (기술 및 연구)" # 7618628169183940381
  setting_allow_ztr_climate_disasters: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_allow_ztr_climate_disasters_desc #high 활성화됨#!#!#!" # 11309209653213049160
  setting_no_ztr_climate_disasters: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_no_ztr_climate_disasters_desc #high 비활성화됨#!#!#!" # 14348422863061479148
  setting_no_ztr_climate_disasters_desc: "Disable climate-driven [Concept('concept_harvest_condition','$concept_harvest_condition|q$')]. Global warming is still tracked in its [Concept('concept_journal_entry','$concept_journal_entry|q$')], but it will not spawn new disasters."
  rule_ztr_patent_research_bonus: "Patent Research Bonus (Tech&Res)"
  setting_allow_ztr_patent_research_bonus: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_allow_ztr_patent_research_bonus_desc #high Enabled#!#!#!"
  setting_allow_ztr_patent_research_bonus_desc: "The [Concept('concept_ztr_patents','$concept_ztr_patents|q$')] of the sectors of the technology in research add to the weekly [concept_innovation] and its cap of every country with a National Research Center."
  setting_no_ztr_patent_research_bonus: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_no_ztr_patent_research_bonus_desc #high Disabled#!#!#!"
  setting_no_ztr_patent_research_bonus_desc: "[Concept('concept_ztr_patents','$concept_ztr_patents|q$')] are still counted and shown, but give no research bonus."
  setting_allow_ztr_climate_disasters_desc: "Allow [Concept('concept_harvest_condition','$concept_harvest_condition|q$')] driven by [Concept('concept_effective_pollution','$concept_effective_pollution|q$')] during this campaign: extreme heatwaves, megadroughts, hurricanes, megafires and coastal inundation, scaling in frequency and severity with global warming."
