l_korean:
  concept_demographic_stages: "인구통계학적 단계" # 17496284837762556683
  concept_demographic_stage: "인구학적 단계" # 9954971245601459371
  concept_environment: "환경" # 4823802961980388586
  concept_environmental: "환경의" # 3968372296697003515
  concept_environment_desc: "[Concept('concept_environment','$concept_environment$')]은 자연 세계와 그에 대한 인간 활동의 영향을 일컫는 개념입니다. 이는 [Concept('concept_country','$concept_country$')]와 지구 전반의 생명을 지탱하는 공기, 물, 토지, 그리고 생태계를 포괄합니다. 환경은 모든 생명체의 생존에 중요하며, 그 건강은 미래 세대의 안녕에 필수적입니다. 환경주의 운동은 환경의 보호, 보존 및 복원을 옹호하며, 종종 천연 자원에 해를 끼칠 수 있는 산업화 및 경제 발전에 반대합니다." # 5881159753328029149
  ztr_concept_colonial_state: "식민지 주" # 9963177203650783711
  ztr_concept_colonial_states: "식민지 주" # 9963177203650783711
  ztr_concept_colonial_state_desc: "[Concept('concept_state','$concept_state$')]가 소유한 [Concept('concept_country','$concept_country$')]의 [Concept('concept_culture','$concept_cultures$')]에 대한 [Concept('concept_homeland','$concept_homeland$')]이 아니며, 해당 [Concept('concept_state','$concept_state$')]의 토착 [Concept('concept_culture','$concept_cultures$')] 모두가 더 많은 #v 자결권#!을 원하고 #v 독립#!을 열망할 수 있는 경우, 이를 #v 식민지 주#!로 간주합니다.\n\n[Concept('concept_culture','$concept_culture$')]가 탈식민지화를 원하는지 여부는 집권 [Concept('concept_country','$concept_country$')]의 [Concept('concept_democracy','$concept_democracy_adjective$')] 정도와 해당 [Concept('concept_culture','$concept_culture$')]가 그 안에서 얼마나 수용되는지에 따라 달라집니다:\n\n- #v 완전한 민주주의#!: [Concept('concept_acceptance','$concept_acceptance$')]가 #v 55#! 미만인 문화는 탈식민지화를 원합니다.\n- #v 결함 있는 민주주의#!: [Concept('concept_acceptance','$concept_acceptance$')]가 #v 60#! 미만인 문화는 탈식민지화를 원합니다.\n- #v 비민주주의#!: [Concept('concept_acceptance','$concept_acceptance$')]가 #v 65#! 미만인 문화는 탈식민지화를 원합니다." # 3690697270357929772
  concept_decolonization: "탈식민지화" # 5388154808830992804
  concept_decolonization_desc: "[Concept('concept_decolonization','$concept_decolonization$')]는 [Concept('concept_colony','$concept_colonial$')] 통치를 종식하고 식민지 영토의 독립을 확립하기 위한 정치적, 사회적 운동을 지칭하는 과정입니다. 이는 [Concept('concept_colony','$concept_colonial$')] 구조의 해체, 자결권 주장, 그리고 지역 통치권의 회복을 수반합니다. [Concept('concept_decolonization','$concept_decolonization$')] 과정은 복잡하고 다면적일 수 있으며, 흔히 협상, 분쟁, 그리고 국가 정체성의 재정의를 포함합니다." # 4089453368693063695
  concept_progressivism: "진보주의" # 6917497443017143232
  concept_progressivism_desc: "[Concept('concept_progressivism','$concept_progressivism$')]은 사회 개혁, 평등, 인권 신장을 옹호하는 정치적, 사회적 이념입니다. 이는 사회 내 진보적 변화의 필요성을 강조하며, 흔히 정부의 조치를 통해 빈곤, 차별, 환경 오염과 같은 문제를 해결하고자 합니다. 진보주의자들은 소외되고 불우한 이들에게 이로운 정책을 장려하고, 동시에 혁신과 기술 발전을 육성함으로써 더욱 공정하고 공평한 사회를 만들고자 노력합니다." # 4075342004487094089
  concept_united_nations: "유엔" # 14201776680300787493
  concept_liberty_index: "자유 지수" # 10224254528086149020
  concept_democracy: "민주주의" # 12171351702943594994
  concept_democracy_adjective: "민주적인" # 12500336123865823944
  concept_democracy_desc: "[Concept('concept_democracy','$concept_democracy$')]은 권력이 국민에게 직접 또는 선출된 대표를 통해 부여되는 정부 형태입니다. 이는 정치적 평등, 개인의 자유, 법치주의의 원칙을 강조합니다. [Concept('concept_democracy','$concept_democracy$')]에서 시민들은 의사 결정 과정에 참여하고, 의견을 표명하며, 지도자들에게 책임을 물을 권리를 가집니다. 민주주의 국가는 종종 정기적인 선거, 언론의 자유, 소수자 권리 보호를 특징으로 하며, 다양한 목소리가 경청되고 존중받는 사회를 조성합니다." # 18410193575733627407
  concept_autocracy: "전제정" # 3283050701421056428
  concept_autocracy_adjective: "전제적인" # 15606967643050215087
  concept_autocracy_desc: "[Concept('concept_autocracy','$concept_autocracy$')]은 절대적인 권력이 단일 통치자나 소수 집단에게 집중되는 통치 형태입니다. [Concept('concept_autocracy','$concept_autocracy$')]에서 통치 권력은 피치자의 동의나 참여 없이 정치적, 사회적, 경제적 측면에 대해 무제한적인 통제권을 가집니다. [Concept('concept_autocracy','$concept_autocracy_adjective$')] 체제는 반대를 억압하고, 자유를 제한하며, 의사 결정을 중앙집중화하여 책임감의 부재와 잠재적인 권력 남용으로 이어질 수 있습니다. 이러한 통치 형태는 권력이 국민과 그들의 선출된 대표자들 사이에 분산되는 [Concept('concept_democracy','$concept_democracy_adjective$')] 체제와는 극명하게 대조됩니다." # 17760762311172828539
  concept_superpower: "강대국" # 11786870363436856141
  concept_equality_index: "평등 지수" # 780557157593583698
  concept_equality_index_desc: "[Concept('concept_equality_index','$concept_equality_index$')]은 [Concept('concept_country','$concept_country$')] 내 사회적 및 경제적 평등 수준을 나타내는 척도입니다. [Concept('concept_equality_index','$concept_equality_index$')] 수치가 높을수록 인구 전반에 걸쳐 부, 기회, 자원이 보다 공평하게 분배되었음을 의미하며, 수치가 낮을수록 상당한 격차와 사회적 계층화가 존재함을 시사합니다. [Concept('concept_equality_index','$concept_equality_index$')]은 정부 정책, 사회 프로그램, 그리고 평등과 정의에 대한 문화적 태도를 포함한 다양한 요인에 의해 영향을 받습니다." # 1898711506959001227
  concept_developed_country: "선진국" # 6845750316031411147
  concept_developed_country_short: "선진" # 3615398243829911272
  concept_developed_countries: "선진국들" # 2029104628788855445
  concept_developed_country_desc: "어떤 국가가 특정 수준의 경제적, 사회적 발전에 도달했을 때 [Concept('concept_developed_country','$concept_developed_country_short$')]로 간주됩니다. 여기에는 1인당 GDP, 기대 수명, 교육 수준, 산업화와 같은 요소가 포함됩니다. [Concept('concept_developed_country','$concept_developed_country_short$')]는 일반적으로 고도로 발달한 인프라, 다각화된 경제, 그리고 시민들을 위한 높은 생활 수준과 복지를 특징으로 합니다." # 17241379502693118707
  concept_un_subject_imf: "IMF" # 12748625656390995145
  concept_un_subject_wto: "WTO" # 13407931444623835749
  concept_un_subject_icc: "국제형사재판소" # 11522383758185863320
  concept_un_subject_unesco: "유네스코" # 6934088768847158144
  concept_research_capacity: "연구 역량" # 18095458165707249953
  concept_research_capacities: "연구 역량" # 4019406805294163225
  concept_superpower_desc: "A $concept_superpower$ is a nation whose economic, military and diplomatic reach dominates the world stage.\n\n#b Requirements#!\nResearch [GetTechnology('neoimperialism').GetName] and hold #v 1st or 2nd place#! in the global [concept_prestige] ranking. Falling below 2nd place removes it.\n\n#b Benefits while active#!\n• #P +1,000#! [concept_influence]\n• #P +500%#! [concept_power_bloc_leverage] generation\n• #P +1,000#! [concept_power_bloc_leverage] resistance\n• #P +1#! maximum [Concept('concept_company','$concept_companies$')]\n\nA $concept_superpower$ leading a [concept_power_bloc] needs #v 50#! [concept_power_bloc_leverage_advantage] to invite a country or accept its request to join. The status also allows a [concept_power_bloc_leader] to propose merging blocs, subject to the action's other requirements."
  concept_un_voting: "UN Proposals and Voting"
  concept_un_membership: "UN Membership"
  concept_un_human_rights: "UN Human Rights Standards"
  concept_united_nations_desc: "The $concept_united_nations$ is an international forum for diplomacy, binding human-rights standards and specialized institutions. The #v 1st-ranked#! [concept_country] can found it from #v 1945#! after researching [GetTechnology('international_organizations').GetName].\n\nOpen the #v United Nations#! [concept_journal_entry] to see the Security Council, the current rules and the institutions. Hover the name of each rule or institution to see its options and effects.\n\n• [Concept('concept_un_membership','$concept_un_membership$')]: benefits, diplomatic costs and law changes on joining.\n• [Concept('concept_un_voting','$concept_un_voting$')]: proposals, voting and vetoes.\n• [Concept('concept_un_human_rights','$concept_un_human_rights$')]: binding law standards.\n\nInstitutions: [Concept('concept_un_subject_imf','$concept_un_subject_imf$')], [Concept('concept_un_subject_wto','$concept_un_subject_wto$')], [Concept('concept_un_subject_icc','$concept_un_subject_icc$')] and [Concept('concept_un_subject_unesco','$concept_un_subject_unesco$')]. The $concept_united_nations$ can also intervene in [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')]."
  concept_un_voting_model: "Voting Model"
  concept_un_voting_model_desc: "The $concept_un_voting_model$ of the [Concept('concept_united_nations','$concept_united_nations$')] decides which members can vote on proposals and how much each vote weighs. It can be reformed through [Concept('concept_un_voting','$concept_un_voting$')].\n\n#b $ztr_un_law_voting_model_1$#!\n$ztr_un_law_voting_model_1_desc$\n\n#b $ztr_un_law_voting_model_2$#!\n$ztr_un_law_voting_model_2_desc$\n\n#b $ztr_un_law_voting_model_3$#!\n$ztr_un_law_voting_model_3_desc$\n\n#b $ztr_un_law_voting_model_4$#!\n$ztr_un_law_voting_model_4_desc$\n\n$ztr_un_vote_resolution_rule$"
  concept_un_veto_right: "Veto Rights"
  concept_un_veto_right_desc: "$concept_un_veto_right$ decide whether a single Permanent Member of the Security Council can block a proposal of the [Concept('concept_united_nations','$concept_united_nations$')].\n\n#b $ztr_un_law_veto_right_enabled$#!\n$ztr_un_law_veto_right_enabled_desc$\n\n#b $ztr_un_law_veto_right_disabled$#!\n$ztr_un_law_veto_right_disabled_desc$"
  concept_un_member_selection: "Permanent Member Selection"
  concept_un_decolonization: "Statement on Decolonization"
  concept_un_decolonization_desc: "The $concept_un_decolonization$ sets the common standard of the [Concept('concept_united_nations','$concept_united_nations$')] on Colonial Affairs laws. Like all [Concept('concept_un_human_rights','$concept_un_human_rights$')], it binds every member, even those that voted against.\n\n#b $ztr_un_vote_proposal_decolonization_encouraged$#!\n$ztr_un_vote_proposal_decolonization_encouraged_desc$\n\n#b $ztr_un_vote_proposal_decolonization_conservative$#!\n$ztr_un_vote_proposal_decolonization_conservative_desc$\n\n#b $ztr_un_vote_proposal_decolonization_neutral$#!\n$ztr_un_vote_proposal_decolonization_neutral_desc$"
  concept_un_slavery: "Statement on Slavery"
  concept_un_slavery_desc: "The $concept_un_slavery$ sets the common standard of the [Concept('concept_united_nations','$concept_united_nations$')] on Slavery laws. Like all [Concept('concept_un_human_rights','$concept_un_human_rights$')], it binds every member, even those that voted against.\n\n#b $ztr_un_vote_proposal_slavery_illegal$#!\n$ztr_un_vote_proposal_slavery_illegal_desc$\n\n#b $ztr_un_vote_proposal_slavery_neutral$#!\n$ztr_un_vote_proposal_slavery_neutral_desc$"
  concept_un_children_rights: "Statement on Children's Rights"
  concept_un_children_rights_desc: "The $concept_un_children_rights$ sets the common standard of the [Concept('concept_united_nations','$concept_united_nations$')] on Child Labor laws. Like all [Concept('concept_un_human_rights','$concept_un_human_rights$')], it binds every member, even those that voted against.\n\n#b $ztr_un_vote_proposal_children_rights_negligible$#!\n$ztr_un_vote_proposal_children_rights_negligible_desc$\n\n#b $ztr_un_vote_proposal_children_rights_restricted_child_labor$#!\n$ztr_un_vote_proposal_children_rights_restricted_child_labor_desc$\n\n#b $ztr_un_vote_proposal_children_rights_compulsory_study$#!\n$ztr_un_vote_proposal_children_rights_compulsory_study_desc$"
  concept_un_women_rights: "Statement on Women's Rights"
  concept_un_women_rights_desc: "The $concept_un_women_rights$ sets the common standard of the [Concept('concept_united_nations','$concept_united_nations$')] on Women's Rights laws. Like all [Concept('concept_un_human_rights','$concept_un_human_rights$')], it binds every member, even those that voted against.\n\n#b $ztr_un_vote_proposal_women_rights_negligible$#!\n$ztr_un_vote_proposal_women_rights_negligible_desc$\n\n#b $ztr_un_vote_proposal_women_rights_gender_equality$#!\n$ztr_un_vote_proposal_women_rights_gender_equality_desc$"
  concept_un_subject_wto_desc: "Once established, every UN member receives:\n• #P +10#! $state_building_construction_sector_max_level_add$\n• #P +10%#! $state_import_advantage_mult$\n• #P +10%#! $state_export_advantage_mult$\n• #N -5%#! $state_tariff_import_add$\n• #N -5%#! $state_tariff_export_add$\n\nTrade becomes more competitive, at the cost of tariff revenue and protection for domestic producers. These effects apply while the country remains in the UN."
  concept_un_subject_imf_desc: "The IMF and World Bank unlock targeted financial aid and a separate modernization program.\n\n#b Financial aid for UN members#!\nAid is reassessed #v yearly#! using the current average [concept_sol]. Every aid tier gives #P -3%#! $country_loan_interest_rate_add$. Other bonuses depend on the tier:\n• Below #v 6#!: #P +2#! [concept_sol], #P +600%#! $country_minting_mult$, #P +40%#! $state_construction_mult$\n• #v 6 to 7#!: #P +1.5#! [concept_sol], #P +400%#! $country_minting_mult$, #P +40%#! $state_construction_mult$\n• #v 7 to 8#!: #P +1#! [concept_sol], #P +250%#! $country_minting_mult$, #P +35%#! $state_construction_mult$\n• #v 8 to 9#!: #P +0.5#! [concept_sol], #P +150%#! $country_minting_mult$, #P +25%#! $state_construction_mult$\n• #v 9 to 10#!: #P +100%#! $country_minting_mult$, #P +15%#! $state_construction_mult$\nAid ends at the yearly review once the average [concept_sol] reaches #v 10#!.\n\n#b Modernization program#!\nIndependent countries of at least [concept_minor_power] rank may enter if [concept_gdp_per_capita] is below #v 4#!, [concept_literacy] below #v 30%#! and average [concept_sol] below #v 9.5#!. UN membership is not required. While active it gives #P +5%#! $country_tech_spread_mult$ and #N -5%#! [concept_bureaucracy]; its events and projects may bring further costs. Complete it by exceeding #v 35%#! [concept_literacy], #v 10#! average [concept_sol] and #v 5#! [concept_gdp_per_capita] to gain #P +25%#! $country_tech_research_speed_mult$ for #v 25 years#!."
  concept_un_environment: "Statement on the Environment"
  concept_un_environment_desc: "The $concept_un_environment$ sets the common standard of the [Concept('concept_united_nations','$concept_united_nations$')] on Environmental Policy laws. Like all [Concept('concept_un_human_rights','$concept_un_human_rights$')], it binds every member, even those that voted against.\n\n#b $ztr_un_vote_proposal_environment_negligible$#!\n$ztr_un_vote_proposal_environment_negligible_desc$\n\n#b $ztr_un_vote_proposal_environment_basic_protection$#!\n$ztr_un_vote_proposal_environment_basic_protection_desc$"
  concept_un_labor_rights: "Statement on Labor Rights"
  concept_un_labor_rights_desc: "The $concept_un_labor_rights$ sets the common standard of the [Concept('concept_united_nations','$concept_united_nations$')] on Labor Rights laws, following the conventions of the International Labour Organization. Like all [Concept('concept_un_human_rights','$concept_un_human_rights$')], it binds every member, even those that voted against.\n\n#b $ztr_un_vote_proposal_labor_rights_negligible$#!\n$ztr_un_vote_proposal_labor_rights_negligible_desc$\n\n#b $ztr_un_vote_proposal_labor_rights_regulatory_bodies$#!\n$ztr_un_vote_proposal_labor_rights_regulatory_bodies_desc$\n\n#b $ztr_un_vote_proposal_labor_rights_worker_protections$#!\n$ztr_un_vote_proposal_labor_rights_worker_protections_desc$"
  concept_political_pole: "Ideological Pole"
  concept_ideology_index: "Ideology Index"
  concept_ideology_index_desc: "The [Concept('concept_ideology_index','$concept_ideology_index$')] of a [concept_country] combines its [Concept('concept_liberty_index','$concept_liberty_index$')] and [Concept('concept_equality_index','$concept_equality_index$')], both shaped by most of the [Concept('concept_law','$concept_laws$')] in force. A [Concept('concept_democracy','$concept_democracy_adjective$')] country usually reaches a higher [Concept('concept_liberty_index','$concept_liberty_index$')], while an [Concept('concept_autocracy','$concept_autocracy_adjective$')] one restricts individual freedoms. Redistribution and social programs raise the [Concept('concept_equality_index','$concept_equality_index$')], while free-market policies accept greater economic disparities.\n\nTogether, the two indices place a country in an [Concept('concept_political_pole','$concept_political_pole$')]."
  concept_political_pole_desc: "A [Concept('concept_political_pole','$concept_political_pole$')] is the long-term political character of a [concept_country], given by its [Concept('concept_liberty_index','$concept_liberty_index$')] and [Concept('concept_equality_index','$concept_equality_index$')] together:\n\n #positive_value Social#!: democratic and egalitarian\n #blue_value Liberal#!: democratic and individualist\n #negative_value Collectivist#!: authoritarian and egalitarian\n #gold_value Reactionary#!: authoritarian and individualist\n\nA country is democratic from #v 50#! [Concept('concept_liberty_index','$concept_liberty_index$')] and egalitarian from #v 70#! [Concept('concept_equality_index','$concept_equality_index$')]. Once assigned, a [Concept('concept_political_pole','$concept_political_pole$')] changes only when an index moves #v 1#! point past its threshold. Countries #v 20#! points past the threshold, with a [Concept('concept_liberty_index','$concept_liberty_index$')] of at least #v 70#! or below #v 30#!, form the #v core#! of their pole.\n\nPoles emerge with the age of mass politics, once [GetTechnology('political_agitation').GetName] is researched."
  concept_liberty_index_desc: "[Concept('concept_liberty_index','$concept_liberty_index$')] represents the level of personal and political freedoms enjoyed by the citizens of [Concept('concept_country','$concept_country$')]. An higher [Concept('concept_liberty_index','$concept_liberty_index$')] indicates a more open and [Concept('concept_democracy','$concept_democracy_adjective$')] society, while a lower index suggests a more [Concept('concept_autocracy','$concept_autocracy_adjective$')] regime, a dictatorship, or even a dystopia. The [Concept('concept_liberty_index','$concept_liberty_index$')] is influenced by most of the laws in place within the country.\n\n#negative_value Important#!: The #gold_value Law Group#! [GetLawGroup('lawgroup_distribution_of_power').GetName] will limit your maximum [Concept('concept_liberty_index','$concept_liberty_index$')]. A [GetPlayer.GetCustom('ztrpol_single_party_law_name')] with [GetLawType('law_secret_police').GetName] and [GetLawType('law_outlawed_dissent').GetName] loses a further #negative_value 12#! points; [GetLawType('law_secret_police').GetName] with [GetLawType('law_censorship').GetName], with or without a single party, loses #negative_value 6#!."
  concept_literate_citizens: "Literate Citizens"
  concept_research_capacity_desc: "[Concept('concept_research_capacity','$concept_research_capacity$')] measures how much scientific work a [Concept('concept_country','$concept_country$')] can actually direct, as opposed to how much science it happens to absorb from abroad. It is the pace at which the National Research Center pushes its programs forward, and it is built from three things:\n\n[Concept('concept_literate_citizens','$concept_literate_citizens$')], and by far the largest contribution.\n\n#v Country Development Level#!.\n\n#v $ztr_research_agreement$s#!: up to #v 2#! points each, less with a smaller partner or cold [concept_relations]. At most #v 6#! points, #v 8#! with [GetTechnology('funded_research_projects').GetName].\n\nWhat each point grants depends on the [Concept('concept_research_philosophy','$concept_research_philosophy$')] chosen in the National Research Center."
  concept_research_philosophy: "Research Philosophy"
  concept_literate_citizens_desc: "[Concept('concept_literate_citizens','$concept_literate_citizens$')] are the people of a [concept_country] who can read and write: its total [Concept('concept_pop','$concept_population$')] multiplied by its [Concept('concept_literacy','$concept_literacy$')]. A large educated population can sustain advanced academic and scientific institutions even where the national literacy rate is low, and it is the largest source of [Concept('concept_research_capacity','$concept_research_capacity$')]."
  concept_climate_stage: "Climate Stage"
  concept_effective_pollution: "Effective Pollution"
  concept_effective_pollution_desc: "$concept_effective_pollution$ is the pollution a [concept_country] adds to the atmosphere each year, and what drives global warming. It is the [concept_generated_pollution] of all its [Concept('concept_state','$concept_states$')], reduced by:\n\n• [GetLawType('law_basic_protection').GetName] #positive_value -5%#! or [GetLawType('law_active_restoration').GetName] #positive_value -10%#!\n• [GetInstitutionType('institution_environmental_policy').GetName]: #positive_value -5%#! per level, up to #positive_value -25%#!\n• [GetLawType('law_mining_restrict_hazardous').GetName] #positive_value -2%#!, [GetLawType('law_mining_strategic').GetName] #positive_value -5%#! or [GetLawType('law_polluting_mining_banned').GetName] #positive_value -10%#!\n• [GetTechnology('urban_sustainability').GetName]: #positive_value -10%#!\n\nReductions multiply each other. More industry and polluting [Concept('concept_production_method','$concept_production_methods$')] raise it, while cleaner ones such as carbon capture lower it at the source."
  concept_climate_stage_desc: "The $concept_climate_stage$ measures how far global warming has advanced, based on the rise of the global average temperature above the #v Pre-Industrial Age#!. Every #v +1 °C#! adds #negative_value +100%#! to the base chance of [GetHarvestConditionType('drought').GetName], [GetHarvestConditionType('heatwave').GetName], [GetHarvestConditionType('wildfire').GetName] and of every extreme climate disaster.\n\n#positive_value Historical Range#! (up to +0.5 °C): no extreme climate disasters.\n#v Detection#! (above +0.5 °C): warming caused by pollution becomes measurable; no new disasters yet.\n#negative_value The Thaw#! (above +1.0 °C): [GetHarvestConditionType('ztr_extreme_heatwave').GetName] and [GetHarvestConditionType('ztr_megadrought').GetName] can strike. Extreme climate disasters gain #negative_value +1#! [concept_harvest_condition_intensity].\n#negative_value Rising Seas#! (above +1.5 °C): [GetHarvestConditionType('ztr_hurricane').GetName] can hit cyclone coasts and [GetHarvestConditionType('ztr_extreme_wildfire').GetName] can strike. Intensity bonus rises to #negative_value +2#!.\n#negative_value Critical Warming#! (above +2.0 °C): [GetHarvestConditionType('ztr_coastal_flooding').GetName] can submerge low-lying coasts. Intensity bonus rises to #negative_value +3#!."
  concept_demographic_drift: "Demographic Drift"
  concept_demographic_factors: "Demographic Factors"
  concept_social_momentum: "Social Momentum"
  concept_demographic_stages_desc: "[Concept('concept_demographic_stages','$concept_demographic_stages$')] describe the demographic evolution of a [Concept('concept_country','$concept_country$')], measured by a score from #b 0 to 1000#!.\nStage 1 covers #b 0 to 200#!, then every #b #white 100#! Points#! the country moves to the next stage.\n#white Yearly Progress#! is limited to #positive_value +15#! and #negative_value -5#! points, and depends on [concept_demographic_drift], [concept_social_momentum] and [concept_demographic_factors].\n\n#v 1. Pre-Industrial#!:\n[GetStaticModifier('demographic_stage_1').GetDesc]\n#v 2. Early Industrial#!:\n[GetStaticModifier('demographic_stage_2').GetDesc]\n#v 3. Mid Industrial#!:\n[GetStaticModifier('demographic_stage_3').GetDesc]\n#v 4. Late Industrial#!:\n[GetStaticModifier('demographic_stage_4').GetDesc]\n#v 5. Early Post-Industrial#!:\n[GetStaticModifier('demographic_stage_5').GetDesc]\n#v 6. Mid Post-Industrial#!:\n[GetStaticModifier('demographic_stage_6').GetDesc]\n#v 7. Late Post-Industrial#!:\n[GetStaticModifier('demographic_stage_7').GetDesc]\n#v 8. Stagnant Stage#!:\n[GetStaticModifier('demographic_stage_8').GetDesc]\n#v 9. Declining Stage#!:\n[GetStaticModifier('demographic_stage_9').GetDesc]"
  concept_social_momentum_desc: "$concept_social_momentum$ compares today's [concept_sol] and GDP per capita with those of #b five years earlier#!. Growth above #b 4%#! counts as improvement.\n\n#white Stages 1 to 6#!:\n• Improvement #positive_value speeds up#! the transition.\n• Stagnation or recession #negative_value slows it down#!.\n\n#white Stage 7 onward#!:\n• Improvement #negative_value slows down#! the transition.\n• Stagnation or recession #positive_value speeds it up#!.\n\nIts strength grows with [concept_literacy]. It needs #b five years#! of recorded history."
  concept_demographic_factors_desc: "$concept_demographic_factors$ #b speed up#! or #b hold back#! the [Concept('concept_demographic_stages','$concept_demographic_stages$')] regardless of [concept_literacy] and [concept_sol]:\n• #b Healthcare Laws#!: [GetLawType('law_private_health_insurance').GetName] or [GetLawType('law_public_health_insurance').GetName] speed up stages 1 to 6.\n• #b Slavery Laws#!: legal slavery slows down the transition from stage 2.\n• #b Immigration Laws#!: [GetLawType('law_multicultural').GetName] or [GetLawType('law_no_migration_controls').GetName] slow it down from stage 3, more in later stages. Only in the Americas or below 200 million inhabitants.\n• #b Culture#!: a Sunni or Shia [concept_state_religion], or [GetLawType('law_hindu_caste_enforced').GetName] or [GetLawType('law_hindu_caste_codified').GetName] in [GetLawGroup('lawgroup_caste_hegemony').GetName], slow down stages 1 to 4.\n\nCountries in the #b Americas#! and #b Oceania#! have a slower demographic transition."
  concept_demographic_drift_desc: "$concept_demographic_drift$ is the structural push on the [Concept('concept_demographic_stages','$concept_demographic_stages$')]. It grows with:\n• [concept_literacy]: the #b main factor#!.\n• [concept_sol]: the push grows up to #b 20#!. From stage #b 6#!, a higher [concept_sol] adds a further push, strongest around #b 25#!.\n• #b Time#!: it grows every 30 years from #b 1880#!.\n\nThe push #b shrinks#! as the stage advances: a country whose stage is ahead of its literacy and living standards #b falls back#!."
  concept_un_human_rights_desc: "UN human-rights resolutions directly change incompatible [Concept('concept_law','$concept_laws$')] in member countries when adopted and when a country joins. They also block members from enacting laws below the adopted standard. Standards that require a technology or a level of development apply as soon as a member meets them. These obligations apply even to members that voted against.\n\nThe highest standards of the [concept_un_children_rights], the [concept_un_women_rights] and the [concept_un_labor_rights] are not imposed: every #v 5#! years, members that fall short are asked to enact [GetLawType('law_compulsory_primary_school').GetName], [GetLawType('law_women_in_the_workplace').GetName] or [GetLawType('law_worker_protections').GetName]. Refusing adds #N 5#! [concept_infamy] and a [Concept('concept_un_condemnation','$concept_un_condemnation$')]; a second one means expulsion.\n\nSix statements are available: [Concept('concept_un_decolonization','$concept_un_decolonization$')], [Concept('concept_un_slavery','$concept_un_slavery$')], [concept_un_children_rights], [concept_un_women_rights], [concept_un_environment] and [concept_un_labor_rights]."
  concept_un_subject_unesco_desc: "Once established, every UN member receives:\n• #P +50#! $country_tech_spread_add$\n• #N -25%#! $state_assimilation_mult$\n• #N -25%#! $country_prestige_from_army_power_projection_mult$\n• #N -25%#! $country_prestige_from_navy_power_projection_mult$\n\nUNESCO carries knowledge across borders, but its members commit to protecting cultural diversity and promoting a culture of peace. These effects apply while the country remains in the UN.\n\nEvery #v 5#! years, UNESCO also asks members with [GetLawType('law_no_schools').GetName] or [GetLawType('law_terakoya').GetName] to build a school system, preferably through [GetLawType('law_public_schools').GetName]. Refusing adds #N 5#! [concept_infamy] and a [Concept('concept_un_condemnation','$concept_un_condemnation$')]."
  concept_un_condemnation: "UN Condemnation"
  concept_un_condemnation_desc: "A member of the [Concept('concept_united_nations','$concept_united_nations$')] is condemned when it refuses a UN reform request, defies a UN intervention or keeps colonial or slave-holding practices banned by UN statements. Condemnations add up:\n• #b First condemnation#!: $ztr_un_condemned_modifier$ (#N -10%#! [concept_prestige], #N -15%#! [concept_influence], #N -10#! [concept_legitimacy]) and #N suspension#!: the country can neither vote nor propose reforms.\n• #b Second condemnation#!: the penalties are #N doubled#! and the country is #N expelled#! from the UN.\n\nThe count resets #v 10 years#! after the first condemnation: the penalties end and an expelled country may apply to join again. In cases of aggression, colonial rule or slavery, the [Concept('concept_un_subject_icc','$concept_un_subject_icc$')], once established, opens its own investigation on top of the condemnation."
  concept_un_member_selection_desc: "The $concept_un_member_selection$ rule of the [Concept('concept_united_nations','$concept_united_nations$')] decides how the permanent seats of the Security Council are assigned. Permanent Members can propose reforms and, while [Concept('concept_un_veto_right','$concept_un_veto_right$')] are enabled, veto proposals.\n\n#b $ztr_un_law_member_selection_1$#!\n$ztr_un_law_member_selection_1_desc$\n\n#b $ztr_un_law_member_selection_2$#!\n$ztr_un_law_member_selection_2_desc$\n\n#b $ztr_un_law_member_selection_3$#!\n$ztr_un_law_member_selection_3_desc$\n\n#b $ztr_un_law_member_selection_4$#!\n$ztr_un_law_member_selection_4_desc$\n\n#b Candidacy#!\nUnder $ztr_un_law_member_selection_1$, $ztr_un_law_member_selection_3$ and $ztr_un_law_member_selection_4$, a strong Ordinary Member can run for a permanent seat once every #v 30#! years: one of the #v 4#! strongest countries, or one of the #v 2#! strongest under $ztr_un_law_member_selection_4$. If the vote passes, it takes a vacant seat or replaces the weakest Permanent Member, which cannot use its veto in that vote.\n\n#b Elected seats#!\nEvery #v 9#! years, #v 4#! Ordinary Members of at least minor power rank are drawn at random for elected seats; members of the previous round cannot be drawn again. Elected members can propose human rights statements co-signed by a Permanent Member, and they vote when only the Security Council votes. The draw is repeated whenever the Permanent Members change."
  concept_un_subject_icc_desc: "Once established, every UN member receives:\n• #P +5#! $country_legitimacy_base_add$\n• #N +15%#! $country_infamy_generation_mult$\n\nAt the #v yearly review#!, UN members with #v 60 or more#! [concept_infamy] are placed under investigation for #v 5 years#!:\n• #N -25%#! $country_prestige_mult$\n• #N -50%#! $country_influence_mult$\n• #N -10%#! $country_infamy_decay_mult$\n\nStaying at or above the threshold renews the investigation at later reviews."
  concept_un_subject_iaea: "IAEA"
  concept_un_subject_iaea_desc: "The International Atomic Energy Agency oversees the peaceful use of nuclear energy and the reduction of nuclear arsenals. It can be proposed once the first atomic bomb has been used.\n\nOnce established, countries can sign the nuclear de-escalation treaties: #v $nuclear_de_escalation_treaty$#! and #v $pause_nuclear_weapons_development$#!."
  concept_un_membership_desc: "#b Benefits and costs for all members#!\n• #P +100#! weekly [concept_innovation]\n• #P +25#! [concept_legitimacy], scaled by the vote share of the parties in government\n• #v -80%#! [concept_migration] quota\n• #v -25%#! [concept_prestige] from army [concept_power_projection]\n\n#b Ordinary Members#!\n#N -25%#! [concept_influence], #N +50%#! [concept_infamy] generation and #P -5 percentage points#! [concept_loans] interest rate.\n\n#b Permanent Members#!\n#N -30%#! [concept_influence] and #N +35%#! [concept_infamy] generation. They can propose resolutions and, while veto rights are enabled, veto them.\n\n#b Joining#!\nJoining grants recognition to unrecognized countries and immediately adjusts laws:\n• [GetLawType('law_no_health_system').GetName] becomes [GetLawType('law_charitable_health_system').GetName]\n• [GetLawType('law_outlawed_dissent').GetName] becomes [GetLawType('law_censorship').GetName]\n• [GetLawType('law_ethnostate').GetName] or [GetLawType('law_national_supremacy').GetName] becomes [GetLawType('law_racial_segregation').GetName]\nActive [Concept('concept_un_human_rights','$concept_un_human_rights$')] also apply.\n\nEstablished [Concept('concept_un_subject_wto','$concept_un_subject_wto$')], [Concept('concept_un_subject_icc','$concept_un_subject_icc$')] and [Concept('concept_un_subject_unesco','$concept_un_subject_unesco$')] give additional bonuses. The [Concept('concept_un_subject_imf','$concept_un_subject_imf$')] targets low living standards instead of giving every member the same bonus.\n\nOrdinary Members can withdraw through a decision after researching [GetTechnology('international_organizations').GetName], from 1946 onward and outside an ongoing vote. Withdrawal adds #N 25#! [concept_infamy] and removes the UN, WTO, ICC and UNESCO membership modifiers.\n\n#b UN contributions#!\nEvery year each member owes #v 0.25%#! of its GDP, doubled once the [Concept('concept_un_subject_imf','$concept_un_subject_imf$')] exists and doubled again for Permanent Members, scaled by its development level: nothing at the lowest level, the full amount at the highest. It is paid every week under Additional Expenses in the budget. A condemned member pays nothing but loses its vote; withholding the contribution is itself a [Concept('concept_un_condemnation','$concept_un_condemnation$')]."
  concept_un_voting_desc: "Permanent Members of the Security Council can propose changes through the #v United Nations#! [concept_journal_entry]. After #v 30 days#! of discussion, eligible voters receive an event and the #v UN Vote Session#! [concept_journal_entry] opens for #v six months#!.\n\nVote through the event or the #v Vote In Favor#! and #v Vote Against#! buttons of the [concept_journal_entry]. You may change your vote until the session closes. If you postpone your decision, you are counted as neutral; neutral votes add neither support nor opposition.\n\nEligibility and vote weight depend on the current [Concept('concept_un_voting_model','$concept_un_voting_model$')]. A proposal passes only when #P support exceeds opposition#! at the end of the session; a tie fails. If [Concept('concept_un_veto_right','$concept_un_veto_right$')] are enabled, #N a Permanent Member can block the proposal by casting a veto#!; a veto that blocks a majority can be cast again only after #v 10 years#!.\n\nAdopted effects apply to all UN members, including those that opposed the proposal. After a session closes, AI members will not put forward new proposals for #v 4 years#!."
  concept_research_philosophy_desc: "The [Concept('concept_research_philosophy','$concept_research_philosophy$')] sets how the National Research Center uses each point of [Concept('concept_research_capacity','$concept_research_capacity$')]:\n\n#v Independent Research#!: #P +4#! maximum [Concept('concept_innovation','$concept_innovation$')] and #N -0.5%#! [Concept('concept_technology_spread','$concept_technology_spread$')]. A large scientific establishment sets its own direction, but is slower to adopt foreign discoveries. Best suited to countries with more than #v 40 million#! [Concept('concept_literate_citizens','$concept_literate_citizens$')].\n\n#v Technology Absorption#!: #P +3%#! [Concept('concept_technology_spread','$concept_technology_spread$')]. A smaller establishment learns faster from abroad.\n\nIt can then be changed once every #v 10#! years."
