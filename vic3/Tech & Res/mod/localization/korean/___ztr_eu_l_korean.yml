  ztr_eu_event.20.c: "[Concept('concept_ztr_eu_dir_schengen','$ztr_eu_subject_2_loc$')]을(를) 상정합니다." # 7350791985530550682
  ztr_eu_event.20.e: "[Concept('concept_ztr_eu_dir_schengen','$ztr_eu_subject_2_loc$')]의 폐지를 발의합니다." # 12381767663502919211
  ztr_eu_event.20.l: "[Concept('concept_ztr_eu_dir_cohesion','$ztr_eu_subject_6_loc$')]을(를) 상정합니다." # 14387278005725236827
  ztr_eu_event.20.m: "[Concept('concept_ztr_eu_dir_cohesion','$ztr_eu_subject_6_loc$')]의 폐지를 발의합니다." # 12309686075696166017
  ztr_eu_event.20.n: "#gold_value $ztr_eu_subject_8_loc$#! [Concept('concept_power_bloc_principle','원칙')]을(를) 강화합니다." # 17093758631636536297
  ztr_eu_event.20.o: "#gold_value $ztr_eu_subject_9_loc$#! [Concept('concept_power_bloc_principle','원칙')]을(를) 확장합니다." # 3600187416849751031
  ztr_eu_event.20.z: "다시 생각해보니 안건이 꽉 찼습니다." # 15098617346394670882
  ztr_eu_event.21.t: "조약 회의" # 4077084265099191685
  ztr_eu_event.21.d: "유럽 이사회의 의장으로서 우리는 회원국들을 소집하여 다음 단계의 통합을 추진할 수 있습니다. 두 거대 조약 모두 이사회 표결이 아닙니다. $ztr_eu_subject_7_loc$은 우리가 선포하는 순간 발효됩니다. 모든 회원국은 개별적으로 소집을 받으며, 아직 도입하지 않았다면 #b 유로#!를 채택하고 연합체에 남을지, 아니면 거부할지 선택해야 합니다. 연방 제안 역시 다른 모든 연합 회원국에게 개별 초청장을 보내며, 각 국가는 스스로 연합 여부를 결정합니다." # 15273224302396494986
  ztr_eu_event.21.a: "유럽 연합체를 수립하는 조약 회의를 소집합니다." # 6620012958086019135
  ztr_eu_event.21.b: "연합에 유럽 연방 결성을 제안합니다." # 1612164253994939598
  ztr_eu_event.21.z: "유럽은 아직 준비되지 않았습니다. 회의를 휴회합니다." # 4694771061977316914
  ztr_eu_event.25.t: "이사회의 결정" # 355440007706983877
  ztr_eu_event.25.d: "[ROOT.GetCountry.GetCustom('ztr_eu_last_vote_action_name')]에 대한 [ROOT.GetCountry.GetCustom('ztr_eu_last_vote_subject_name')]#!의 표결이 이중 과반수로 #p 가결#!되었습니다. 이제 이 결정은 [ROOT.GetCountry.GetCustom('ztr_eu_org_name')]의 모든 회원국을 구속합니다." # 9085763143124600907
  ztr_eu_event.25.a: "유럽의 결정이 내려졌습니다." # 15573812847111862045
  ztr_eu_event.26.t: "제안 부결" # 13688005737482148580
  ztr_eu_event.26.d: "[ROOT.GetCountry.GetCustom('ztr_eu_last_vote_action_name')]에 대한 [ROOT.GetCountry.GetCustom('ztr_eu_last_vote_subject_name')]#!의 표결이 국가 및 의석 이중 과반수를 확보하는 데 #n 실패#!했습니다. 이사회가 산회하며, 해당 안건은 2년 동안 다시 상정될 수 없습니다." # 11311752961480190914
  ztr_eu_event.26.a: "유럽은 의혹의 속도만큼 움직입니다." # 15011734869153178023
  ztr_eu_event.30.t: "우리의 유로" # 16983009884774099122
  ztr_eu_event.30.d: "자정에 환전소들이 전광판을 바꾸었습니다. 우리의 자국 통화는 더 이상 존재하지 않습니다. 이제 #b 유로#!는 우리 빵집의, 은행의, 그리고 예산의 화폐가 되었습니다. 대륙 전역에서 신용이 더 저렴하게 유통되지만, 이제 화폐 발행기는 우리 장관이 아닌 유럽 중앙은행의 지시를 받습니다." # 8958566670059365741
  ztr_eu_event.30.f: "어린아이들이 옛 지폐의 가치를 묻는 동안, 구권은 앨범과 박물관 진열장에 꽂힙니다." # 4852885957475328924
  ztr_eu_event.30.a: "하나의 시장, 하나의 화폐." # 12677224140308912147
  ztr_eu_event.31.t: "유럽 중앙은행" # 10521176035355660704
  ztr_eu_event.31.d: "첫 회원국의 유로화 도입과 함께 #b 유럽 중앙은행#!이 [SCOPE.sCountry('ecb_host_scope').GetName]에 문을 엽니다. 오늘부터 단일 통화 당국이 공통 통화의 안정을 감독하며, 확장적, 중립적, 긴축적인 그 기조는 유로존의 모든 재무부에 영향을 미치게 됩니다." # 14118724977244937358
  ztr_eu_event.31.f: "금융 지구 위에 유리와 강철로 된 타워가 솟아오르고, 그 금고는 어떤 왕의 것보다 깊습니다." # 15613941668010240097
  ztr_eu_event.31.a: "대륙에 은행가가 생겼습니다." # 5907477454594403447
  ztr_eu_event.32.t: "[SCOPE.sCountry('ecb_host_scope').GetCapital.GetCityHubName]의 금리 인하" # 8292384713789652431
  ztr_eu_event.32.d.expansive: "유럽 중앙은행이 #p 확장적#! 기조를 채택했습니다. 금리가 인하되고 유로존 전역의 통화 공급이 확대됩니다. 저렴한 신용은 경제에 온기를 불어넣을 것이며, 어쩌면 과열시킬 수도 있습니다." # 18012710642033981695
  ztr_eu_event.32.d.neutral: "유럽중앙은행이 #v 중립적#! 입장을 취하며 유로존이 자연스러운 흐름을 되찾도록 했습니다." # 3251661470454198220
  ztr_eu_event.32.d.restrictive: "유럽중앙은행이 #n 긴축적#! 입장을 채택했습니다. 금리가 인상되고 유로화가 강세를 보입니다. 저축자와 채권자는 미소 짓고, 채무자는 허리띠를 졸라맵니다." # 8963855142840483375
  ztr_eu_event.32.a: "이에 맞춰 장부를 조정합니다." # 3700065547404279981
  ztr_eu_event.40.t: "유럽의 영혼이 바뀌다" # 3309067277952000873
  ztr_eu_event.40.d: "수십 년 간의 선거, 쿠데타, 그리고 조용한 표류 끝에 평의회 테이블에 앉은 정부들이 재편되었습니다. 이제 [ROOT.GetCountry.GetCustom('ztr_eu_org_name')]의 정치적 성향은 #v [ROOT.GetCountry.GetCustom('ztr_eu_ideology_name')]#!입니다." # 6426397524799264750
  ztr_eu_event.40.f: "똑같은 국가, 똑같은 별의 고리이지만, 이제 연설에는 다른 신념이 담겨 있습니다." # 2680701714509511837
  ztr_eu_event.40.a: "유럽은 회원국들이 만들어가는 것입니다." # 16196374979598395300
  ztr_eu_ideology_shift_tt: "연합의 가입 기준, 유럽주의 성향, 그리고 탈퇴 정치 이제 #v 새로운 성향#!을 따릅니다. 더 이상 이에 부합하지 않는 정부를 가진 회원국들은 탈퇴를 정당화하기 더 쉬워질 것입니다." # 7231261773934228757
  ztr_eu_event.60.t: "유럽을 위한 연맹" # 3361078395842763448
  ztr_eu_event.60.d: "[SCOPE.sCountry('eu_founder').GetName](이)가 회원국들을 조약 회의로 소집하여 단 하나의 안건을 테이블에 올렸습니다. 의장의 연설 내용: #italic '한 세대 동안 이 연합은 우리의 시장, 국경, 법률을 그 어느 때보다 긴밀하게 묶어왔습니다. 그러나 역사는 망설이는 자들을 기다려주지 않습니다. 이제 더 큰 도약을 할 때입니다. 바로 유럽 연맹입니다. 단일 시장, 단일 통화, 단일 대외 국경, 공통의 기관을 통해 유럽의 국가들을 영원히 결속시키고, 하나의 목적지인 단일 유럽 국가를 향해 나아갑니다. 유럽을 믿는 자들은 서명하고, 그렇지 않은 자들은 떠나도록 하십시오.'#!\n\n숨을 곳인 투표는 없습니다. 서명한다면 우리는 #v 유럽 연맹#!에 가입하고 아직 채택하지 않았다면 #b 유로화#!를 도입하게 됩니다. 거부한다면 우리는 유럽 프로젝트에서 완전히 탈퇴합니다." # 11723513863096133817
  ztr_eu_event.60.f: "대륙 전역에서 내각이 밤을 새우며 회의를 진행하고 있습니다. 이것은 한 세대의 정치가들이 답하기를 바랐거나 두려워했던 질문입니다." # 6213235802240444237
  ztr_eu_event.60.a: "서명한다. 우리의 미래는 연맹에 있다." # 4838727051699718568
  ztr_eu_event.60.b: "거부한다. 우리는 유럽 프로젝트를 떠난다." # 12368620445794627593
  ztr_eu_event.70.t: "연방 유럽으로의 초대" # 9878387510480364814
  ztr_eu_event.70.d: "[SCOPE.sCountry('eu_federation_partner').GetName](이)가 우리를 단일 주권 국가인 #b 유럽 연방#!으로 통합하자고 제안했습니다. 이것은 평의회 투표가 아니며, 모든 국가는 스스로 답해야 합니다. 제안자의 초대를 가장 먼저 수락하는 국가는 그들과 함께 연방을 창설할 것이며, 이후에 서명하는 모든 국가는 이미 선포된 연방국과 통합될 것입니다. 거부할 경우, 우리는 미래의 가입 가능성을 열어둔 채 독립을 유지합니다." # 1548307118455750668
  ztr_eu_event.70.f: "유럽 전역에서 정부들이 똑같은 봉투를 열고 돌이킬 수 없는 선택과 직면합니다." # 3046875313233249335
  ztr_eu_event.70.a: "수락한다. 우리의 미래는 연방 유럽에 있다." # 12945618413950753773
  ztr_eu_event.70.b: "거절한다. 우리는 독립을 유지할 것이다." # 8441024864940193474
  ztr_eu_start_federation_invitations_tt: "개별 초대가 #v 유럽 연맹#!의 모든 다른 회원국들에게 발송됩니다. 제안자는 자동으로 연방 통합에 서약하며, 첫 번째 수락으로 #v 유럽 연방#!이 창설되고, 이후의 모든 수락은 해당 국가를 연방과 통합시킵니다." # 16331230420061181105
  ztr_eu_neutral_financial_hub_exclusion_tt: "스위스가 아닙니다." # 2051700644421649280
