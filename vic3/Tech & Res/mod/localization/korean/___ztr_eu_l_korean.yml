  concept_european_union: "유럽 연합" # 16919209361880444817
  concept_european_union_desc: "유럽의 국가들을 더욱 긴밀하게 결속시키는 정치적·경제적 연합으로, 회원국들의 유럽 이사회와 인구 비례로 배분된 유럽 의회를 통해 통치됩니다." # 17523088588674255196
  concept_ztr_eu_phases: "유럽 통합 단계" # 7339119849909161116
  concept_ztr_eu_phases_desc: "유럽 프로젝트는 더욱 긴밀한 연합을 향한 #v 네 가지 단계#!를 거쳐 진전됩니다:\n 1. #v 유럽 경제 공동체#!: 로마 조약으로 탄생한 유럽 국가들의 관세 동맹체.\n 2. #v 유럽 연합#!: 유럽 의회, 이중 과반수로 투표하는 이사회, 그리고 유로화로 향하는 길을 갖춘 정치적 연합.\n 3. #v 유럽 연합체#!: 단일 시장, 단일 통화, 단일 대외 국경 및 공동 기관을 갖춘 연합체 블록. 연합 조약에 서명하는 것은 #b 유로화#!의 도입을 의미하며, 거부하는 것은 유럽 프로젝트의 탈퇴를 의미합니다.\n 4. #v 유럽 연방#!: 마지막 단계. 연합체의 의장이 각 회원국에게 단일 주권 연방 유럽으로의 통합을 제안하며, 각국은 스스로 결정합니다." # 5499328270322742828
  concept_ztr_eu_chair: "유럽 이사회 의장" # 13889452465894181612
  concept_ztr_eu_chair_desc: "가장 영향력 있는 회원국에게 #v 매년#! 순환되는 자리인 #v 유럽 이사회#!를 주재하는 국가입니다. 의장은 이사회 회의를 주관하며, 유럽 연합체를 수립하는 조약 회의를 소집하거나 연합 회원국들을 초청하여 유럽 연방을 결성할 수 있는 유일한 자격 가집니다. 연합체 단계부터는 이 자리가 연합의 권력 블록 지도자에게 고정됩니다." # 16243302594895652463
  concept_ztr_eu_directive: "유럽 지침" # 3634301714189650032
  concept_ztr_eu_directive_desc: "지침은 연합의 공통 정책입니다. 모든 회원국은 #v 유럽 이사회#!에 지침을 상정할 수 있으며, 이사회는 다음의 #v 이중 과반수#! 시스템에 따라 이를 제정하거나 폐지합니다:\n- #b 회원국#!의 과반수 (각 정부는 자국의 1표 행사);\n- #b 의회 의석#!의 과반수 (각 국가 대표단은 자국 사회의 [Concept('concept_ztr_eu_europeanism','유럽주의')]에 따라 의석을 배분).\n\n지침이 효력을 발휘하는 동안, 모든 회원국은 해당 [concept_modifier]를 적용받습니다.\n지침은 총 세 가지가 있습니다:\n- #b $ztr_eu_subject_1_loc$#!\n- #b $ztr_eu_subject_2_loc$#!\n- #b $ztr_eu_subject_6_loc$#!\n\n#v 유럽 연합체#! 단계부터는 지침이 고정되며, 이사회는 대신 동일한 이중 과반수 투표를 통해 연합체의 두 가지 [Concept('concept_power_bloc_principle','원칙')]인 #b $ztr_eu_subject_8_loc$#!과 #b $ztr_eu_subject_9_loc$#!을 강화를 두고 투표합니다." # 7323131523435163800
  concept_ztr_eu_europeanism: "유럽주의" # 15825444317655213818
  concept_ztr_eu_europeanism_desc: "유럽 프로젝트를 향한 국가의 지지도로, 연합의 성향과 일치하는 이익 집단의 정치적 영향력으로 측정됩니다 (미온적인 집단은 절반의 가중치로 계산됨). 이는 두 가지 방식으로 적용됩니다:\n- #v 전체 사회#! 전반에 걸쳐 적용되어, 모든 평의회 표결에서 국가 의회 대표단의 의석 배분을 결정합니다.\n- #v 정부#! 단독으로 적용되어, 평의회에서 국가 자체의 투표 방향을 결정합니다.\n\n모든 평의회 결과는 이에 피드백을 줍니다: 승리한 진영의 팝들은 충성스러워지는 반면, 패배한 진영은 과격화되어 수년 동안 팝들을 자신들의 이익 집단으로 결집시킵니다." # 10581636964545654990
  concept_ztr_eu_dir_agriculture: "@agricolture_eu! 공동 농업 정책" # 17293672385546338477
  concept_ztr_eu_dir_agriculture_desc: "대륙의 농장을 보조금으로 지원하고 통합하는 지침입니다. 효력을 발휘하는 동안, 모든 회원국은 #v $ztr_eu_dir_agriculture_mod$#! 효과를 받습니다:\n#p +5%#! 농업 건물 처리량\n#p +5%#! 플랜테이션 건물 처리량\n#p +10%#! 식량 안보\n#n -5%#! 식품 산업 건물 처리량\n#n -3%#! @bur! 관료제" # 8695964507335121396
  concept_ztr_eu_dir_schengen: "@schengen_eu! 자유 이동 지역 (솅겐)" # 12306569866991856805
  concept_ztr_eu_dir_schengen_desc: "연합 내 국경 통제를 철폐하는 지침입니다. 효력을 발휘하는 동안, 모든 회원국은 #v $ztr_eu_dir_schengen_mod$#! 효과를 받습니다:\n#p +15%#! 이주 매력도\n#p +10%#! 기술 전파\n#p +2%#! 노동력 비율\n#n -3%#! @bur! 관료제" # 12670555141959392142
  concept_ztr_eu_dir_cohesion: "@cohesion_eu! 결속 기금" # 12411573802314008508
  concept_ztr_eu_dir_cohesion_desc: "연합 내에서 경제가 낙후된 국가들에 투자를 집중시키는 지침입니다. 매년 각 회원국은 연합의 평균 1인당 [concept_gdp]과 비교 측정됩니다.\n평균 이하인 국가는 #v $ztr_eu_dir_cohesion_mod_poor$#! 효과를 받습니다:\n#p -5%#! 건설 물자 비용\n#p +5%#! 기술 전파\n#n -5%#! 위신\n#n -3%#! @bur! 관료제\n평균 이상인 국가는 #v $ztr_eu_dir_cohesion_mod_rich$#! 효과를 받습니다:\n#p +5%#! 위신\n#n -3%#! @bur! 관료제" # 6657198432088150983
  je_group_global_eu_content: "유럽 연합" # 16919209361880444817
  je_eu_info_panel: "유럽 연합" # 16919209361880444817
  je_eu_info_panel_reason: "#blue_value [ROOT.GetCountry.GetCustom('ztr_eu_org_name')]#!은(는) #gold_value 유럽#!의 국가들을 더욱 긴밀하게 결속시킵니다. 그 노선은 다음과 같이 결정됩니다:\n - #v 유럽 평의회#!: 회원국들이 [concept_country]당 한 표씩 행사하여 공동 지침에 투표합니다.\n - #v 유럽 의회#!: 총 #v 360#!석이며, [concept_country]당 인구에 따라 #v 5년#!마다 또는 #v 신규 회원국#! 가입 시에 의석이 재배분됩니다.\n\n#gold_value [Concept('concept_ztr_eu_phases','현재 단계')]#!: [ROOT.GetCountry.GetCustom('ztr_eu_phase_name')]\n#gold_value 정치적 성향#!: [ROOT.GetCountry.GetCustom('ztr_eu_ideology_name')]\n#gold_value [Concept('concept_ztr_eu_chair','평의회 의장국')]#!: [GetGlobalVariable('ztr_eu_chair_var').GetCountry.GetName]\n[Concept('concept_ztr_eu_europeanism','유럽주의')]: 우리 사회의 #p [ROOT.GetCountry.MakeScope.Var('ztr_eu_j_pop_display').GetValue|0]%#!, 정부의 #p [ROOT.GetCountry.MakeScope.Var('ztr_eu_j_gov_display').GetValue|0]%#!\n\n[concept_gdp]: #v @gdp! [GetGlobalVariable('ztr_eu_total_gdp_display').GetValue|vD]#!\n[Concept('concept_pop', '$concept_population$')]: #v @population! [GetGlobalVariable('ztr_eu_total_pop_display').GetValue|vD]#!\n\n#v 의회 내 우리의 의석#!: 총 #v 360#!석 중 #p [ROOT.GetCountry.MakeScope.Var('ztr_eu_seats').GetValue|0]#!석\n(다음 임기까지 #v [GetGlobalVariable('ztr_eu_seats_timer').GetValue|0]#!년 남음)\n\n#i 활성화된 [Concept('concept_ztr_eu_directive','지침')]#!:[ROOT.GetCountry.GetCustom('ztr_eu_dir_agriculture_row_type')][ROOT.GetCountry.GetCustom('ztr_eu_dir_schengen_row_type')][ROOT.GetCountry.GetCustom('ztr_eu_dir_cohesion_row_type')][ROOT.GetCountry.GetCustom('ztr_eu_dir_none_row_type')]\n\n#v 의회 의석별 회원국 현황#!:\n[SCOPE.GetRootScope.GetCountry.GetCustom('ztr_eu_member_display_rank_1_type')][SCOPE.GetRootScope.GetCountry.GetCustom('ztr_eu_member_display_rank_2_type')][SCOPE.GetRootScope.GetCountry.GetCustom('ztr_eu_member_display_rank_3_type')][SCOPE.GetRootScope.GetCountry.GetCustom('ztr_eu_member_display_rank_4_type')][SCOPE.GetRootScope.GetCountry.GetCustom('ztr_eu_member_display_rank_5_type')][SCOPE.GetRootScope.GetCountry.GetCustom('ztr_eu_member_display_rank_6_type')][SCOPE.GetRootScope.GetCountry.GetCustom('ztr_eu_member_display_rank_7_type')][SCOPE.GetRootScope.GetCountry.GetCustom('ztr_eu_member_display_rank_8_type')][SCOPE.GetRootScope.GetCountry.GetCustom('ztr_eu_member_display_rank_9_type')][SCOPE.GetRootScope.GetCountry.GetCustom('ztr_eu_member_display_rank_10_type')]\n\n모든 회원국은 평의회에 안건을 상정할 수 있으며, 오직 의장국만이 거대 조약 회의를 소집할 수 있습니다. 지침(그리고 연방 단계에서는 그 원칙들의 강화)은 #b 이중 과반수#!로 통과됩니다: 각 정부가 자국의 투표권을 행사하는 회원국 과반수, 그리고 각 대표단이 자국 사회의 [Concept('concept_ztr_eu_europeanism','유럽주의')] 성향에 따라 표가 갈라지는 의회 의석 과반수가 모두 충족되어야 합니다. 거대 조약들은 다릅니다. 유럽 연합체와 유럽 연방은 모든 회원국에게 개별적인 소환을 통보하며, 각 국가는 스스로에 대해 책임을 집니다." # 15414766155852101015
