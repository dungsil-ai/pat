  je_eu_votations_reason: "[JournalEntry.GetCustom('ztr_eu_org_name_je')] 이사회에서 #v [JournalEntry.GetCustom('ztr_eu_vote_subject_name_je')]#!의 [JournalEntry.GetCustom('ztr_eu_vote_action_name_je')]에 대한 표결을 진행 중입니다.\n\n이 안건은 #v 이중 과반수#!를 통과해야 합니다: 찬성하는 #b 회원국#! 수가 반대하는 수보다 많고, 동시에 찬성하는 #b 의회 의석#! 수가 반대하는 수보다 많아야 합니다. 각국 정부는 자국의 표를 행사하며 - 입장을 표명하지 않은 국가는 양측 어디에도 산정되지 않습니다 - 한편 #v 360석#!의 의회 의석은 국민들을 따릅니다: 각 대표단은 자국 사회의 [Concept('concept_ztr_eu_europeanism','유럽주의')] 성향에 따라 양측으로 나뉩니다.\n\n#v 회원국#!: 찬성 #p [GetGlobalVariable('ztr_eu_vote_support_countries').GetValue|0]#!개국 - 반대 #n [GetGlobalVariable('ztr_eu_vote_against_countries').GetValue|0]#!개국\n#v 의회 의석#!: 찬성 #p [GetGlobalVariable('ztr_eu_vote_support_seats').GetValue|0]#!석 - 반대 #n [GetGlobalVariable('ztr_eu_vote_against_seats').GetValue|0]#!석\n#v 우리 대표단#!: 유럽주의자 #p [ROOT.GetCountry.MakeScope.Var('ztr_eu_europeist_seats').GetValue|0]#!석 - 회의주의자 #n [ROOT.GetCountry.MakeScope.Var('ztr_eu_eurosceptic_seats').GetValue|0]#!석" # 14253384353731928554
  je_eu_votations_lobby: "$je_eu_votations_reason$" # 15151124392497137875
  je_eu_votations_status_passing: "#gold_value 표결 추세#!: #p 가결 예상#!\n#blue_value 남은 기간#!: #v [GetGlobalVariable('ztr_eu_vote_months_remaining').GetValue|0]#!개월" # 2400658041049791712
  je_eu_votations_status_failing: "#gold_value 표결 추세#!: #n 부결 예상#!\n#blue_value 남은 기간#!: #v [GetGlobalVariable('ztr_eu_vote_months_remaining').GetValue|0]#!개월" # 6349789076703879509
  ztr_eu_vote_support_progress_bar: "찬성 의회 비율: #v [GetGlobalVariable('ztr_eu_vote_support_percent').GetValue|0]%#!" # 18002859811243135106
  ztr_eu_vote_support_progress_bar_desc: "찬성 의회 의석: 총 #v [GetGlobalVariable('ztr_eu_vote_total_seats').GetValue|0]#!석 중 #v [GetGlobalVariable('ztr_eu_vote_support_seats').GetValue|0]#!석 (#v [GetGlobalVariable('ztr_eu_vote_support_percent').GetValue|0]%#!)" # 14391581433550652702
  ztr_eu_vote_against_progress_bar: "반대 의회 비율: #v [GetGlobalVariable('ztr_eu_vote_against_percent').GetValue|0]%#!" # 7235728701782956969
  ztr_eu_vote_against_progress_bar_desc: "반대 의회 의석: 총 #v [GetGlobalVariable('ztr_eu_vote_total_seats').GetValue|0]#!석 중 #v [GetGlobalVariable('ztr_eu_vote_against_seats').GetValue|0]#!석 (#v [GetGlobalVariable('ztr_eu_vote_against_percent').GetValue|0]%#!)" # 16599405540930892031
  ztr_eu_open_directives_menu: "지침 상정" # 7959268558418280621
  ztr_eu_open_directives_menu_desc: "모든 회원국은 #v 유럽 이사회#!에 [Concept('concept_ztr_eu_directive','지침')]을 상정할 수 있습니다. 해당 안건은 모든 회원국의 표결에 부쳐지며 #v 이중 과반수#!로 결정됩니다." # 2836962512062030724
  ztr_eu_open_treaties_menu: "조약 회의 소집" # 11599847100362788644
  ztr_eu_open_treaties_menu_desc: "유럽 이사회의 의장으로서, 우리는 통합을 새로운 단계로 끌어올릴 위대한 발걸음을 내디딜 수 있습니다: 유럽 연합체를 설립하기 위한 조약 회의를 소집하거나, 모든 연합 회원국을 유럽 연방으로 통합하도록 초대하는 것입니다. 이는 이사회 표결이 아닙니다: 각 회원국은 스스로 소집에 응답합니다." # 8880915833385623827
  ztr_eu_vote_for_statement: "찬성 투표" # 8222179271722890050
  ztr_eu_vote_for_statement_desc: "[ROOT.GetCountry.GetName]이(가) 안건을 지지한다고 선언하며 우리 주의 표를 찬성으로 던집니다. 의회 대표단은 정부에 구속되지 않으며, 그 의석은 우리 사회의 [Concept('concept_ztr_eu_europeanism','유럽주의')]에 따라 나뉩니다." # 2189999871997769737
  ztr_eu_vote_against_statement: "반대 투표" # 6170752102309117226
  ztr_eu_vote_against_statement_desc: "[ROOT.GetCountry.GetName]이(가) 안건에 반대한다고 선언하며 우리 주의 표를 반대로 던집니다. 의회 대표단은 정부에 구속되지 않으며, 그 의석은 우리 사회의 [Concept('concept_ztr_eu_europeanism','유럽주의')]에 따라 나뉩니다." # 9551598953867987257
  ztr_eu_vote_session_clear_tt: "현재 진행 중인 유럽 평의회 투표가 없습니다" # 14141534378160733343
  ztr_eu_start_vote_tt: "안건이 #v 유럽 평의회#!에 상정되었습니다: 모든 회원국이 투표하는 #v 6개월#! 간의 투표 세션이 열리며, #v 이중 과반수#! 원칙에 따라 결정됩니다" # 5413060873763693552
  ztr_eu_vote_cooldown_tt: "평의회가 이전 투표에 따른 쿨타임 상태가 아닙니다" # 452194533859815425
  ztr_eu_euro_criteria_default_tt: "채무 불이행 상태가 아님" # 13415975485166121968
  ztr_eu_euro_criteria_peace_tt: "평화 상태임" # 18393149297219706082
  ztr_eu_euro_criteria_stability_tt: "혁명 정부가 아님" # 17841376904692892649
  ztr_eu_euro_criteria_seniority_tt: "최소 #v 5#!년 이상 연합의 회원국이었음" # 7984855693302719433
  ztr_eu_three_signatories_tt: "최소 #v 2#!개 이상의 다른 국가가 유럽 경제 공동체의 회원임" # 4098057220023522252
  ztr_eu_join_chair_relations_tt: "유럽 평의회 의장과 최소 #v 우호적#! 관계 이상임" # 4158967452173651755
  ztr_eu_withdraw_euroscepticism_tt: "우리 국가에서 #v 소부르주아#! 이익집단이 강력하거나, 우리 정치 체제가 더 이상 연합의 성향과 일치하지 않습니다" # 4196474746409348998
  ztr_eu_federation_euro_majority_tt: "과반수의 회원국이 #v 유로화#!를 도입했습니다" # 5622513387973749239
  ztr_eu_federation_principles_tt: "#v $ztr_eu_subject_8_loc$#! 및 #v $ztr_eu_subject_9_loc$#! [Concept('concept_power_bloc_principle','원칙')]이 모두 최고 수준(#v 3#!오름차순)으로 강화되었습니다" # 6766684272178764738
  ztr_eu_single_market_euro_tt: "우리가 #v 유로화#!를 도입했습니다: 단일 시장은 유로존에만 개방되며, 의장국이라도 예외는 없습니다" # 17685848412243453040
  ztr_eu_confed_agriculture_tt: "$ztr_eu_subject_1_loc$이(가) 시행 중입니다" # 6600454366186654248
  ztr_eu_confed_schengen_tt: "$ztr_eu_subject_2_loc$이(가) 시행 중입니다" # 6121250042184596316
  ztr_eu_confed_cohesion_tt: "$ztr_eu_subject_6_loc$이(가) 시행 중입니다" # 8962371731806921601
  ztr_eu_establish_confederation_tt: "#v 유럽 연방 창설 조약#!이 즉시 발효됩니다. 연방의 권력 블록이 우리의 지도력 아래 창설되며, 다른 모든 회원국은 개별적인 소환장을 받습니다. 연방에 가입하여 필요시 #b 유로#!를 채택하거나, 유럽 통합 프로젝트에서 완전히 이탈하십시오." # 9111233805358853424
  ztr_eu_confed_forced_euro_tt: "수렴 기준과 관계없이 연방 조약의 일환으로 #b 유로#!를 채택합니다." # 2374838396420146917
  ztr_eu_your_seats_tt: "우리 대표단은 이제 유럽 의회 #v 360석#! 중 #v [ROOT.GetCountry.MakeScope.Var('ztr_eu_seats').GetValue|0]석#!을 차지합니다." # 2025082118606984736
  ztr_eu_federation_ratify_tt: "초대를 수락하고 [SCOPE.sCountry('eu_federation_partner').GetName]와(과) 단결하여 #v 유럽 연국#!이 됩니다. 플레이어가 조종하는 국가는 플레이어의 통제하에 남으며 연방이 됩니다." # 10401037781057544535
  ztr_eu_federation_refuse_tt: "우리는 독립을 유지합니다. 거부한다고 해서 나중에 #v 유럽 연국#! 가입을 모색하는 것이 막히지는 않습니다." # 7876516092845571077
  ztr_adopt_euro_decision: "유로 채택" # 1717704540255636862
  ztr_adopt_euro_decision_desc: "자국 통화를 #b 유로#!로 대체하면 경제가 대륙에 묶이게 됩니다. 신용은 더 저렴해지고 무역은 원활해지지만, 통화 정책은 영원히 유럽 중앙은행으로 넘어가게 됩니다. 지급 능력, 평화, 안정, 그리고 5년의 회원 자격이라는 수렴 기준을 충족하는 국가만이 단일 통화에 가입할 수 있습니다. 유로를 최초로 채택하는 국가는 유럽 중앙은행을 유치하게 되며, 연방 단계부터 단일 통화는 #b 단일 시장#!의 열쇠이기도 합니다." # 2090632124410181137
  ztr_eu_single_market: "유럽 연합체 회원국" # 6389169082825330582
  ztr_euro_member: "유로존 회원국" # 1696759676381672560
  ztr_ecb_stance_expansive: "유럽중앙은행 확장적 정책" # 16840979580266072038
  ztr_ecb_stance_restrictive: "유럽중앙은행 긴축적 정책" # 7702630455988615497
  ztr_eu_dir_agriculture_mod: "공동농업정책" # 7390019426242109991
  ztr_eu_dir_schengen_mod: "자유이동지역" # 8074862852080566962
  ztr_eu_dir_cohesion_mod_poor: "결속기금 수혜국" # 1791753142174606044
  ztr_eu_dir_cohesion_mod_rich: "결속기금 기여국" # 3944842571955814815
  ztr_european_federation_integration: "연방 통합" # 1935655520128451555
  ztr_euro_changeover: "통화 전환" # 17023686513548331515
