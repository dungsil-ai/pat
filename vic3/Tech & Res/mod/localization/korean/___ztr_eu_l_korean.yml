  ztr_eu_event.10.t: "평의회 소집" # 3872948006852645503
  ztr_eu_event.10.d: "유럽 이사회에서 다음 안건에 대한 투표를 시작했습니다: [ROOT.GetCountry.GetCustom('ztr_eu_vote_action_name')]: #v [ROOT.GetCountry.GetCustom('ztr_eu_vote_subject_name')]#!.\n\n회의는 #v 6개월#! 동안 지속되며, 회원국 과반수와 유럽 의회 360석 중 과반수의 #b 이중 과반수#!로 의결됩니다. 우리 대표단은 지침을 기다리고 있습니다." # 6527768713053946423
  ztr_eu_event.10.f: "안건이 모든 대표단의 책상 위에 오르자, 브뤼셀의 복도에서 외교관들이 속삭입니다." # 3866236694307939086
  ztr_eu_event.10.a: "우리 대표단에 찬성 투표를 지시합니다." # 6145276304290307707
  ztr_eu_event.10.b: "우리 대표단에 반대 투표를 지시합니다." # 4975146496965818429
  ztr_eu_event.10.c: "우선 토론이 전개되는 것을 지켜봅시다." # 13877813352600590293
  ztr_eu_event.11.t: "새로운 유럽 입법부" # 7987231614069902268
  ztr_eu_event.11.d: "유럽 의회의 5년 임기가 끝났습니다. #v 360#!개의 의석이 회원국들의 인구에 따라 재분배되었으며, 어떤 대표단도 #v 6#!석보다는 적지 않습니다." # 14051485105066636777
  ztr_eu_event.11.f: "리스본에서 카르파티아산맥에 이르기까지, 개표가 끝나고 새 의회가 의석을 차지함에 따라 벽에서 포스터들이 떨어져 나갑니다." # 5606721271405977278
  ztr_eu_event.11.a: "유럽에서 우리의 목소리가 반영됩니다." # 16026684090623935361
  ztr_eu_event.20.t: "이사회 안건" # 7547081803195180414
  ztr_eu_event.20.d: "어떤 제안을 #v 유럽 이사회#!에 상정하시겠습니까? 이 발의안은 모든 회원국에 부쳐지며 향후 6개월 동안 #v 이중 과반수#! 원칙에 따라 의결될 것입니다." # 5320978428101892036
  ztr_eu_event.20.a: "[Concept('concept_ztr_eu_dir_agriculture','$ztr_eu_subject_1_loc$')]을(를) 상정합니다." # 10007720327731645537
