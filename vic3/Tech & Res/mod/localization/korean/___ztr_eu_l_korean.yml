  identity_continental_confederation_desc: "단일 시장, 단일 통화, 공통 기관으로 결합된 주권 국가들의 연방 체제입니다. 이 블록은 위임 권한을 누적하지 않으며 초청을 허용하지 않습니다. 연방은 오직 자체 평의회의 투표를 통해서만 심화되며, 어떤 회원국도 유럽 프로젝트를 완전히 떠나지 않고는 탈퇴할 수 없습니다." # 16542479078870892958
