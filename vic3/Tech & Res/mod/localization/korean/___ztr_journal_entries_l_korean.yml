l_korean:
  ztr_un_law_voting_model_4_desc: "Only the #v two UN members with the highest [concept_prestige]#! when the proposal starts are eligible, with #v 1#! vote each; [Concept('concept_superpower','$concept_superpower$')] status is not required. All UN members remain bound by adopted resolutions. With only two voters, one vote for and one against is a tie and fails. Only one of the two UN members with the highest [concept_prestige], or a country in their sphere (their subjects and the members of the power blocs they lead), can propose it. Countries in that sphere tend to back it, while independent countries oppose it."
  ztr_un_can_propose_superpower_reform_tt: "Is one of the two UN members with the highest [concept_prestige], or one of their subjects or a member of a power bloc they lead"
