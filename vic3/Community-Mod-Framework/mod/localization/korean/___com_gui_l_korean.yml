  com_debug.d: "\"빅토리아 3는 정말 형편없는 게임이야. 독창성이라곤 찾아볼 수 없는 시시한 게임이지. 국가 규모가 어떻든 플레이하기가 너무 쉬워. 빅토리아 2 때는 훨씬 나았어. 건물과 인구를 직접 관리하고 다양한 외교를 수행해야 했으니까.\"" # 6217398070270506244
