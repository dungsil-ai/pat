l_korean:
  bpm_japan.1.t: "막부와 투표함" # 812106437582707577
  bpm_japan.1.d: "압도적인 민중의 압력에 굴복하여, [SCOPE.sCharacter('shogun_scope').GetFullNameWithTitle]은(는) [concept_bpm_head_of_government]을(를) 선출할 권한을 가진 선출직 입법부인 #b [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')]#!의 창설을 허가했습니다. [SCOPE.GetRootScope.GetCountry.GetAdjectiveNoFlag] 역사상 최초의 총선에서 투표가 시작됨에 따라, [SCOPE.sCharacter('shogun_scope').GetFullName]은(는) [SCOPE.sCharacter('shogun_scope').GetSheHe]가 겪게 될 [SCOPE.sCharacter('shogun_scope').GetHerHis] 권위 상실을 어떻게 헤쳐 나갈지 결정해야 합니다." # 14454730970545305943
  bpm_japan.1.f: "\"한 가지 예를 들자면, 우리가 정부 관료에게 경의를 표하는 것은 당연한 일이지만, 그것이 그 사람의 지위가 가진 존엄성 때문은 아닙니다. 그가 재능과 덕망을 통해 중요한 역할을 수행하고, 백성을 위해 중대한 법을 다루기 때문에 존경을 받는 것입니다. 존엄한 것은 사람 그 자체가 아니라 법입니다.\"\n\n—후쿠자와 유키치, 1872년" # 15571650474232956291
  bpm_japan.1.a: "평화로운 권력 이양을 지지한다. 도쿠가와 가문도 다른 이들과 마찬가지로 선거 운동을 할 수 있다." # 15462740068595094803
  bpm_japan.1.b: "막부의 붕괴는 용납할 수 없다. 충성스러운 사무라이들은 이 희극을 끝내기 위해 나설 것이다." # 4556640320759851413
  je_bpm_confucian_state: "유교 국가" # 2724370582294429010
  je_bpm_confucian_state_reason: "우리 국가는 [SCOPE.sReligion('conf_religion').GetName]의 철학에 깊이 뿌리내리고 있습니다. 과거제도는 정부의 [concept_bureaucracy]의 근간을 이루며, 문관들은 유교 경전에 대한 통찰력을 시험하는 일련의 엄격한 시험을 통해 선발됩니다. 오직 이 시험에서 뛰어난 자만이 관료제의 계급을 밟을 수 있으며, 이는 국가가 가장 박식하고 덕망 있는 학자들에 의해 이끌리도록 보장합니다.\n\n#lore \"덕으로써 정사를 행하는 자는 북극성과 같으니, 제자리를 지키면 모든 별이 그 주위를 도는 것과 같을 것이다.\"\n—공자, 논어#" # 13538576766527988628
