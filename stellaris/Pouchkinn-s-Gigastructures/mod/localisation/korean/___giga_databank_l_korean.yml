l_korean:
  concept_giga_sr_amb_megaconstruction: "$giga_sr_amb_megaconstruction$" # 10656267218600674638
  concept_giga_sr_amb_megaconstruction_desc: "£giga_sr_amb_megaconstruction£ §H$giga_sr_amb_megaconstruction$§!은 엄청난 수준의 인장 응력을 견딜 수 있는 첨단 소재로, 가장 거대한 우주 구조물 건설에 필수적입니다.\n\n이 소재의 수입이 높을수록 ['concept_megastructures']가 더 빨리 건설될 수 있습니다. 이 소재는 진행 중인 모든 메가스트럭처에 §H분할§!되므로, 여러 메가스트럭처를 동시에 건설하면 전체 건설 속도가 §H느려집니다§!. 따라서 이는 병렬 메가스트럭처 건설 능력에 대한 '소프트' 상한선 역할을 합니다.\n\n또한, 대부분의 메가스트럭처는 이 소재에 대한 §H유지 비용§!을 가지며, 더 큰 구조물일수록 유지 비용이 더 높습니다.\n\n증가시키려면:\n- £building£ ['building:building_giga_megaworkshop_hub'] 또는 £building£ ['building:building_giga_megaworkshop'] 건설\n- 초인장(Supertensile) 매장량이 있는 ['concept_celestial_objects']에 £mining_station£ ['concept_mining_stations'] 건설" # 2827306055790404558
  concept_giga_sr_bulk_matter: "$giga_sr_bulk_matter$" # 6800225078457907568
  concept_giga_sr_bulk_matter_desc: "£giga_sr_bulk_matter£ §H$giga_sr_bulk_matter$§! represents large amounts of low value unrefined material harvested from celestial objects, used as filler in the construction of extremely large ['concept_megastructures']§Vs§! or those aiming to replicate planetary conditions.\n\nIt can be harvested from §HAsteroids§!, §HRocky Planets§! and §HGas Giants§!, at a rate of one §Y1§! £giga_sr_bulk_matter£ §H$giga_sr_bulk_matter$§! per ['concept_planet_size'].\n\nThis resource is required to construct the §HRingworld§!, §HMatrioskha Brain§!, §H$name_alderson$§!, §HBirch World§!, §HQuasi-Stellar Obliterator§!, §HSupermassive E.H.O.F.§! and the §HNicoll-Dyson Beam§!.\n\nIt is also used by the §HLunar Macrofabricator§! and the §HBehemoth Assembly Plant§! to create §HAttack Moons§! and §HBehemoth Planetcrafts§!, respectively.\n\nIf the megastructure §Hremoves planets§! as part of its construction, then the £giga_sr_bulk_matter£ §H$giga_sr_bulk_matter$§! contents of the system's planets will be §Hdiscounted§! from the initial build phase. Leftovers will be stored in a §HBulk Matter Cache§! above the system's star which can then be harvested to retrieve its contents.\n\nFor example, if a system contains §Y75§! £giga_sr_bulk_matter£ then a §HRingworld Frame§! which normally requires §Y100§! £giga_sr_bulk_matter£ will only requires §Y25§! £giga_sr_bulk_matter£. However, if the system contains §Y150§! £giga_sr_bulk_matter£, then the megastructure's initial phase will cost no £giga_sr_bulk_matter£ and the §HCache§! will contain §Y50§! £giga_sr_bulk_matter£ to harvest. Subsequent build phases are not affected by this mechanic and will require stored £giga_sr_bulk_matter£.\n\nTo increase:\n- Use the §H$decision_harvest_matter_for_planetary_printing$§! ['concept_decision'] on a non-star ['concept_celestial_object'] to construct a §H$moon_printer_orbital_mass_harvester_1$§! and dismantle the planet, yielding §Y1§! £giga_sr_bulk_matter£ §H$giga_sr_bulk_matter$§! every §Y6§! months. This cannot be stopped and will eventually completely §Rremove§! the planet.\n- Select the decision on a system's ['concept_star'] to begin this process on every planet in the ['concept_system']."
  concept_giga_sr_iodizium: "$giga_sr_iodizium$" # 4298955922627907122
  concept_giga_sr_iodizium_desc: "£giga_sr_iodizium£ §H$giga_sr_iodizium$§!은 §H$name_fusion_suppressor$§! 초신성이 방출한 막대한 양의 이질적 입자가 상대론적 속도로 행성에 충돌할 때 생성되는 기이한 결정입니다. 이 결정은 여러 흥미로운 방식으로 물리학 법칙을 거스르는 듯 보입니다.\n\n이 자원은 ['concept_giga_sr_iodizium_buildings']을 건설하는 데 사용됩니다.\n\n획득 방법:\n- ['concept_star']에 §H$name_fusion_suppressor$§! 거대 구조물을 건설하고 선택지가 나타나면 §Y$fusion_suppressor_6b$§!를 선택하십시오. 이 과정에서 성계 내의 모든 것이 §R심각하게 손상§!될 수 있으니 신중하게 배치하십시오!" # 10723477479204931130
  concept_giga_sr_iodizium_buildings: "아이오디지움 건물" # 1468184120640559425
  concept_giga_sr_iodizium_buildings_desc: "['concept_giga_sr_iodizium']은 우리의 과학 및 에너지 생산을 증대할 유용한 건물을 다수 건설하는 데 사용할 수 있습니다.\n이 건물들은 다음을 포함합니다:\n- $concept_building_giga_iodizium_plant$\n- $concept_building_giga_iodizium_research$" # 12778744168052400415
  concept_building_giga_iodizium_plant: "['building:building_giga_iodizium_plant', $building_giga_iodizium_plant$]" # 5328188089507199620
  concept_building_giga_iodizium_research: "['building:building_giga_iodizium_research', $building_giga_iodizium_research$]" # 12147351883150570024
