  giga_nomad_dialog.050.name: "$giga_nomad_war_planet$ 건설 현장 완공" # 6436781724510784289
  giga_nomad_dialog.050.desc: "미래의 $giga_nomad_war_planet$(으)로 향할 건설 현장이 완공되었습니다. 이 심우도 건설 현장은 $giga_nomad_war_planet$ 본체의 건조를 개시하기 위한 전진 기지 역할을 수행하게 될 것입니다.\n\n§INOTE: 함선 설계창에서 $giga_nomad_war_planet$ 설계를 잊지 마십시오!§!" # 2877988155350934864
  giga_nomad_dialog.050.a: "놀랍군요." # 11372186741735424273
  giga_nomad_dialog.052.name: "$giga_nomad_war_planet$ 선체 건조 완료" # 5421576726001852026
  giga_nomad_dialog.052.desc: "$giga_nomad_war_planet$의 선체가 이제 완성되었습니다! 함선의 미래 추진기와 주포에 전력을 공급할 수 있는 거대한 행성 규모의 원자로를 포함한 모든 일반 시스템이 설치되었습니다." # 5899510462706357236
  giga_nomad_dialog.052.a: "목표에 한 걸음 더 다가갔습니다." # 1585297630895708376
  giga_nomad_dialog.053.name: "$giga_nomad_war_planet$ 방어 체계 완료" # 10168685999175437323
  giga_nomad_dialog.053.desc: "우리의 $giga_nomad_war_planet$ 방어 체계가 완성되었습니다. 수 킬로미터 두께의 강철이 행성급 강화 보호막 뒤에 자리 잡고 있으며, 이 모든 것은 거대한 골조와 그에 걸맞게 과설계된 초광속(FTL) 드라이브 위에 탑재되어 있습니다. 마지막 단계는 무기 체계를 설치하는 것입니다." # 5989456327909100135
  giga_nomad_dialog.053.a: "거의 다 왔습니다." # 4040116817873436816
  giga_nomad_dialog.054.name: "심판의 전차가 도래했다" # 4985146379624329556
  giga_nomad_dialog.054.desc: "우리가 해냈습니다. $giga_nomad_war_planet$ 주포 배열이 완성됨에 따라, 이 거대한 우주선이 이제 운용 준비를 마쳤습니다. 길이가 1만 킬로미터를 넘는 이 진정으로 거대한 구조물은 $giga_nomad_war_moon$의 논리적 진화형입니다. 함선이 엔진을 가동했으며, 이제 우리 함대에 합류할 준비가 되었습니다." # 14181436744263060146
  giga_nomad_dialog.054.a: "진으로 놀라운 업적입니다." # 679024418553916007
  MESSAGE_NOMAD_WAR_PLANET_DESTROYED: "$giga_nomad_war_planet$ 파괴됨" # 13414512773412535717
  MESSAGE_NOMAD_WAR_PLANET_DESTROYED_DESC: "$SYSTEM_NAME|Y$ 성계에서 $ENEMY_NAME|Y$에 의해 $NOMAD_CELESTIAL_WARSHIP_NAME|Y$ $giga_nomad_war_planet$이(가) 파괴되었습니다.\n\n이 거함은 움직이지 못하는 잔해로 전락했으며, 필요한 자원을 확보하고 성계 소유자와 우호적인 관계라면(소유자가 존재할 경우) 수리할 수 있습니다." # 8133632775358861089
  giga_nomad_dialog.060.name: "$giga_nomad_war_planet$ 해체됨" # 1198286614390845409
  giga_nomad_dialog.060.desc: "[giga_debris_system.GetName]계에서 발견한 미완성의 $giga_nomad_war_planet$을(를) 해체했습니다." # 9880677259991994733
  giga_nomad_dialog.060.a: "좋습니다." # 843958112380023394
  giga_nomad_dialog.063.name: "잔해 상태의 $giga_nomad_war_planet$ 해체됨" # 13358996922342971153
  giga_nomad_dialog.063.desc: "우리의 수색 팀이 [giga_debris_system.GetName] 성계에서 발견된 파괴된 $giga_nomad_war_planet$의 해체를 완료했습니다. $giga_nomad_war_planet$의 거대한 무기 체계와 이동 시스템을 해체한 덕분에 상당량의 합금과 공학 연구 데이터를 확보할 수 있었습니다." # 13522997341183430040
  giga_nomad_dialog.063.a: "좋습니다." # 843958112380023394
  giga_nomad_actions.551.name: "$giga_nomad_war_planet$ 수리 완료!" # 8042895993759180247
  giga_nomad_actions.551.desc: "멋진 소식입니다! §Y[from.GetName]§! 성계에 있는 폐허가 된 $giga_nomad_war_planet$을 복구하는 데 성공했습니다. 상당한 작업이 소요되었으며 내부 구조의 대부분을 완전히 처음부터 다시 구축해야 했지만, 이제 이 거대한 전함이 다시 가동될 준비를 마쳤습니다." # 6088027355769395722
  giga_nomad_actions.551.a: "훌륭합니다." # 13357587260733090656
