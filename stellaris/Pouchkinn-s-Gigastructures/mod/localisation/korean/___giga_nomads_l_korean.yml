  giga_arkship_harvest_neutronium_progress_activity_key: "중성자 물질 채굴 중 (§Y$PROGRESS$%§!)" # 13303117719203446836
  giga_arkship_harvest_neutronium_required_progress_key: "£time£ $@arkship_reprocess_planet_required_progress|0$ §W일§!" # 15449432806828943416
  giga_arkship_neutronium_deposit: "채굴된 중성자 물질 매장지" # 10536861820927318253
  giga_arkship_neutronium_deposit_desc: "죽어가는 별의 표면에서 직접 끌어올려 우리의 최고 [Owner.GetAlloyProducerPlural]가 가공할 중성자 물질의 거대한 매장지입니다.\n\n§E가공 완료까지 남은 개월 수:§! §Y[planet.GetMonthsUntilNeutroniumDepositHarvested]§!" # 16141270069911370208
  giga_arkship_neutronium_harvested: "채굴 가능한 중성자 물질 매장지 고갈" # 15402196427564578188
  giga_arkship_neutronium_harvested_desc: "쉽게 도달할 수 있는 모든 중성자 물질원을 수집했습니다. 새로운 매장지를 발견하고 채굴 기반 시설을 구축하는 데 시간이 걸릴 것입니다." # 442309513182601752
  giga_harvested_neutronium_tt: "§R모든 $giga_arkship_harvest_neutronium$ 행동을 차단함§!" # 5614079452176197620
  GIGA_NOMAD_NEUTRONIUM_HARVEST_READY_TITLE: "$sm_giga_arkship_neutronium_harvester$ 사용 준비 완료" # 14271914904238137054
  GIGA_NOMAD_NEUTRONIUM_HARVEST_READY_DESC: "$giga_arkship_harvest_neutronium$의 재사용 대기시간이 종료되어 사용할 준비가 되었습니다." # 2862116790711682875
