  giga_nomad_war_planet_disband_title: "이 $giga_nomad_war_planet$을(를) 해산합니다." # 4513509361756525799
  giga_nomad_war_planet_disband_button: "영웅 함선은 해산할 수 없으므로, 이를 통해 자신의 $giga_nomad_war_planet$을(를) 파괴할 수 있습니다.\n\n§R당연히 함선이 파괴됩니다§!" # 5525719055586507138
