  allow_nomad_war_moon: "§H거대건축물 해제:§! $giga_nomad_war_moon$" # 8692459128535915936
  desc_nomad_war_moon: "저 거대한 \"천체\"들에 대항하기 위해, 우리는 과감한 화력 투사로 그들을 무릎 꿇릴 프로토타입 전함 설계안을 고안해 냈습니다. 이로 인해 내구성이 다소 취약해졌지만, 적절한 호위가 동반되는 한 그러한 약점은 문제가 되지 않을 것입니다." # 12132304394214650357
  giga_nomad_war_moon_section_alpha: "척추형 메가웨폰" # 5494968168907189010
  giga_nomad_war_moon_section_beta: "보조 포대" # 1020360079697151841
  giga_nomad_war_moon_section_charlie: "호위 격납고" # 12221769988988709636
  giga_nomad_war_moon_section_delta: "대응사격 포대" # 1328703736149155943
  giga_tech_nomad_war_moon_pre: "$giga_tech_war_moon_1$" # 14001238290878014948
  giga_tech_nomad_war_moon_pre_desc: "$giga_tech_war_moon_1_desc$" # 7304702351438353567
  giga_tech_nomad_war_moon: "반천체 프로토타입" # 4538546003966524485
  giga_tech_nomad_war_moon_desc: "$_giga_war_moon_plural$의 위협에 대항하기 위해 급조된 프로토타입 설계입니다. 내구성은 떨어지지만, 그들을 격파하기에 특화된 무기를 탑재하고 있습니다." # 11066365435705402436
  GIGA_NOMAD_WAR_MOON_ANTI_CELESTIAL: "정화 창" # 5255225506499505363
  GIGA_NOMAD_WAR_MOON_ANTI_CELESTIAL_DESC: "행성 지각과 그를 보호하는 모든 것을 부수기 위해 특별히 제작된 무기입니다." # 9357533697740993130
  GIGA_NOMAD_WAR_MOON_COMPUTER: "$giga_nomad_war_moon$ 전투 컴퓨터" # 17189526961477745676
  GIGA_NOMAD_WAR_MOON_COMPUTER_DESC: "$giga_nomad_war_moon$은(는) 아주 먼 거리(§Y3250§!)를 유지하며 가 가능한 목표물에 무기 배열을 발사합니다." # 5116409773787352133
  REACTOR_NOMAD_WAR_MOON: "시제품 중형 원자로" # 4535095083656226608
  REACTOR_NOMAD_WAR_MOON_DESC: "$giga_nomad_war_moon$과(와) 그 특수 시스템에 전력을 공급하기 위해 특별히 제작 및 조율된 특수 원자로입니다." # 15221417340569277336
  nomad_war_moon_0: "$giga_nomad_war_moon$ 건조 현장" # 15591795078685586990
  nomad_war_moon_0_DESC: "천체 함선에 대항하기 위해 만들어진 군함인 미래의 $giga_nomad_war_moon$을(를) 위한 건조 현장입니다." # 8860038277628697296
  nomad_war_moon_0_MEGASTRUCTURE_DETAILS: "$giga_list_category_megastructure$ - $giga_list_category_nomad_warship$ - $giga_list_category_ship_production$\n천체와 싸우기 위해 특별히 제작된 군함으로, 거대한 목표물에게 더 큰 피해를 줍니다.\n§L$giga_nomad_war_moon_cap$은(는) 시제품 무기 시스템으로, 이 정도 크기의 함선에서 보통 볼 수 있는 방어력을 일부 희생하여 거대한 주무기를 탑재했습니다." # 9402706442802410733
  nomad_war_moon_1: "$giga_nomad_war_moon$ 선체" # 9208814345307689323
  nomad_war_moon_1_DESC: "$giga_nomad_war_moon$의 건조가 거의 완료되었습니다. 주무기 시스템과 직결된 기반 시설만 남았습니다." # 10736254025930937977
  nomad_war_moon_2: "$giga_nomad_war_moon$" # 6285906506283808633
  nomad_war_moon_2_DESC: "$giga_nomad_war_moon$ 건조가 완료되어 별을 향해 출항할 준비가 되었습니다." # 13523415310931724500
  nomad_war_moon_debris: "잔해 상태의 $giga_nomad_war_moon$" # 1261443537676731396
  nomad_war_moon_debris_DESC: "강화된 장갑 선체 덕분에 온전한 형태로 남아 있는, 고도로 발달된 문명이 건조한 거대 군함의 잔해입니다. 놀라울 정도로 온전한 거대 주무기를 중심으로 건조되었으며, 충분한 자원과 기술만 있다면 이 끔찍한 함선을 과거의 영광으로 되돌릴 수 있을지도 모릅니다." # 16671754200979445785
  nomad_war_moon_debris_MEGASTRUCTURE_DETAILS: "$nomad_war_moon_0_MEGASTRUCTURE_DETAILS$" # 14474718270468454147
  nomad_war_moon_restored: "$giga_nomad_war_moon$" # 6285906506283808633
  nomad_war_moon_restored_DESC: "$nomad_war_moon_2_DESC$" # 14807443252740170066
  nomad_war_moon_restored_MEGASTRUCTURE_DETAILS: "$war_moon_0_MEGASTRUCTURE_DETAILS$" # 8074461722287649107
  giga_nomad_dialog.000.name: "$giga_nomad_war_moon$ 건조 현장 완공" # 7630038354061541381
  giga_nomad_dialog.000.desc: "미래의 $giga_nomad_war_moon$을(를) 위한 건조 현장이 완공되었습니다. 이 심우주 건조 현장은 $giga_nomad_war_moon$ 자체의 건조를 시작하기 위한 전초기지 역할을 할 것입니다.\n\n§I참고: 함선 설계소에서 $giga_nomad_war_moon$을(를) 설계하는 것을 잊지 마십시오!§!" # 10279181360834030959
  giga_nomad_dialog.000.a: "놀랍군요." # 11372186741735424273
  giga_nomad_dialog.002.name: "$giga_nomad_war_moon$ 선체 건조 완료" # 1995607243706489720
  giga_nomad_dialog.002.desc: "$giga_nomad_war_moon$의 선체가 이제 완성되었습니다! 핵심 무기 체계와 원자로를 제외한 모든 부품의 설치와 테스트가 끝났습니다." # 4843774862291222080
  giga_nomad_dialog.002.a: "목표에 한 걸음 더 다가갔습니다." # 1585297630895708376
  giga_nomad_dialog.004.name: "달의 머리에 겨눈 총구" # 5249132927488363370
  giga_nomad_dialog.004.desc: "해냈습니다. $giga_nomad_war_moon$의 주무기가 작동함에 따라, 이 거대한 우주선이 이제 가동을 시작했습니다. $giga_war_moon_plural$에 대항하기 위한 시제품으로서, 이 데이터는 더욱 강력한 대항책을 만드는 데 귀중한 자산이 될 것입니다. 우주선이 엔진을 가동했으며, 이제 우리 함대에 합류할 준비가 되었습니다." # 956158248801270721
  giga_nomad_dialog.004.a: "진으로 놀라운 업적입니다." # 679024418553916007
  MESSAGE_NOMAD_WAR_MOON_DESTROYED: "$giga_nomad_war_moon$ 파괴됨" # 6257379041992045567
  MESSAGE_NOMAD_WAR_MOON_DESTROYED_DESC: "$SYSTEM_NAME|Y$ 성계에서 $NOMAD_CELESTIAL_WARSHIP_NAME|Y$ $giga_nomad_war_moon$이(가) $ENEMY_NAME|Y$에 의해 파괴되었습니다.\n\n이 거함은 움직일 수 없는 잔해가 되었으며, 필요한 자원을 보유하고 있고 성계 소유자와 우호적인 관계라면(소유자가 존재하는 경우) 수리할 수 있습니다." # 8472169219669474524
  giga_nomad_dialog.010.name: "$giga_nomad_war_moon$ 해체됨" # 11909636752321104996
  giga_nomad_dialog.010.desc: "[giga_debris_system.GetName] 성계에서 발견된 미완성의 $giga_nomad_war_moon$을(를) 해체했습니다." # 12765789450476929153
  giga_nomad_dialog.010.a: "좋습니다." # 843958112380023394
  giga_nomad_dialog.012.name: "파괴된 $giga_nomad_war_moon$ 해체 완료" # 11780954951892540415
  giga_nomad_dialog.012.desc: "우리 해체 팀이 [giga_debris_system.GetName] 성계 내에서 발견된 폐허가 된 $giga_nomad_war_moon$의 해체를 완료했습니다. $giga_nomad_war_planet$의 거대한 무기 배열과 이동 시스템을 해체한 결과, 상당한 양의 합금과 공학 연구를 얻었습니다." # 5248908449589851855
  giga_nomad_dialog.012.a: "좋습니다." # 843958112380023394
  giga_nomad_actions.501.name: "$giga_nomad_war_moon$ 수리 완료!" # 4668746171595950064
  giga_nomad_actions.501.desc: "멋진 소식입니다! §Y[from.GetName]§! 성계에 있던 폐허가 된 $giga_nomad_war_moon$을(를) 성공적으로 복구했습니다. 상당한 노력이 필요했으며 내부 부품 대부분을 처음부터 다시 만들어야 했지만, 이 강력한 전함이 이제 다시 가동을 시작했습니다." # 2012515883071079736
  giga_nomad_actions.501.a: "훌륭합니다." # 13357587260733090656
  giga_nomad_war_planet: "초중량 공성함" # 11194893096946116280
  giga_nomad_war_planet_plural: "초중량 공성함" # 11194893096946116280
  giga_nomad_war_planet_cap: "$giga_nomad_war_planet$" # 1296072002870940554
  allow_nomad_war_planet: "§H거대 건축물 해제:§! $giga_nomad_war_planet$" # 4897749441233010224
  desc_nomad_war_planet: "천체들과의 전투에 최적화된 초대형 전함입니다. 행성 단위의 합금으로 제작되었으며, §R무엇이든§! 말살할 수 있는 무기를 장착하고 있습니다." # 15734341211451318322
  giga_nomad_war_planet_section_alpha: "천체 말살자" # 2630713550345766557
  giga_nomad_war_planet_section_beta: "강화형 주력 무기" # 15059709971615781627
  giga_nomad_war_planet_section_charlie: "강화형 주력 무기" # 15059709971615781627
  giga_nomad_war_planet_section_delta: "대형 함재기 격납고" # 10491333560499635352
  giga_nomad_war_planet_section_echo: "보조 포대" # 1020360079697151841
  giga_tech_nomad_war_planet: "초행성급 대항 교리" # 9623494699072057985
  giga_tech_nomad_war_planet_desc: "$giga_nomad_war_moon$ 정도면 무장한 천체들을 상대하기에 충분할 것이라 여겨졌습니다. 군비 경쟁은 언제나 계속될 것이며, 우리는 더 크고 훌륭한 것을 생각해야 합니다. 여러 가지 초고도 기술을 결합하면 엄청난 크기의 전함을 건조할 수 있을 것입니다. 이처럼 엄청나게 거대한 우주선은 거의 파괴 불가능할 것이며, 단독으로 몰락한 제국 전체를 쓸어버릴 수 있을 것입니다." # 2736738865375431441
  GIGA_SUPER_OMEGA_LANCE_1_NOMAD: "오르무즈드 중형 숙청 랜스" # 9543895330238795475
  GIGA_SUPER_OMEGA_LANCE_1_NOMAD_DESC: "주 반응로에서 도시 규모의 도관으로 직접 에너지를 공급받는 거대한 범용 주력 무기입니다." # 7743249459498393360
  GIGA_PLANETARY_RAILGUN_NOMAD: "아제크 프로토타입 천체 관통기" # 14243285862766347838
  GIGA_PLANETARY_RAILGUN_NOMAD_DESC: "특수 합금부터 평범한 지표면까지 가장 강력한 방어선을 뚫어버릴 수 있도록 특수 설계된 수천 배 규모의 거대 레일건입니다." # 14893366689416628675
  GIGA_PLANET_MISSILE_1_NOMAD: "대형 미사일 배터리" # 8510236620829731592
  GIGA_PLANET_MISSILE_1_NOMAD_DESC: "거대한 장갑 격납고 내부에 숨겨진 막대한 파괴력을 지닌 대규모 미사일 배터리입니다." # 7695213039483319663
  GIGA_NOMAD_WAR_PLANET_COMPUTER: "$giga_nomad_war_planet$ 전투 컴퓨터" # 12535850850337692245
  GIGA_NOMAD_WAR_PLANET_COMPUTER_DESC: "$giga_nomad_war_planet$은(는) 아주 먼 거리(§Y300§!)를 유지하며 가용한 목표물들을 향해 무기 일제 사격을 가합니다." # 4153130629422025498
  REACTOR_NOMAD_WAR_PLANET: "초중량 반응로" # 13549482890993428921
  REACTOR_NOMAD_WAR_PLANET_DESC: "$giga_nomad_war_planet$에 에너지를 공급하기 위해 소행성만 한 크기의 반응로에서 막대한 전력을 탐욕스럽게 끌어옵니다." # 1024921334058809888
  nomad_war_planet_0: "$giga_nomad_war_planet$ 건설 현장" # 14149805161076212443
  nomad_war_planet_0_DESC: "천체들과 대등하게 맞서 싸우기 위해 건조되는 거대한 전함인 미래의 $giga_nomad_war_planet$ 건조 현장입니다." # 13745898067872370358
  nomad_war_planet_0_MEGASTRUCTURE_DETAILS: "$giga_list_category_gigastructure$ - $giga_list_category_nomad_warship$ - $giga_list_category_ship_production$\n천체들에 맞서 싸우기 위해 그들의 방식을 그대로 본떠 건조된 거대한 전함입니다.\n§L$giga_nomad_war_planet_cap$은 $giga_nomad_war_moon$의 온전한 완성형 시제품으로, 방어적 약점을 보완하는 동시에 이미 경이로운 수준이었던 살상력을 더욱 끌어올렸습니다.#!" # 14468645321093555745
  nomad_war_planet_1: "$giga_nomad_war_planet$ 선체" # 8451203033348089552
  nomad_war_planet_1_DESC: "$giga_nomad_war_planet$의 내부 시스템이 방대한 선체에 설치되었습니다. 장갑 성채 내부에는 가장 강력한 무기에 전력을 공급할 수 있는 거대하고도 거대한 원자로가 설치되어 있습니다." # 3642773621964965754
  nomad_war_planet_2: "$giga_nomad_war_planet$ 방어 배열" # 285258570960580521
  nomad_war_planet_2_DESC: "설치된 방어 체계 덕분에, 이 거대한 군함은 행성마저 두 갈래로 쪼갤 만한 피해를 흡수할 수 있습니다." # 13066388355370662216
  nomad_war_planet_3: "$giga_nomad_war_planet$" # 1296072002870940554
  nomad_war_planet_3_DESC: "성간 항해를 시작할 준비가 완료된, 건설된 $giga_nomad_war_planet$." # 8648626757112909462
  nomad_war_planet_debris: "파괴된 $giga_nomad_war_planet$" # 16628343736943928907
  nomad_war_planet_debris_DESC: "압도적인 장갑 선체 덕분에 대부분 형태가 온전하게 보존된, 고도 문명이 건조한 거대 전함의 잔해입니다. 한때 은하계에서 손꼽히는 대형 무장들을 탑재했던 배로, 심각한 손상을 입긴 했으나 충분한 자원과 관련 기술이 뒷받침된다면 이 공포스러운 함선을 예전의 영광으로 되돌리는 것도 불가능하지 않을 것입니다." # 4249620680366822014
  nomad_war_planet_debris_MEGASTRUCTURE_DETAILS: "$nomad_war_planet_0_MEGASTRUCTURE_DETAILS$" # 7308942671353540764
  nomad_war_planet_restored: "$nomad_war_planet_3$" # 14536025902342441064
