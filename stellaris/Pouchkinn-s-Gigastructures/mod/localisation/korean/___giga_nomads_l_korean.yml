l_korean:
  giga_nomad_claim_unowned_nomad_compat_megas: "Claim Unowned Nomad Compatible Megastructures"
  giga_nomad_claim_unowned_nomad_compat_megas_desc: "If this system contains unowned megastructures which nomads are capable of using, this decision lets us assert our rightful claims."
  giga_nomad_claim_unowned_nomad_compat_megas_effect: "This will transfer all §Ynomad compatible megastructures§! within this system to our direct control."
  giga_nomad_claim_unowned_nomad_compat_megas_fail1: "$TRIGGER_FAIL$System must be unclaimed."
  giga_nomad_claim_unowned_nomad_compat_megas_fail2: "$TRIGGER_FAIL$No unowned megastructures that are nomad compatible in this system."
  giga_list_category_nomad_warship: "§MNOMAD WARSHIP§!"
  giga_nomad_war_moon: "Heavy Artillery Platform"
  giga_nomad_war_moon_plural: "Heavy Artillery Platforms"
  giga_nomad_war_moon_cap: "$giga_nomad_war_moon$"
  allow_nomad_war_moon: "§HUnlocks Megastructure:§! $giga_nomad_war_moon$"
  desc_nomad_war_moon: "In order to counter these \"celestials\", we have devised a prototype warship made to lay them low through the application of judicious amounts of firepower. This does leave it a little more fragile than would be appreciated, but so long as it is properly escorted, that vulnerability will not be relevant."
  giga_nomad_war_moon_section_alpha: "Spinal Megaweapon"
  giga_nomad_war_moon_section_beta: "Secondary Batteries"
  giga_nomad_war_moon_section_charlie: "Escort Hangars"
  giga_nomad_war_moon_section_delta: "Counterfire Batteries"
  giga_tech_nomad_war_moon_pre: "$giga_tech_war_moon_1$"
  giga_tech_nomad_war_moon_pre_desc: "$giga_tech_war_moon_1_desc$"
  giga_tech_nomad_war_moon: "Anti-Celestial Prototype"
  giga_tech_nomad_war_moon_desc: "A prototype design, rushed to counter the threat of $giga_war_moon_plural$. Less durable, but with a weapon specialized to defeat them."
  GIGA_NOMAD_WAR_MOON_ANTI_CELESTIAL: "Purgation Lance"
  GIGA_NOMAD_WAR_MOON_ANTI_CELESTIAL_DESC: "A weapon specifically created to crack open planetary crust, and anything protecting it."
  GIGA_NOMAD_WAR_MOON_COMPUTER: "$giga_nomad_war_moon$ Combat Computer"
  GIGA_NOMAD_WAR_MOON_COMPUTER_DESC: "The $giga_nomad_war_moon$ will stay at very long range (§Y3250§!) range and fire its array of weapons at available targets."
  REACTOR_NOMAD_WAR_MOON: "Prototype Heavy Reactor"
  REACTOR_NOMAD_WAR_MOON_DESC: "A special reactor, specifically created and tuned to power the $giga_nomad_war_moon$ and its specialized systems."
  nomad_war_moon_0: "$giga_nomad_war_moon$ Construction Site"
  nomad_war_moon_0_DESC: "The construction site for a future $giga_nomad_war_moon$, a warship made to counter celestial craft."
  nomad_war_moon_0_MEGASTRUCTURE_DETAILS: "$giga_list_category_megastructure$ - $giga_list_category_nomad_warship$ - $giga_list_category_ship_production$\nA warship specially created to fight celestials, doing more damage to large targets.\n§LThe $giga_nomad_war_moon_cap$ is a prototype weapons system, sacrificing some of the defensive power usually seen on a craft of this size for a massive primary weapon."
  nomad_war_moon_1: "$giga_nomad_war_moon$ Hull"
  nomad_war_moon_1_DESC: "The $giga_nomad_war_moon$ has almost been completed. Only the main weapon system and directly connected infrastructure remains."
  nomad_war_moon_2: "$giga_nomad_war_moon$"
  nomad_war_moon_2_DESC: "A completed $giga_nomad_war_moon$, ready to take to the stars."
  nomad_war_moon_debris: "Wrecked $giga_nomad_war_moon$"
  nomad_war_moon_debris_DESC: "The remnants of a massive warship built by an advanced civilization, which has remained largely intact due to its reinforced armored hull. Built around a massive primary weapon that is remarkably intact, it might be possible to restore this fearsome craft to its former glory, provided we have plenty of resources and the technology to do so."
  nomad_war_moon_debris_MEGASTRUCTURE_DETAILS: "$nomad_war_moon_0_MEGASTRUCTURE_DETAILS$"
  nomad_war_moon_restored: "$giga_nomad_war_moon$"
  nomad_war_moon_restored_DESC: "$nomad_war_moon_2_DESC$"
  nomad_war_moon_restored_MEGASTRUCTURE_DETAILS: "$war_moon_0_MEGASTRUCTURE_DETAILS$"
  giga_nomad_dialog.000.name: "$giga_nomad_war_moon$ Construction Site Built"
  giga_nomad_dialog.000.desc: "The Construction Site for a future $giga_nomad_war_moon$ is now complete. This deep-space construction site will serve as a staging depot in order to begin constructing the $giga_nomad_war_moon$ itself.\n\n§INOTE: Don't forget to design the $giga_nomad_war_moon$ in the ship designer!§!"
  giga_nomad_dialog.000.a: "Marvelous."
  giga_nomad_dialog.002.name: "$giga_nomad_war_moon$ Hull Complete"
  giga_nomad_dialog.002.desc: "The hull of the $giga_nomad_war_moon$ is now complete! Everything except the core weapons systems and reactor has been installed and tested."
  giga_nomad_dialog.002.a: "One step closer."
  giga_nomad_dialog.004.name: "A Gun Pointed At the Head of The Moon"
  giga_nomad_dialog.004.desc: "We have done it. With the $giga_nomad_war_moon$ main weapon operational, this monstrous spaceship is now operational. A prototype to counter $giga_war_moon_plural$, the data will be invaluable in creating more potent countermeasures. The ship has engaged its engines, and is now ready to join our fleets."
  giga_nomad_dialog.004.a: "Truly a marvelous accomplishment."
  MESSAGE_NOMAD_WAR_MOON_DESTROYED: "$giga_nomad_war_moon$ Destroyed"
  MESSAGE_NOMAD_WAR_MOON_DESTROYED_DESC: "The $NOMAD_CELESTIAL_WARSHIP_NAME|Y$ $giga_nomad_war_moon$ has been destroyed by the $ENEMY_NAME|Y$ in the $SYSTEM_NAME|Y$ system.\n\nIt has been reduced to an immobile wreck which may be repaired if we have the necessary resources and are friendly with the system owner, if they exist."
  giga_nomad_dialog.010.name: "$giga_nomad_war_moon$ Dismantled"
  giga_nomad_dialog.010.desc: "We have dismantled the incomplete $giga_nomad_war_moon$ found within the [giga_debris_system.GetName] system."
  giga_nomad_dialog.010.a: "Good."
  giga_nomad_dialog.012.name: "$Wrecked $giga_nomad_war_moon$ Scrapped"
  giga_nomad_dialog.012.desc: "Our scavenging teams have now completed the dismantlement of the ruined $giga_nomad_war_moon$ found within the [giga_debris_system.GetName] system. The dismantlement of the $giga_nomad_war_planet$'s colossal weapons array and movement systems has netted us significant amounts of alloys and engineering research."
  giga_nomad_dialog.012.a: "Good."
  giga_nomad_actions.501.name: "$giga_nomad_war_moon$ Repaired!"
  giga_nomad_actions.501.desc: "Wonderful news! We have managed to restore the ruined $giga_nomad_war_moon$ in the §Y[from.GetName]§! system. It has taken quite a lot of work, and most of its internals had to be completely rebuilt from scratch, but this mighty warship is now operational once more."
  giga_nomad_actions.501.a: "Wonderful."
  giga_nomad_war_planet: "Super-Heavy Siegecraft"
  giga_nomad_war_planet_plural: "Super-Heavy Siegecraft"
  giga_nomad_war_planet_cap: "$giga_nomad_war_planet$"
  allow_nomad_war_planet: "§HUnlocks Megastructure:§! $giga_nomad_war_planet$"
  desc_nomad_war_planet: "A supermassive warship optimized for combat against celestials. Made of planetary amounts of alloys, and equipped with a weapon that can obliterate §Ranything.§!"
  giga_nomad_war_planet_section_alpha: "Celestial Decimator"
  giga_nomad_war_planet_section_beta: "Reinforced Primary Weapons"
  giga_nomad_war_planet_section_charlie: "Reinforced Primary Weapons"
  giga_nomad_war_planet_section_delta: "Macro-Fabricator Hangars"
  giga_nomad_war_planet_section_echo: "Secondary Batteries"
  giga_tech_nomad_war_planet: "Super-Planetary Counter Doctrine"
  giga_tech_nomad_war_planet_desc: "The $giga_nomad_war_moon$ was thought to be enough to counter the weaponized celestials. The arms race will always continue, and we must think bigger and better. Combining several incredibly advanced technologies, will allow us to create a warship of immense size. Such an incredibly massive spaceship would be near-indestructible, and could wipe out entire Fallen Empires by itself."
  GIGA_SUPER_OMEGA_LANCE_1_NOMAD: "Ohrmuzd Heavy Purgation Lance"
  GIGA_SUPER_OMEGA_LANCE_1_NOMAD_DESC: "A massive energy lance directly fed with city wide conduits from the main reactor, made to serve as a massive general purpose weapon."
  GIGA_PLANETARY_RAILGUN_NOMAD: "Ahzek Prototype Celestial Penetrator"
  GIGA_PLANETARY_RAILGUN_NOMAD_DESC: "A massive railgun that has been scaled up thousandfold, specially formulated to crack through the strongest defense, whether specialized alloys or mundane crust."
  GIGA_PLANET_MISSILE_1_NOMAD: "Macro Missile Batteries"
  GIGA_PLANET_MISSILE_1_NOMAD_DESC: "Massive rows of missile batteries, hidden within large armored silos, capable of massive destruction."
  GIGA_NOMAD_WAR_PLANET_COMPUTER: "$giga_nomad_war_planet$ Combat Computer"
  GIGA_NOMAD_WAR_PLANET_COMPUTER_DESC: "The $giga_nomad_war_planet$ will stay at very long range (§Y300§!) range and fire its array of weapons at available targets."
  REACTOR_NOMAD_WAR_PLANET: "Superheavy Reactor"
  REACTOR_NOMAD_WAR_PLANET_DESC: "A minor planetoid sized reactor, greedily drawn from to feed the $giga_nomad_war_planet$."
  nomad_war_planet_0: "$giga_nomad_war_planet$ Construction Site"
  nomad_war_planet_0_DESC: "The construction site for a future $giga_nomad_war_planet$, a massive warship made to fight celestials on their own terms."
  nomad_war_planet_0_MEGASTRUCTURE_DETAILS: "$giga_list_category_gigastructure$ - $giga_list_category_nomad_warship$ - $giga_list_category_ship_production$\nA massive warship made to fight celestials on their own terms.\n§LThe $giga_nomad_war_planet_cap$ is the fully realized prototype of the $giga_nomad_war_moon$, fixing its defensive weaknesses while also improving its already incredible lethality."
  nomad_war_planet_1: "$giga_nomad_war_planet$ Hull"
  nomad_war_planet_1_DESC: "The $giga_nomad_war_planet$'s internal systems have been installed the vast hull. A gigantically gigantic reactor is installed within the armored citadel, capable of powering the most powerful weapons."
  nomad_war_planet_2: "$giga_nomad_war_planet$ Defensive Arrays"
  nomad_war_planet_2_DESC: "Installed defensive systems allow this massive warship to absorb damage that would sunder worlds."
  nomad_war_planet_3: "$giga_nomad_war_planet$"
  nomad_war_planet_3_DESC: "A completed $giga_nomad_war_planet$, ready to take to the stars."
  nomad_war_planet_debris: "Wrecked $giga_nomad_war_planet$"
  nomad_war_planet_debris_DESC: "The remnants of a massive warship built by an advanced civilization, which has remained largely intact due to its massively armored hull. It once possessed some of the largest weaponry known to the galaxy, and although it has taken quite the beating, it might be possible to restore this fearsome craft to its former glory, provided we have plenty of resources and the technology to do so."
  nomad_war_planet_debris_MEGASTRUCTURE_DETAILS: "$nomad_war_planet_0_MEGASTRUCTURE_DETAILS$"
  nomad_war_planet_restored: "$nomad_war_planet_3$"
  nomad_war_planet_restored_DESC: "$nomad_war_planet_3_DESC$"
  nomad_war_planet_restored_MEGASTRUCTURE_DETAILS: "$war_planet_0_MEGASTRUCTURE_DETAILS$"
  giga_nomad_dialog.050.name: "$giga_nomad_war_planet$ Construction Site Built"
  giga_nomad_dialog.050.desc: "The Construction Site for a future $giga_nomad_war_planet$ is now complete. This deep-space construction site will serve as a staging depot in order to begin constructing the $giga_nomad_war_planet$ itself.\n\n§INOTE: Don't forget to design the $giga_nomad_war_planet$ in the ship designer!§!"
  giga_nomad_dialog.050.a: "Marvelous."
  giga_nomad_dialog.052.name: "$giga_nomad_war_planet$ Hull Complete"
  giga_nomad_dialog.052.desc: "The hull of the $giga_nomad_war_planet$ is now complete! All general systems have been installed, including the massive planetary scale reactor, capable of powering the ship's future thrusters and main weapons."
  giga_nomad_dialog.052.a: "One step closer."
  giga_nomad_dialog.053.name: "$giga_nomad_war_planet$ Defensive Systems Complete"
  giga_nomad_dialog.053.desc: "Our $giga_nomad_war_planet$'s defensive systems have been completed. Kilometers thick steel stands behind planetary strength shields, all mounted on a massive frame with an equally massive and over-engineered FTL Drive. The final step is to install the weapons systems."
  giga_nomad_dialog.053.a: "We are close."
  giga_nomad_dialog.054.name: "The Chariot of Judgement is at Hand"
  giga_nomad_dialog.054.desc: "We have done it. With the $giga_nomad_war_planet$ main weapon arrays completed, this monstrous spaceship is now operational. Over ten thousand kilometers long, this truly massive construct is the logical evolution of the the $giga_nomad_war_moon$. The ship has engaged its engines, and is now ready to join our fleets."
  giga_nomad_dialog.054.a: "Truly a marvelous accomplishment."
  MESSAGE_NOMAD_WAR_PLANET_DESTROYED: "$giga_nomad_war_planet$ Destroyed"
  MESSAGE_NOMAD_WAR_PLANET_DESTROYED_DESC: "The $NOMAD_CELESTIAL_WARSHIP_NAME|Y$ $giga_nomad_war_planet$ has been destroyed by the $ENEMY_NAME|Y$ in the $SYSTEM_NAME|Y$ system.\n\nIt has been reduced to an immobile wreck which may be repaired if we have the necessary resources and are friendly with the system owner, if they exist."
  giga_nomad_dialog.060.name: "$giga_nomad_war_planet$ Dismantled"
  giga_nomad_dialog.060.desc: "We have dismantled the incomplete $giga_nomad_war_planet$ found within the [giga_debris_system.GetName] system."
  giga_nomad_dialog.060.a: "Good."
  giga_nomad_dialog.063.name: "Wrecked $giga_nomad_war_planet$ Scrapped"
  giga_nomad_dialog.063.desc: "Our scavenging teams have now completed the dismantlement of the ruined $giga_nomad_war_planet$ found within the [giga_debris_system.GetName] system. The dismantlement of the $giga_nomad_war_planet$'s colossal weapons array and movement systems has netted us significant amounts of alloys and engineering research."
  giga_nomad_dialog.063.a: "Good."
  giga_nomad_actions.551.name: "$giga_nomad_war_planet$ Repaired!"
  giga_nomad_actions.551.desc: "Wonderful news! We have managed to restore the ruined $giga_nomad_war_planet$ in the §Y[from.GetName]§! system. It has taken quite a lot of work, and most of its internals had to be completely rebuilt from scratch, but this mighty warship is now operational once more."
  giga_nomad_actions.551.a: "Wonderful."
  giga_nomad_war_planet_disband_activity_key: "Disband this $giga_nomad_war_planet$"
  giga_nomad_war_planet_disband_title: "Disband this $giga_nomad_war_planet$"
  giga_nomad_war_planet_disband_button: "Due to hero ships not being disbandable, this will let you destroy your own $giga_nomad_war_planet$.\n\n§ROBVIOUSLY THIS KILLS THE SHIP§!"
  giga_nomad_actions.560.name: "Disband [this.fleet.GetName]?"
  giga_nomad_actions.560.desc: "Do you wish to disband the $giga_nomad_war_planet$ [this.fleet.GetName]?"
  giga_nomad_actions.560.no: "I WANT TO KEEP MY SHIP"
  giga_nomad_actions.560.yes: "§RBLOW IT UP!§!"
  giga_nomad_actions.560.yes.tt: "§ROBVIOUSLY THIS KILLS THE SHIP, WITH NO DEBRIS§!"
  giga_tech_arkship_neutronium_harvester: "$giga_tech_neutronium_gigaforge$" # 15675661280339453702
  giga_tech_arkship_neutronium_harvester_desc: "$arkship_cap_plural$에게 $pc_neutron_star_plural$와 같은 항성 잔해를 채굴할 수단을 제공함으로써, 우리는 앞으로 수억 년 동안 귀중한 합금의 안정적인 공급원을 보장할 수 있습니다." # 1964763213089507739
