  giga_nomad_claim_unowned_nomad_compat_megas: "소유자 없는 유목민 호환 거대건축물 영유권 주장" # 3436493089386037577
  giga_nomad_claim_unowned_nomad_compat_megas_desc: "이 성계에 유목민이 사용할 수 있는 소유자 없는 거대건축물이 있는 경우, 이 결정을 통해 정당한 영유권을 주장할 수 있습니다." # 13367416677921822968
  giga_nomad_claim_unowned_nomad_compat_megas_effect: "이 성계 내의 모든 §Y유목민 호환 거대건축물§!이 우리 직속 통제로 이전됩니다." # 8214276214899418657
  giga_nomad_claim_unowned_nomad_compat_megas_fail1: "$TRIGGER_FAIL$성계는 주인이 없어야 합니다." # 11160348320888012898
  giga_nomad_claim_unowned_nomad_compat_megas_fail2: "$TRIGGER_FAIL$이 성계에 유목민과 호환되는 소유자 없는 거대건축물이 없습니다." # 5719864648874391011
