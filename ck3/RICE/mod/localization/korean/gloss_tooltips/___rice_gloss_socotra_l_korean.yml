# PAT verified upstream: f8e5fcd
  SEVEN_SEAS_GLOSS: "비록 해적의 황금시대의 전형적인 해적과 연관되는 경향이 있지만, 전 세계 바다 전체를 비유하는 표현으로서의 #Bold 일곱 바다#!는 고대로 거슬러 올라갑니다. 고대 및 중세 시대에 “일곱 바다”의 목록은 누구에게 묻느냐에 따라 달랐습니다. 예를 들어, 중세 아랍 문학에서는 일곱 바다를 페르시아만, 아라비아해, 벵골만, 말라카 해협, 싱가포르 해협, 태국만, 남중국해로 정의했습니다." # 7126948937658819934
  ERYTHRAEAN_SEA_GLOSS: "고대 그리스인들은 아덴만(예멘과 아프리카의 뿔 사이)의 바다를 묘사하기 위해 #Bold 에리트레아 해#!라는 용어를 사용했으며, 때로는 홍해, 페르시아만, 아라비아해, 인도양의 일부를 포함하여 그 너머까지 지칭하기도 했습니다." # 3613699128269672990
  MODERN_SOUTH_ARABIAN_LANGUAGES_GLOSS: "#Bold 현대 남아라비아어파#! (또는 MSAL)는 예멘과 오만 토상의 셈어파에 속하는 소멸 위기의 언어군으로, 메흐리어와 소코트리어가 포함됩니다. 이들은 예멘의 고대 언어들을 다루는 별개의 셈어파 갈래인 고대 남아라비아어와 혼동해서는 안 되며, 그 후손도 아닙니다." # 14092921943456055912
  OLD_SOUTH_ARABIAN_LANGUAGES_GLOSS: "#Bold 고대 남아라비아어파#! (또는 OSAL)는 사바와 하다라마우트 같은 이슬람 이전 남아라비아의 고대 왕국들에서 사용되던 셈어파의 한 갈래였습니다. 이들은 예멘과 오만의 여러 소멸 위기 언어로 구성된 별개의 셈어파 갈래인 현대 남아라비아어와 혼동해서는 안 되며, 그 조상도 아닙니다. 라지히어, 파이피어, 리잘 알마어를 포함하여 서예멘 산악 지대에서 사용되는 여러 현대 언어들은 고대 남아라비아어파의 특징을 보존하고 있으나, 이것이 고대 남아라비아어파의 잔재인지에 대한 분류는 논란이 있습니다." # 14638012581173548575
